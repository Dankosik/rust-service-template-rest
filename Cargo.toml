[workspace]
resolver = "3"
members = ["crates/*", "test"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Dankosik/rust-service-template-rest"
publish = false

# One version per dependency for the whole workspace. Crates reference these
# with `workspace = true` and enable only the features they need.
[workspace.dependencies]
# Workspace crates
service-config = { path = "crates/config" }
health = { path = "crates/health" }
infra-http = { path = "crates/infra-http" }
# template:begin authn:workspace-authn-crate
infra-bearerauthn = { path = "crates/infra-bearerauthn" }
# template:end authn:workspace-authn-crate
# template:begin egress-dns:workspace-egress-dns-crate
infra-egress-dns = { path = "crates/infra-egress-dns" }
# template:end egress-dns:workspace-egress-dns-crate
# template:begin postgres:workspace-postgres-crates
infra-postgres = { path = "crates/infra-postgres" }
# template:end postgres:workspace-postgres-crates
infra-telemetry = { path = "crates/infra-telemetry" }
# template:begin postgres:workspace-migrate-crate
migrate = { path = "crates/migrate" }
# template:end postgres:workspace-migrate-crate
# template:begin http-idempotency:workspace-http-idempotency-store
infra-idempotency-store = { path = "crates/infra-idempotency-store" }
# template:end http-idempotency:workspace-http-idempotency-store
# template:begin jobs:workspace-jobs-crates
infra-jobs = { path = "crates/infra-jobs" }
jobs-worker = { path = "crates/jobs-worker" }
# template:end jobs:workspace-jobs-crates

# template:begin postgres:workspace-postgres-dependencies
# Persistence (docs/architecture/persistence.md). `macros` only where
# `sqlx::migrate!` or `#[sqlx::test]` is used.
sqlx = { version = "0.9.0", default-features = false }
log = { version = "0.4", default-features = false }
# template:end postgres:workspace-postgres-dependencies
# template:begin http-idempotency:workspace-http-idempotency-digest
# Idempotency scope and fingerprint digests (docs/http-idempotency.md). The
# same release `sqlx-postgres` already resolves, with the same features.
sha2 = { version = "0.11.0", default-features = false }
# template:end http-idempotency:workspace-http-idempotency-digest

# Runtime and transport
futures-util = { version = "0.3", default-features = false }
axum = { version = "0.8.9", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
http-body-util = "0.1.5"
tokio = { version = "1.53.1", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false }

# API contract (docs/architecture/http.md). The document is derived from the
# handlers and committed as api/openapi/service.yaml.
utoipa = { version = "5.5.0", default-features = false }
utoipa-axum = { version = "0.2.0", default-features = false }

# Configuration (docs/configuration-source-policy.md)
config = { version = "0.15.25", default-features = false }
clap = { version = "4.6.7", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
toml = { version = "1.1.6", default-features = false }
humantime = "2.4.0"
humantime-serde = "1.1.1"
bytesize = { version = "2.7.0", default-features = false }
secrecy = { version = "0.10.3", default-features = false }
gethostname = "1.1.0"

# Diagnostics (docs/configuration-source-policy.md). The OpenTelemetry family
# moves together; tracing-opentelemetry is one minor ahead.
tracing = { version = "0.1.44", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false }
json-subscriber = { version = "0.3.0", default-features = false }
opentelemetry = { version = "0.32.0", default-features = false }
opentelemetry_sdk = { version = "0.32.1", default-features = false }
opentelemetry-otlp = { version = "0.32.0", default-features = false }
opentelemetry-semantic-conventions = { version = "0.32.1", default-features = false }
tracing-opentelemetry = { version = "0.33.0", default-features = false }
axum-tracing-opentelemetry = { version = "0.39.1", default-features = false }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
axum-prometheus = { version = "0.10.1", default-features = false }
metrics-process = { version = "2.4.3", default-features = false }
tokio-metrics = { version = "0.5.2", default-features = false }
thiserror = { version = "2.0.20", default-features = false }

strum = { version = "0.28.0", default-features = false }

# Utility toolkit (docs/backend-utility-recipes.md).
# Declarations are not runtime dependencies; each owner opts in below.
url = { version = "2.5", default-features = false }
async-trait = { version = "0.1.92", default-features = false }
serde_with = { version = "3.23.0", default-features = false }
derive_more = { version = "2.1.1", default-features = false }
itertools = { version = "0.15.0", default-features = false }
axum-extra = { version = "0.12.6", default-features = false }
indexmap = { version = "2.14.2", default-features = false }
heck = { version = "0.5.0", default-features = false }
bstr = { version = "1.13.1", default-features = false }
regex = { version = "1.13.1", default-features = false }
unicode-normalization = { version = "0.1.25", default-features = false }
unicode-segmentation = { version = "1.13", default-features = false }
strsim = { version = "0.11.1", default-features = false }
fs-err = { version = "3", default-features = false }
walkdir = { version = "2.5", default-features = false }
camino = { version = "1", default-features = false }
csv = { version = "1", default-features = false }
base64 = { version = "0.23.1", default-features = false }
ipnet = { version = "2", default-features = false }
semver = { version = "1", default-features = false }
bytes = { version = "1", default-features = false }
json-patch = { version = "4", default-features = false }
uuid = { version = "1", default-features = false }
rust_decimal = { version = "1", default-features = false }
time = { version = "0.3.55", default-features = false }
bon = { version = "3.10.1", default-features = false }
validator = { version = "0.21.0", default-features = false }
insta = { version = "1.48.0", default-features = false }
proptest = { version = "1.11.0", default-features = false }
backon = { version = "1.6.0", default-features = false }
moka = { version = "0.12.16", default-features = false }
wiremock = { version = "0.6.5", default-features = false }
reqwest = { version = "0.13.5", default-features = false }
# template:begin egress-dns:workspace-egress-dns
hickory-resolver = { version = "0.26.3", default-features = false }
# template:end egress-dns:workspace-egress-dns
# template:begin oidc-jwt:workspace-authn-jwt
jsonwebtoken = { version = "=11.1.0", default-features = false }
aws-lc-rs = { version = "=1.18.1", default-features = false }
# template:end oidc-jwt:workspace-authn-jwt

# Build metadata
vergen-gitcl = { version = "10.0.3", default-features = false }

# Test support
axum-test = { version = "21.1.0", default-features = false }
rstest = { version = "0.27.0", default-features = false }
tempfile = "3"
nix = { version = "0.31.3", default-features = false }
ureq = { version = "3.4.2", default-features = false }
# template:begin tls-fixtures:workspace-tls-fixtures
tokio-rustls = { version = "0.26.5", default-features = false }
# template:end tls-fixtures:workspace-tls-fixtures

# Lints apply to every crate that opts in with `[lints] workspace = true`.
# `make lint` promotes warnings to errors; keep the levels here at `warn` so
# local builds stay usable while a fix is in progress.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Module names repeat in paths by design (`health::health_ready` reads worse).
module_name_repetitions = "allow"

[profile.release]
# Matches the Go template's stripped release binary. LTO and codegen-unit
# choices wait for the delivery stage, where image size and build time are
# measured rather than assumed.
strip = true
