[package]
name = "infra-http-transport"
description = "Shared bounded HTTP listener and admission for REST and gRPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
hyper-util = { workspace = true, features = [
    "server", "service", "tokio", "http1",
    # template:begin grpc:transport-http2-feature
    "http2",
    # template:end grpc:transport-http2-feature
] }
metrics = { workspace = true }
shared-rules = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = [
    "rt",
    # template:begin grpc:transport-read-inspection-feature
    "io",
    # template:end grpc:transport-read-inspection-feature
] }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true, features = ["std"] }
# template:begin grpc:transport-tls-dependencies
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
# template:end grpc:transport-tls-dependencies

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
nix = { workspace = true }

[dev-dependencies]
# template:begin grpc:transport-http2-client-tests
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http2"] }
tls-test-support = { workspace = true }
# template:end grpc:transport-http2-client-tests
tokio = { workspace = true, features = ["rt-multi-thread", "io-util", "test-util"] }
