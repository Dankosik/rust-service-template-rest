[package]
name = "infra-postgres"
description = "PostgreSQL adapter: DSN admission, pool with template timeouts, readiness probe, transaction seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
health = { workspace = true }
# `sqlx::ConnectOptions` takes statement-log levels as `log::LevelFilter`.
log = { workspace = true }
metrics = { workspace = true }
# `uuid`: the driver's UUID codec belongs to the PostgreSQL profile, so the
# resolved sqlx graph is the same whichever optional packs are retained.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
tokio-util = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
