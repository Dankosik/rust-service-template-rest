[package]
name = "infra-postgres"
description = "PostgreSQL adapter: DSN admission, pool with template timeouts, readiness probe, transaction seam."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
# `Stream`, to wrap a statement's result stream.
futures-util = { workspace = true }
health = { workspace = true }
# `sqlx::ConnectOptions` takes statement-log levels as `log::LevelFilter`.
log = { workspace = true }
metrics = { workspace = true }
# `macros` turns on the driver's offline support, which adds a method to
# `sqlx::Executor`. `Tx` implements that trait, so the method set has to be
# the same whichever workspace crates are built together.
# `uuid`: the driver's UUID codec belongs to the PostgreSQL profile, so the
# resolved sqlx graph is the same whichever optional packs are retained.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "uuid"] }
thiserror = { workspace = true }
# `fs`: the password file is read again while the service runs.
tokio = { workspace = true, features = ["time", "macros", "fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
