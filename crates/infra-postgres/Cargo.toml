[package]
name = "infra-postgres"
description = "PostgreSQL adapter: DSN admission, pool with template timeouts, readiness probe, transaction seam, pool and maintenance signals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
hotpath = []

[dependencies]
enum-map = { workspace = true, features = ["derive"] }
foldhash = { workspace = true, features = ["std"] }
futures-util = { workspace = true }
health = { workspace = true }
# `sqlx::ConnectOptions` takes statement-log levels as `log::LevelFilter`.
log = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
shared-rules = { workspace = true }
smallvec = { workspace = true }
# `macros` turns on the driver's offline support, which adds a method to
# `sqlx::Executor`. `Tx` implements that trait, so the method set has to be
# the same whichever workspace crates are built together.
# `uuid`: the driver's UUID codec belongs to the PostgreSQL profile, so the
# resolved sqlx graph is the same whichever optional packs are retained.
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "rt", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
metrics-util = { workspace = true, features = ["debugging"] }
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
