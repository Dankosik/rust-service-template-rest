[package]
name = "infra-cache"
description = "Optional Redis-compatible cache client. Bytes only; callers own keys and TTL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Real Valkey tests run only through the explicit cache integration owner.
integration = []

[[test]]
name = "valkey"
path = "tests/valkey.rs"
required-features = ["integration"]

[lints]
workspace = true

[dependencies]
operation-context = { workspace = true }
async-trait = { workspace = true }
backon = { workspace = true, features = ["std"] }
derive_more = { workspace = true, features = ["debug"] }
enum-map = { workspace = true, features = ["derive"] }
futures-util = { workspace = true, features = ["alloc"] }
health = { workspace = true }
metrics = { workspace = true }
redis = { workspace = true, features = [
    "tokio-comp",
    "tokio-rustls-comp",
] }
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
secrecy = { workspace = true }
shared-rules = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
tracing-log = { workspace = true, features = ["std", "log-tracer"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "registry"] }
base64 = { workspace = true, features = ["std"] }
metrics-exporter-prometheus = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
