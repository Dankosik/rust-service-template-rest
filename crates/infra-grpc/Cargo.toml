[package]
name = "infra-grpc"
description = "Native gRPC transport over tonic and the shared HTTP listener."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
async-stream = { workspace = true }
atomic-take = { workspace = true }
derive-where = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
foldhash = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
operation-context = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
health = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"] }
infra-http = { workspace = true }
# template:begin authn:grpc-bearer-dependency
infra-bearerauthn = { workspace = true }
# template:end authn:grpc-bearer-dependency
# template:begin service-auth:grpc-service-auth-dependency
infra-serviceauth = { workspace = true }
# template:end service-auth:grpc-service-auth-dependency
metrics = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
prost = { workspace = true, features = ["std"] }
prost-types = { workspace = true, features = ["std"] }
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
secrecy = { workspace = true }
service-failure = { workspace = true }
shared-rules = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tonic = { workspace = true, features = ["router", "channel", "server", "codegen", "tls-aws-lc", "tls-native-roots"] }
tonic-health = { workspace = true }
tonic-reflection = { workspace = true, features = ["server"] }
tonic-types = { workspace = true }
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-opentelemetry = { workspace = true }
tracing-opentelemetry-instrumentation-sdk = { workspace = true }

[dev-dependencies]
grpc-contracts = { workspace = true }
rustls = { workspace = true, features = ["tls12"] }
# template:begin grpc-transport-tests:grpc-transport-test-dependencies
hyper = { workspace = true, features = ["client", "http1", "http2", "server"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
# template:end grpc-transport-tests:grpc-transport-test-dependencies
# template:begin oidc-introspection:grpc-introspection-test-url
url = { workspace = true }
# template:end oidc-introspection:grpc-introspection-test-url
# template:begin authn:grpc-bearer-test-dependency
infra-bearerauthn = { workspace = true, features = ["test-support"] }
# template:end authn:grpc-bearer-test-dependency
metrics-exporter-prometheus = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
# template:begin service-auth:grpc-service-auth-test-dependencies
infra-serviceauth = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true, features = ["std"] }
# template:end service-auth:grpc-service-auth-test-dependencies
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "test-util"] }
