[package]
name = "infra-grpc"
description = "Native gRPC transport over tonic and the shared HTTP listener."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
health = { workspace = true }
http = { workspace = true }
infra-http = { workspace = true }
# template:begin authn:grpc-bearer-dependency
infra-bearerauthn = { workspace = true }
# template:end authn:grpc-bearer-dependency
metrics = { workspace = true }
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
service-failure = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tonic = { workspace = true, features = ["router", "channel", "server", "codegen", "tls-aws-lc", "tls-native-roots"] }
tonic-health = { workspace = true }
tonic-types = { workspace = true }
tower = { workspace = true, features = ["util", "limit", "load-shed"] }
tower-http = { workspace = true, features = ["catch-panic"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-opentelemetry = { workspace = true }
tracing-opentelemetry-instrumentation-sdk = { workspace = true }

[dev-dependencies]
grpc-contracts = { workspace = true }
hyper = { workspace = true, features = ["client", "http2"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true, features = ["tls12"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
# template:begin authn:grpc-bearer-test-dependency
infra-bearerauthn = { workspace = true, features = ["test-support"] }
secrecy = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
# template:end authn:grpc-bearer-test-dependency
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
tokio = { workspace = true, features = ["macros", "net", "io-util", "rt-multi-thread", "sync", "test-util"] }
