[package]
name = "infra-oauth2-client-credentials"
description = "Private OAuth2 client credentials for bounded outbound integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# template:begin outbound-auth-grpc:oauth-grpc-feature
[features]
default = ["grpc"]
grpc = ["dep:infra-grpc", "dep:tonic", "dep:tower"]
# template:end outbound-auth-grpc:oauth-grpc-feature

[dependencies]
# template:begin outbound-auth-grpc:oauth-grpc-dependencies
infra-grpc = { workspace = true, optional = true }
tonic = { workspace = true, optional = true, features = ["codegen"] }
tower = { workspace = true, optional = true }
# template:end outbound-auth-grpc:oauth-grpc-dependencies
bytes = { workspace = true, features = ["std"] }
http = { workspace = true }
infra-outbound-http = { workspace = true }
metrics = { workspace = true }
moka = { workspace = true, features = ["future"] }
oauth2 = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
infra-outbound-http = { workspace = true, features = ["test-support"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "sync", "time", "net", "io-util"] }
