[package]
name = "infra-oauth2-client-credentials"
description = "Private OAuth2 client credentials for bounded outbound integrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# template:begin outbound-auth-grpc:oauth-grpc-feature
default = ["grpc"]
grpc = ["dep:infra-grpc", "dep:tonic", "dep:tower"]
# template:end outbound-auth-grpc:oauth-grpc-feature
# The Keycloak suite runs only through the explicit integration owner
# (scripts/ci/test-integration-oauth.sh).
integration = []

[dependencies]
# template:begin outbound-auth-grpc:oauth-grpc-dependencies
infra-grpc = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
# template:end outbound-auth-grpc:oauth-grpc-dependencies
aws-lc-rs = { workspace = true, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
bytes = { workspace = true, features = ["std"] }
http = { workspace = true }
infra-outbound-http = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
metrics = { workspace = true }
moka = { workspace = true, features = ["future"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# template:begin outbound-auth-grpc:oauth-grpc-test-dependencies
grpc-contracts = { workspace = true }
hyper = { workspace = true, features = ["server", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "service"] }
tonic-prost = { workspace = true }
tower = { workspace = true, features = ["util"] }
# template:end outbound-auth-grpc:oauth-grpc-test-dependencies
infra-outbound-http = { workspace = true, features = ["test-support"] }
metrics-exporter-prometheus = { workspace = true }
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "sync", "time", "net", "io-util"] }
