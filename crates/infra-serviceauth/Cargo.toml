[package]
name = "infra-serviceauth"
description = "Caller-signed service tokens: trust registry, verifier and token source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
arc-swap = { workspace = true }
aws-lc-rs = { workspace = true, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
base64 = { workspace = true, features = ["alloc"] }
derive_more = { workspace = true, features = ["debug", "display"] }
enum-map = { workspace = true, features = ["derive"] }
http = { workspace = true, features = ["std"] }
indexmap = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs", "use_pem"] }
metrics = { workspace = true }
foldhash = { workspace = true, features = ["std"] }
moka = { workspace = true, features = ["sync"] }
parking_lot = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
shared-rules = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
metrics-util = { workspace = true, features = ["debugging"] }
proptest = { workspace = true, features = ["std"] }
regex = { workspace = true, features = ["std"] }
