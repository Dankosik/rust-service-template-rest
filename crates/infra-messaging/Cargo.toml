[package]
name = "infra-messaging"
description = "Bounded JetStream publication and typed Go-compatible event delivery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
integration = []

[[example]]
name = "dlq_recovery"
path = "examples/dlq_recovery.rs"
required-features = ["integration"]
test = true

[[test]]
name = "jetstream"
path = "tests/jetstream/main.rs"
required-features = ["integration"]

[[test]]
name = "idle_pull"
path = "tests/idle_pull.rs"
required-features = ["integration"]

[[test]]
name = "credential_rotation"
path = "tests/credential_rotation.rs"
required-features = ["integration"]

[lints]
workspace = true

[dependencies]
arrayvec = { workspace = true, features = ["std"] }
bstr = { workspace = true, features = ["std"] }
compact_str = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
derive-where = { workspace = true }
enum-map = { workspace = true, features = ["derive"] }
const-hex = { workspace = true }
operation-context = { workspace = true }
async-nats = { workspace = true, features = ["jetstream", "server_2_10", "aws-lc-rs", "nkeys"] }
async-trait = { workspace = true }
# template:begin outbox:messaging-outbox-dependencies
# The outbox adapter prepares jobs through the canonical jobs transaction and
# deliberately has no direct queue SQL or pool ownership.
infra-jobs = { workspace = true }
infra-postgres = { workspace = true }
base64 = { workspace = true }
serde_with = { workspace = true, features = ["std", "base64"] }
simdutf8 = { workspace = true, features = ["std"] }
uuid = { workspace = true }
# template:end outbox:messaging-outbox-dependencies
bytes = { workspace = true, features = ["std"] }
domain-events = { workspace = true }
foldhash = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["std"] }
health = { workspace = true }
json-payload = { workspace = true }
metrics = { workspace = true }
nkeys = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
secrecy = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
shared-rules = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["std", "formatting", "parsing"] }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }
tracing-opentelemetry = { workspace = true }
# utoipa 6.0.0 names `crate::utoipa::Number` in schema fields that exist
# without `macros`, so the library alone does not compile without it.
utoipa = { workspace = true, features = ["macros"] }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
base64 = { workspace = true, features = ["std"] }
metrics-exporter-prometheus = { workspace = true }
nats-test-support = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing", "trace"] }
proptest = { workspace = true, features = ["std"] }
rcgen = { workspace = true, features = ["crypto", "pem", "aws_lc_rs"] }
serde_with = { workspace = true, features = ["std", "macros", "base64"] }
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "net", "io-util"] }
time = { workspace = true, features = ["macros", "parsing"] }
const-hex = { workspace = true, features = ["alloc"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tracing-subscriber = { workspace = true, features = ["std", "registry"] }
