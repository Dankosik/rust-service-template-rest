[package]
name = "tls-test-support"
description = "Throwaway CA and server certificates for TLS tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["service", "tokio"] }
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
tokio = { workspace = true, features = ["net", "rt", "macros"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
tokio-util = { workspace = true }
