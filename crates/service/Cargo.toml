[package]
name = "service"
description = "Service entrypoint and runtime composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

# The library holds the API contract assembly (`api`); the `service` binary
# is the runtime, and `openapi` renders the committed document from the same
# assembly.
[[bin]]
name = "service"
path = "src/main.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[lints]
workspace = true

[dependencies]
gethostname = { workspace = true }
health = { workspace = true }
infra-http = { workspace = true }
infra-postgres = { workspace = true }
infra-telemetry = { workspace = true }
secrecy = { workspace = true }
service-config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std", "attributes"] }
utoipa = { workspace = true, features = ["macros", "yaml"] }
utoipa-axum = { workspace = true }

[build-dependencies]
vergen-gitcl = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true, features = ["std"] }
ureq = { workspace = true }
