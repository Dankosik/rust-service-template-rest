[package]
name = "service"
description = "Service entrypoint and runtime composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
infra-http = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util"] }
