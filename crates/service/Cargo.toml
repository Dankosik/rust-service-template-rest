[package]
name = "service"
description = "Service entrypoint and runtime composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The library holds the API contract assembly (`api`); the `service` binary
# is the runtime, and `openapi` renders the committed document from the same
# assembly.
[lib]
name = "service"

[[bin]]
name = "service"
path = "src/main.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[lints]
workspace = true

[dependencies]
gethostname = { workspace = true }
health = { workspace = true }
infra-http = { workspace = true }
# template:begin inbound-webhooks:service-webhooks-dependency
infra-webhooks = { workspace = true }
webhook-consumers = { workspace = true }
# template:end inbound-webhooks:service-webhooks-dependency
# template:begin authn:service-authn-dependency
infra-bearerauthn = { workspace = true }
# template:end authn:service-authn-dependency
# template:begin postgres:service-postgres-dependency
infra-postgres = { workspace = true }
migrate = { workspace = true }
secrecy = { workspace = true }
# template:end postgres:service-postgres-dependency
# template:begin http-idempotency:service-http-idempotency-dependency
infra-idempotency-store = { workspace = true }
# template:end http-idempotency:service-http-idempotency-dependency
infra-telemetry = { workspace = true }
service-config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std", "attributes"] }
utoipa = { workspace = true, features = ["macros", "yaml"] }
utoipa-axum = { workspace = true }

[dev-dependencies]
# template:begin authn:service-authn-test-dependencies
axum = { workspace = true }
# template:end authn:service-authn-test-dependencies
rstest = { workspace = true }
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true, features = ["std"] }
ureq = { workspace = true }
