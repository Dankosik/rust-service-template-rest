[package]
name = "service"
description = "Service entrypoint and runtime composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "service"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum-prometheus = { workspace = true, features = ["prometheus"] }
gethostname = { workspace = true }
health = { workspace = true }
infra-http = { workspace = true }
infra-telemetry = { workspace = true }
secrecy = { workspace = true }
service-config = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std", "attributes"] }

[build-dependencies]
vergen-gitcl = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true, features = ["std"] }
ureq = { workspace = true }
