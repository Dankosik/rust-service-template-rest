[package]
name = "service"
description = "Service entrypoint and runtime composition root."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "service"

[[bin]]
name = "service"
path = "src/main.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[lints]
workspace = true

[features]
hotpath = [
    "dep:hotpath", "hotpath/hotpath", "hotpath/threads", "hotpath/tokio",
    "infra-http/hotpath", "infra-telemetry/hotpath",
    # template:begin webhooks-common:service-hotpath-webhooks-feature
    "infra-webhooks/hotpath",
    # template:end webhooks-common:service-hotpath-webhooks-feature
    # template:begin postgres:service-hotpath-postgres-feature
    "infra-postgres/hotpath",
    # template:end postgres:service-hotpath-postgres-feature
]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-mcp = ["hotpath", "hotpath/hotpath-mcp"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dependencies]
futures-util = { workspace = true, features = ["std"] }
hotpath = { workspace = true, optional = true }
axum = { workspace = true, features = ["macros"] }
derive_more = { workspace = true, features = ["debug"] }
derive-where = { workspace = true }
health = { workspace = true }
infra-http = { workspace = true }
infra-http-transport = { workspace = true }
tikv-jemallocator = { workspace = true }
rlimit = { workspace = true }
# template:begin grpc:service-grpc-dependencies
infra-grpc = { workspace = true }
infra-outbound-grpc = { workspace = true }
# template:end grpc:service-grpc-dependencies
# template:begin cache:service-cache-dependency
infra-cache = { workspace = true }
# template:end cache:service-cache-dependency
# template:begin object-storage:service-object-storage-dependency
infra-object-storage = { workspace = true }
# template:end object-storage:service-object-storage-dependency
# template:begin outbound-http:service-outbound-http-dependency
infra-outbound-http = { workspace = true }
# template:end outbound-http:service-outbound-http-dependency
# template:begin outbound-auth:service-outbound-oauth-dependency
infra-oauth2-client-credentials = { workspace = true }
# template:end outbound-auth:service-outbound-oauth-dependency
# template:begin webhooks-common:service-webhooks-dependency
infra-webhooks = { workspace = true }
# template:end webhooks-common:service-webhooks-dependency
# template:begin authn:service-authn-dependency
infra-bearerauthn = { workspace = true }
# template:end authn:service-authn-dependency
# template:begin service-auth:service-service-auth-dependency
infra-serviceauth = { workspace = true }
# template:end service-auth:service-service-auth-dependency
# template:begin postgres:service-postgres-dependency
infra-postgres = { workspace = true }
migrate = { workspace = true }
# template:end postgres:service-postgres-dependency
# template:begin http-idempotency:service-http-idempotency-dependency
infra-idempotency-store = { workspace = true }
# template:end http-idempotency:service-http-idempotency-dependency
infra-telemetry = { workspace = true }
service-config = { workspace = true }
# template:begin service-secrets:service-secrecy-dependency
secrecy = { workspace = true }
# template:end service-secrets:service-secrecy-dependency
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std", "attributes"] }
utoipa = { workspace = true, features = ["macros", "yaml"] }

# jemalloc compiles background purging out of Mach-O builds and
# tikv-jemalloc-sys leaves it off on musl; the feature would bake
# `background_thread:true` into binaries that refuse it at startup.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true, features = ["background_threads"] }

[dev-dependencies]
# template:begin inbound-webhooks:service-webhooks-lifecycle-dependencies
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "migrate", "macros"] }
url = { workspace = true }
# template:end inbound-webhooks:service-webhooks-lifecycle-dependencies
# template:begin outbound-auth:service-outbound-oauth-test-key
infra-oauth2-client-credentials = { workspace = true, features = ["test-support"] }
# template:end outbound-auth:service-outbound-oauth-test-key
# template:begin service-test-tls:service-machine-auth-test-certificates
tls-test-support = { workspace = true }
# template:end service-test-tls:service-machine-auth-test-certificates
service-config = { workspace = true, features = ["test-support"] }
tower = { workspace = true, features = ["util"] }
similar = { workspace = true, features = ["text"] }
# template:begin grpc:service-grpc-example-dependencies
grpc-contracts = { workspace = true }
service-failure = { workspace = true }
tonic = { workspace = true, features = ["codegen", "channel", "tls-aws-lc"] }
# template:end grpc:service-grpc-example-dependencies
# template:begin runtime-progress:service-runtime-progress-dependencies
# The non-shipped quota example calls the adopted serializer with a finite
# primitive event. These are existing workspace versions, not runtime providers.
serde = { workspace = true, features = ["derive"] }
domain-events = { workspace = true }
infra-messaging = { workspace = true }
time = { workspace = true, features = ["std"] }
# template:end runtime-progress:service-runtime-progress-dependencies
# template:begin grpc-jwt:service-grpc-jwt-test-dependencies
# The process test (tests/grpc_process.rs). The runtime-progress proof implies
# this profile and also uses rcgen and tokio-rustls.
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
tonic-health = { workspace = true }
opentelemetry-proto = { workspace = true, features = ["gen-tonic-messages", "trace"] }
prost = { workspace = true }
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
# template:end grpc-jwt:service-grpc-jwt-test-dependencies
# template:begin service-auth:service-service-auth-test-dependency
infra-serviceauth = { workspace = true, features = ["test-support"] }
tonic-reflection = { workspace = true, features = ["server"] }
# template:end service-auth:service-service-auth-test-dependency
rstest = { workspace = true }
nix = { workspace = true, features = ["signal", "fs"] }
# template:begin service-test-tempfile:service-tempfile-dev-dependency
tempfile = { workspace = true, features = ["getrandom"] }
# template:end service-test-tempfile:service-tempfile-dev-dependency
tokio = { workspace = true, features = [
    "test-util", "io-util",
    # template:begin runtime-progress:service-runtime-progress-tokio-features
    "process", "fs",
    # template:end runtime-progress:service-runtime-progress-tokio-features
] }
serde_json = { workspace = true, features = ["std"] }
ureq = { workspace = true }
