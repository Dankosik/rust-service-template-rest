[package]
name = "infra-object-storage"
description = "Optional S3-compatible object storage client for one bucket at one fixed endpoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The emulator suite runs only through the explicit object storage
# integration owner (scripts/ci/test-integration-object-storage.sh).
integration = []

[[test]]
name = "emulator"
path = "tests/emulator.rs"
required-features = ["integration"]

[[test]]
name = "conformance"
path = "tests/conformance.rs"
required-features = ["integration"]

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
aws-sdk-s3 = { workspace = true, features = ["rt-tokio", "default-https-client"] }
aws-smithy-checksums = { workspace = true }
aws-smithy-http-client = { workspace = true, features = ["rustls-aws-lc"] }
bytes = { workspace = true, features = ["std"] }
health = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
metrics = { workspace = true }
secrecy = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1"] }
metrics-exporter-prometheus = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
