[package]
name = "infra-jobs"
description = "PostgreSQL durable background jobs: enqueue on the caller's transaction, job kinds, and the job engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
humantime = { workspace = true }
infra-postgres = { workspace = true }
metrics = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true, features = ["std"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "macros"] }
