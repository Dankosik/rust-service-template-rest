[package]
name = "infra-jobs"
description = "PostgreSQL durable background jobs: enqueue on the caller's transaction, job kinds, and the job engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
hotpath = ["dep:hotpath", "hotpath/hotpath"]

[dependencies]
operation-context = { workspace = true }
derive_more = { workspace = true, features = ["debug", "display"] }
enum-map = { workspace = true, features = ["derive"] }
hotpath = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["std"] }
humantime = { workspace = true }
infra-postgres = { workspace = true }
json-payload = { workspace = true }
metrics = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
shared-rules = { workspace = true }
sqlx = { workspace = true, features = ["macros", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true, features = ["std", "v4", "v7"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
regex = { workspace = true, features = ["std", "unicode"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "macros"] }
