[package]
name = "infra-webhooks"
description = "Standard Webhooks protocol and durable delivery and receipt adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []
hotpath = ["dep:hotpath", "hotpath/hotpath", "infra-jobs/hotpath"]

[dependencies]
hotpath = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
base64 = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
infra-jobs = { workspace = true }
infra-postgres = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_with = { workspace = true, features = ["std", "macros", "base64"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
# template:begin webhooks:webhooks-outbound-dependencies
httpdate = { workspace = true }
infra-outbound-http = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
# template:end webhooks:webhooks-outbound-dependencies
# template:begin inbound-webhooks:webhooks-inbound-dependencies
async-trait = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros"] }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
# template:end inbound-webhooks:webhooks-inbound-dependencies

[dev-dependencies]
# template:begin inbound-webhooks:webhooks-inbound-test-dependencies
tokio = { workspace = true, features = ["macros", "rt", "time"] }
# template:end inbound-webhooks:webhooks-inbound-test-dependencies
