[package]
name = "infra-webhooks"
description = "Standard Webhooks protocol and durable delivery and receipt adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# template:begin webhooks:webhooks-outbound-test-feature
[features]
default = []
test-support = ["infra-outbound-http/test-support"]
# template:end webhooks:webhooks-outbound-test-feature

[dependencies]
aws-lc-rs = { workspace = true, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
base64 = { workspace = true, features = ["std"] }
bytes = { workspace = true, features = ["std"] }
http = { workspace = true, features = ["std"] }
infra-jobs = { workspace = true }
infra-postgres = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
# template:begin webhooks:webhooks-outbound-dependencies
httpdate = { workspace = true }
infra-outbound-http = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
url = { workspace = true, features = ["std"] }
# template:end webhooks:webhooks-outbound-dependencies
# template:begin inbound-webhooks:webhooks-inbound-dependencies
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
# template:end inbound-webhooks:webhooks-inbound-dependencies
