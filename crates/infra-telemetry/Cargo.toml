[package]
name = "infra-telemetry"
description = "Logging subscriber, OpenTelemetry tracer provider, Prometheus metrics, diagnostics router."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
humantime = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
metrics-process = { workspace = true, features = ["metrics-rs"] }
opentelemetry = { workspace = true, features = ["trace"] }
# `reqwest-rustls` gives the exporter TLS (rustls + aws-lc-rs, system roots
# through the platform verifier); without it an https:// collector fails at
# export time with "URL scheme is not allowed".
# `gzip-http` lets the standard `OTEL_EXPORTER_OTLP_COMPRESSION=gzip` work;
# without it that variable fails the exporter build and tracing degrades.
opentelemetry-otlp = { workspace = true, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "gzip-http", "trace", "internal-logs"] }
opentelemetry-semantic-conventions = { workspace = true, features = ["semconv_experimental"] }
opentelemetry_sdk = { workspace = true, features = ["trace"] }
# The exporter's client when a standard trust variable names a certificate
# file; the same client and TLS stack `opentelemetry-otlp` builds by default.
reqwest = { workspace = true, features = ["blocking", "rustls"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros"] }
tokio-util = { workspace = true }
tokio-metrics = { workspace = true, features = ["rt", "metrics-rs-integration"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-log = { workspace = true, features = ["std"] }
tracing-opentelemetry = { workspace = true, features = ["tracing-log"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "env-filter", "registry", "tracing-log", "ansi"] }

[dev-dependencies]
futures-util = { workspace = true, features = ["std"] }
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
