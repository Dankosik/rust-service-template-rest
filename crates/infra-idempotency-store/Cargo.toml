[package]
name = "infra-idempotency-store"
description = "PostgreSQL record store for HTTP idempotency: arbitration, the execution transaction, readback, startup check, cleanup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
infra-postgres = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }
