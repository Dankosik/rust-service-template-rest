[package]
name = "infra-idempotency-store"
description = "PostgreSQL arbitration, atomic outcome storage and cleanup for HTTP idempotency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
derive_more = { workspace = true, features = ["debug"] }
http = { workspace = true, features = ["std"] }
infra-postgres = { workspace = true }
metrics = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["macros", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
