[package]
name = "infra-egress-dns"
description = "Public-address DNS admission and shared hardened HTTPS construction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Generated TLS material for the consumers' real-TLS tests; never enable it in
# a production dependency.
test-support = ["dep:rcgen"]

[dependencies]
thiserror = { workspace = true }
hickory-resolver = { workspace = true, features = ["tokio", "system-config"] }
reqwest = { workspace = true, features = ["rustls"] }
ipnet = { workspace = true, features = ["std"] }
rcgen = { workspace = true, optional = true, features = ["aws_lc_rs"] }
