[package]
name = "infra-http"
description = "HTTP transport adapter: router, health probes, and server lifecycle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "tower-log", "tracing"] }
tokio = { workspace = true, features = ["net", "rt", "sync"] }
tracing = { workspace = true, features = ["std"] }

[dev-dependencies]
http-body-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util"] }
tower = { workspace = true, features = ["util"] }
