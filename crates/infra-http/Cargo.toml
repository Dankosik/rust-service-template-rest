[package]
name = "infra-http"
description = "HTTP transport adapter: hardened middleware chain, problem details, health probes, bounded server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
hotpath = [
    "dep:hotpath", "hotpath/hotpath",
    # template:begin inbound-webhooks:http-hotpath-webhooks-feature
    "infra-webhooks/hotpath",
    # template:end inbound-webhooks:http-hotpath-webhooks-feature
]

[dependencies]
operation-context = { workspace = true }
hotpath = { workspace = true, optional = true }
service-failure = { workspace = true }
shared-rules = { workspace = true }
socket2 = { workspace = true, features = ["all"] }
serde_with = { workspace = true, features = ["std", "macros"] }
axum = { workspace = true, features = ["http1", "tokio", "matched-path", "original-uri", "tower-log", "tracing", "json", "query"] }
mime = { workspace = true }
itertools = { workspace = true, features = ["use_std"] }
health = { workspace = true }
# template:begin inbound-webhooks:http-webhooks-dependency
derive_more = { workspace = true, features = ["debug"] }
infra-webhooks = { workspace = true }
# template:end inbound-webhooks:http-webhooks-dependency
# template:begin authn:http-authn-dependency
infra-bearerauthn = { workspace = true }
secrecy = { workspace = true }
# template:end authn:http-authn-dependency
# template:begin http-idempotency:http-idempotency-dependencies
const-hex = { workspace = true }
infra-idempotency-store = { workspace = true }
infra-postgres = { workspace = true }
sha2 = { workspace = true }
sfv = { workspace = true, features = ["parsed-types"] }
smallvec = { workspace = true, features = ["const_generics"] }
# template:end http-idempotency:http-idempotency-dependencies
arc-swap = { workspace = true }
compact_str = { workspace = true, features = ["serde"] }
enum-map = { workspace = true, features = ["derive"] }
foldhash = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
metrics = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_path_to_error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["request-id", "set-header", "catch-panic"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-opentelemetry-instrumentation-sdk = { workspace = true, features = ["tracing_level_info"] }
tracing-opentelemetry = { workspace = true }
# template:begin grpc:http-tls-dependencies
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
# template:end grpc:http-tls-dependencies
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[dev-dependencies]
# template:begin inbound-webhooks:http-webhooks-test-dependencies
infra-postgres = { workspace = true }
# template:end inbound-webhooks:http-webhooks-test-dependencies
# template:begin grpc:http-tls-test-dependencies
http = { workspace = true }
hyper = { workspace = true, features = ["client", "http2"] }
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
# template:end grpc:http-tls-test-dependencies
uuid = { workspace = true, features = ["std"] }
axum-test = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util", "test-util"] }
tower = { workspace = true, features = ["util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
metrics-util = { workspace = true, features = ["debugging"] }
proptest = { workspace = true, features = ["std"] }
regex = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
