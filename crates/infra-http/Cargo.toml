[package]
name = "infra-http"
description = "HTTP transport adapter: hardened middleware chain, problem details, health probes, bounded server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
service-failure = { workspace = true }
serde_with = { workspace = true, features = ["std", "macros"] }
axum = { workspace = true, features = ["http1", "tokio", "matched-path", "original-uri", "tower-log", "tracing", "json"] }
axum-tracing-opentelemetry = { workspace = true, features = ["tracing_level_info"] }
health = { workspace = true }
# template:begin inbound-webhooks:http-webhooks-dependency
infra-webhooks = { workspace = true }
# template:end inbound-webhooks:http-webhooks-dependency
# template:begin authn:http-authn-dependency
infra-bearerauthn = { workspace = true }
secrecy = { workspace = true }
# template:end authn:http-authn-dependency
# template:begin http-idempotency:http-idempotency-dependencies
infra-idempotency-store = { workspace = true }
infra-postgres = { workspace = true }
sha2 = { workspace = true }
sfv = { workspace = true, features = ["parsed-types"] }
# template:end http-idempotency:http-idempotency-dependencies
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true, features = ["server", "server-auto", "server-graceful", "service", "tokio", "http1", "http2"] }
metrics = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
tower = { workspace = true, features = ["util", "limit", "load-shed", "timeout"] }
tower-http = { workspace = true, features = ["request-id", "set-header", "catch-panic", "limit"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tracing-opentelemetry-instrumentation-sdk = { workspace = true, features = ["tracing_level_info"] }
tracing-opentelemetry = { workspace = true }
# template:begin grpc:http-tls-dependencies
rustls = { workspace = true, features = ["std", "aws_lc_rs"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs"] }
# template:end grpc:http-tls-dependencies
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["v4", "fast-rng"] }

[dev-dependencies]
# template:begin grpc:http-tls-test-dependencies
http = { workspace = true }
hyper = { workspace = true, features = ["client", "http2"] }
rcgen = { workspace = true, features = ["pem", "crypto", "aws_lc_rs"] }
# template:end grpc:http-tls-test-dependencies
itertools = { workspace = true, features = ["use_std"] }
uuid = { workspace = true, features = ["std"] }
axum-test = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "io-util", "test-util"] }
tower = { workspace = true, features = ["util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true, features = ["registry"] }
