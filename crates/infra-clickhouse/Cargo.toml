[package]
name = "infra-clickhouse"
description = "Optional hardened ClickHouse HTTP/HTTPS client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
integration = []

[[test]]
name = "clickhouse"
path = "tests/clickhouse.rs"
required-features = ["integration"]

[lints]
workspace = true

[dependencies]
clickhouse = { workspace = true, features = ["lz4", "time", "uuid"] }
derive_more = { workspace = true, features = ["debug"] }
hyper-rustls = { workspace = true, features = ["aws-lc-rs", "http1", "tls12"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
operation-context = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
shared-rules = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["v4"] }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
serde = { workspace = true, features = ["derive"] }
tempfile = { workspace = true, features = ["getrandom"] }
tls-test-support = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt-multi-thread", "test-util"] }
