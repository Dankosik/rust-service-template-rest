[package]
name = "infra-bearerauthn"
description = "Bounded inbound bearer authentication and verified identity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
derive_more = { workspace = true, features = ["debug"] }
enum-map = { workspace = true, features = ["derive"] }
foldhash = { workspace = true, features = ["std"] }
indexmap = { workspace = true }
operation-context = { workspace = true }
# template:begin oidc-jwt:authn-jwt-dependency
arc-swap = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
# template:end oidc-jwt:authn-jwt-dependency
aws-lc-rs = { workspace = true, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
metrics = { workspace = true }
reqwest = { workspace = true, features = [
    "rustls",
# template:begin oidc-introspection:authn-introspection-reqwest-form
    "form",
# template:end oidc-introspection:authn-introspection-reqwest-form
] }
# `Principal::access_token()` retains the presented bearer token as a secret
# regardless of the selected engine, so this dependency is unconditional.
secrecy = { workspace = true }
moka = { workspace = true, features = [
  # template:begin oidc-introspection:authn-introspection-moka-future
  "future",
  # template:end oidc-introspection:authn-introspection-moka-future
  # template:begin oidc-jwt:authn-jwt-moka-sync
  "sync",
  # template:end oidc-jwt:authn-jwt-moka-sync
] }
# template:begin oidc-introspection:authn-secret-dependency
futures-util = { workspace = true, features = ["std"] }
parking_lot = { workspace = true }
# template:end oidc-introspection:authn-secret-dependency
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
shared-rules = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
bytes = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["async-await"] }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
metrics-util = { workspace = true, features = ["debugging"] }
# template:begin oidc-jwt:authn-jwt-dev-dependency
proptest = { workspace = true, features = ["std"] }
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
# template:end oidc-jwt:authn-jwt-dev-dependency
tls-test-support = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
tracing-subscriber = { workspace = true, features = ["std", "registry"] }
