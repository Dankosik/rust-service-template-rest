[package]
name = "infra-bearerauthn"
description = "Bounded inbound bearer authentication and verified identity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cargo-shear 1.14.0 scans target directories, missing the #[path] inclusion
# of test/fixtures/tls.rs. Remove this exception when it follows that source.
# The full template's jwks.rs also uses rcgen, so cargo-shear calls the
# exception redundant there; a projection without JWT keeps only the #[path] use.
[package.metadata.cargo-shear]
ignored = ["rcgen"]

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
derive_more = { workspace = true, features = ["debug"] }
operation-context = { workspace = true }
# template:begin oidc-jwt:authn-jwt-dependency
base64 = { workspace = true, features = ["alloc"] }
foldhash = { workspace = true, features = ["std"] }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
# template:end oidc-jwt:authn-jwt-dependency
aws-lc-rs = { workspace = true, features = ["alloc", "aws-lc-sys", "prebuilt-nasm"] }
metrics = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
# `Principal::access_token()` retains the presented bearer token as a secret
# regardless of the selected engine, so this dependency is unconditional.
secrecy = { workspace = true }
# The JWT engine uses the `sync` cache and the introspection engine the
# `future` one; a single entry serves both because a manifest has one key per
# crate.
moka = { workspace = true, features = ["future", "sync"] }
# template:begin oidc-introspection:authn-secret-dependency
futures-util = { workspace = true, features = ["std"] }
# template:end oidc-introspection:authn-secret-dependency
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
shared-rules = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
# template:begin oidc-jwt:authn-jwt-dev-dependency
proptest = { workspace = true, features = ["std"] }
# template:end oidc-jwt:authn-jwt-dev-dependency
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
