[package]
name = "infra-outbound-http"
description = "Bounded fixed-authority HTTPS exchange adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
infra-egress-dns = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
