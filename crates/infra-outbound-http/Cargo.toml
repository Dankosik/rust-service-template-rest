[package]
name = "infra-outbound-http"
description = "Bounded fixed-authority HTTPS exchange adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cargo-shear 1.13.4 scans target directories, missing the #[path] inclusion
# of test/fixtures/tls.rs. Remove this exception when it follows that source.
[package.metadata.cargo-shear]
ignored = ["rcgen"]

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
http = { workspace = true }
bytes = { workspace = true, features = ["std"] }
metrics = { workspace = true }
tracing = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["rustls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
