[package]
name = "infra-outbound-http"
description = "Bounded fixed-authority HTTPS exchange adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-support = ["infra-egress-dns/test-support"]

[dependencies]
http = { workspace = true }
bytes = { workspace = true, features = ["std"] }
infra-egress-dns = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
infra-egress-dns = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
