[package]
name = "infra-outbound-http"
description = "Bounded fixed-authority HTTPS exchange adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []

[dependencies]
http = { workspace = true }
bytes = { workspace = true, features = ["std"] }
infra-egress-dns = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "sync", "time"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
rcgen = { workspace = true, features = ["aws_lc_rs"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }

# Used by the path-included egress TLS fixture; cargo-shear does not follow it.
[package.metadata.cargo-shear]
ignored = ["time"]
