[package]
name = "infra-outbound-http"
description = "Bounded fixed-origin HTTPS exchange adapter."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# cargo-shear 1.13.4 scans target directories, missing the #[path] inclusion
# of test/fixtures/tls.rs. Remove this exception when it follows that source.
[package.metadata.cargo-shear]
ignored = ["rcgen"]

[lints]
workspace = true

[features]
default = []
test-support = []

[dependencies]
http = { workspace = true }
bytes = { workspace = true, features = ["std"] }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-rustls = { workspace = true, features = ["aws-lc-rs", "http1", "tls12", "rustls-platform-verifier"] }
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
metrics = { workspace = true }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = { workspace = true }
tracing = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
url = { workspace = true, features = ["std"] }

[dev-dependencies]
metrics-exporter-prometheus = { workspace = true }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "test-util", "time"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
tower = { workspace = true }
