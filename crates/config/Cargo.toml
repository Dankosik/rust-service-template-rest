[package]
name = "service-config"
description = "Typed, validated, immutable runtime configuration snapshot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
test-support = []

[dependencies]
bytesize = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
config = { workspace = true }
const_format = { workspace = true }
derive_more = { workspace = true, features = ["debug", "into_iterator"] }
educe = { workspace = true, features = ["Default"] }
itertools = { workspace = true, features = ["use_std"] }
jiff = { workspace = true, features = ["std"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["std", "derive"] }
serde-untagged = { workspace = true }
serde_with = { workspace = true, features = ["std", "macros"] }
thiserror = { workspace = true }
toml = { workspace = true, features = ["parse", "serde"] }
# template:begin config-url:config-url-dependency
url = { workspace = true, features = ["std"] }
# template:end config-url:config-url-dependency
shared-rules = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true, features = ["getrandom"] }
