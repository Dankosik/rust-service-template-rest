[package]
name = "jobs-worker"
description = "The jobs worker process: runs registered job kinds under the service's configuration, telemetry, health, and lifecycle rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "jobs_worker"

[[bin]]
name = "jobs-worker"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
futures-util = { workspace = true, features = ["std", "async-await"] }
clap = { workspace = true, features = ["std", "derive", "help", "usage", "error-context"] }
derive_more = { workspace = true, features = ["debug"] }
health = { workspace = true }
infra-http = { workspace = true }
infra-http-transport = { workspace = true }
# template:begin jobs:worker-jobs-dependencies
infra-jobs = { workspace = true }
infra-postgres = { workspace = true }
migrate = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
serde_with = { workspace = true, features = ["std", "macros"] }
# template:end jobs:worker-jobs-dependencies
# template:begin messaging:worker-messaging-dependency
infra-messaging = { workspace = true }
# template:end messaging:worker-messaging-dependency
# template:begin webhooks-common:worker-webhooks-dependency
infra-webhooks = { workspace = true }
# template:end webhooks-common:worker-webhooks-dependency
# template:begin outbound-http:worker-outbound-http-dependency
infra-outbound-http = { workspace = true }
# template:end outbound-http:worker-outbound-http-dependency
infra-telemetry = { workspace = true }
parking_lot = { workspace = true }
service-config = { workspace = true }
thiserror = { workspace = true }
tikv-jemallocator = { workspace = true }
rlimit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true, features = ["std"] }

# The same gate and reason as crates/service/Cargo.toml.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
tikv-jemallocator = { workspace = true, features = ["background_threads"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "test-util"] }
