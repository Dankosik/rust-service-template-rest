[package]
name = "grpc-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace]
resolver = "3"

[dependencies]
anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
prost = { version = "=0.14.4", default-features = false, features = ["std"] }
prost-types = { version = "=0.14.4", default-features = false, features = ["std"] }
tonic-prost-build = { version = "=0.14.8", default-features = false, features = ["cleanup-markdown"] }

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false, features = ["getrandom"] }

[lints.cargo]
blanket_hint_mostly_unused = "warn"
non_kebab_case_bins = "deny"
non_kebab_case_packages = "deny"
redundant_homepage = "deny"
unused_dependencies = "deny"

[lints.rust]
ambiguous_negative_literals = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "forbid"
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[lints.rustdoc]
bare_urls = "warn"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
branches_sharing_code = "warn"
cfg_not_test = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
empty_drop = "warn"
equatable_if_let = "warn"
exit = "warn"
expect_used = "warn"
fallible_impl_from = "warn"
filetype_is_file = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
host_endian_bytes = "warn"
imprecise_flops = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
large_stack_frames = "warn"
mem_forget = "warn"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_collect = "warn"
needless_raw_strings = "warn"
non_send_fields_in_send_ty = "warn"
or_fun_call = "warn"
panic = "warn"
path_buf_push_overwrite = "warn"
precedence_bits = "warn"
print_stderr = "deny"
print_stdout = "deny"
rc_buffer = "warn"
rc_mutex = "warn"
read_zero_byte_vec = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
rest_pat_in_fully_bound_structs = "warn"
set_contains_or_insert = "warn"
significant_drop_in_scrutinee = "warn"
string_slice = "warn"
suboptimal_flops = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
try_err = "warn"
type_repetition_in_bounds = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_peekable = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
unwrap_used = "warn"
useless_let_if_seq = "warn"
verbose_file_reads = "warn"
while_float = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
