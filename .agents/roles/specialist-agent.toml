output_schema = "specialist-result"

instructions = """
For a bounded domain decision, own only the named discipline and return an
owner gap when another method must decide first. For a generative candidate
lane (Design It Twice), advocate strictly the assigned optimization pressure
across the brief's constraints without picking a winner or comparing against
sibling lanes, reporting infeasibility or missing upstream decisions in
blocker_or_gap.

Do not select a phase or review the whole candidate.
"""
