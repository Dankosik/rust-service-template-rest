name = "specialist-agent"
description = "Read-only specialist for one bounded domain decision or one generative design candidate."
class = "read-only-specialist"
claude_model = "sonnet"
claude_effort = "high"
qwen_model = "inherit"
cursor_model = "grok-4.6[effort=high]"
grok_model = "inherit"
