name: CodeQL

# Advanced setup: the repository's default CodeQL setup is not configured, so
# this workflow owns the analyses. Rust (GA since CodeQL 2.23.3) and Actions
# run on the surfaces that change them; `codeql-required` is the one status
# to protect and accepts an analysis the surfaces did not select. The Rust
# analysis runs after merge, on main, where main-health.yml reports a failure;
# like ci.yml, a push to main classifies the diff from the `green` branch.

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Only the analyze jobs upload results; they widen their own permissions.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_source: ${{ steps.surfaces.outputs.rust_source }}
      cargo_dependencies: ${{ steps.surfaces.outputs.cargo_dependencies }}
      github_workflows: ${{ steps.surfaces.outputs.github_workflows }}
      rust_analysis: ${{ steps.surfaces.outputs.rust_analysis }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve the last green base
        id: green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=${BEFORE_SHA}
          # A missing branch prints the error body, not a commit.
          green=$(gh api "repos/${GITHUB_REPOSITORY}/branches/green" --jq .commit.sha 2>/dev/null || true)
          if [[ ${green} =~ ^[0-9a-f]{40}$ && $(gh api "repos/${GITHUB_REPOSITORY}/compare/${green}...${GITHUB_SHA}" --jq .status) == ahead ]]; then
            base=${green}
          fi
          echo "sha=${base}" >>"${GITHUB_OUTPUT}"
      - name: Classify changed surfaces
        id: surfaces
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        # A change to this workflow or the Rust analysis configuration re-runs
        # the Rust analysis it changes, as a Rust source change does.
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == schedule || "${EVENT_NAME}" == workflow_dispatch || "${GITHUB_REF}" == refs/tags/* ]]; then
            bash ./scripts/ci/changed-surfaces.sh --all >"${RUNNER_TEMP}/surfaces"
          elif [[ -n "${BASE_SHA}" && "${BASE_SHA}" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD >"${RUNNER_TEMP}/paths"
            bash ./scripts/ci/changed-surfaces.sh --union "${BASE_SHA}" <"${RUNNER_TEMP}/paths" >"${RUNNER_TEMP}/surfaces"
            if grep -Eq '^(\.github/workflows/codeql\.yml|\.github/codeql/rust\.yml)$' "${RUNNER_TEMP}/paths"; then
              echo analysis_config=true >>"${RUNNER_TEMP}/surfaces"
            fi
          else
            bash ./scripts/ci/changed-surfaces.sh --all >"${RUNNER_TEMP}/surfaces"
          fi
          cat "${RUNNER_TEMP}/surfaces" >>"${GITHUB_OUTPUT}"
          if grep -Eq '^(rust_source|cargo_dependencies|analysis_config)=true$' "${RUNNER_TEMP}/surfaces"; then
            echo rust_analysis=true >>"${GITHUB_OUTPUT}"
          else
            echo rust_analysis=false >>"${GITHUB_OUTPUT}"
          fi

  analyze-actions:
    needs: changes
    if: needs.changes.outputs.github_workflows == 'true'
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
          queries: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'security-extended' || 'security-and-quality' }}
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  analyze-rust:
    needs: changes
    if: >-
      github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
      needs.changes.outputs.rust_analysis == 'true'
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # The Rust extractor reads the workspace through cargo; rust-toolchain.toml selects the compiler.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/rust.yml
          queries: security-and-quality
      - name: Restore extractor caches
        # The extractor's internal cargo builds the build scripts and
        # proc-macros it needs into a fresh scratch directory on every run;
        # its cargo_target_dir option points it at this persistent target.
        # The CLI version is in the key because each CLI pins the toolchain
        # its extractor builds with, and the vendored crates are separate
        # Cargo projects with their own manifests and lockfiles.
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-cargo-target
          key: codeql-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.init.outputs.codeql-version }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/*/Cargo.toml', 'vendor/*/Cargo.lock') }}
          restore-keys: codeql-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.init.outputs.codeql-version }}-
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-cargo-target
          # Test-only code ships nowhere (.github/codeql/rust.yml).
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"
      - name: Save extractor caches
        # Only a push to main writes the cache, and only after the analysis
        # that filled it succeeded.
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outcome == 'success' &&
          steps.cargo-cache.outputs.cache-hit != 'true' &&
          steps.analyze.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  codeql-required:
    if: always()
    needs: [changes, analyze-actions, analyze-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed or cancelled analyses
        # Classification must succeed before skipped jobs can be intentional.
        # Explicit always() also removes the step's implicit status guard.
        if: always() && (needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
      # Keep these predicates aligned with the analysis job selectors.
      - name: Require selected Actions analysis success
        if: >-
          always() && (
            needs.changes.outputs.github_workflows == 'true'
          ) && needs.analyze-actions.result != 'success'
        run: exit 1
      - name: Require selected Rust analysis success
        if: >-
          always() && (
            github.event_name != 'pull_request' && github.event_name != 'merge_group' &&
            needs.changes.outputs.rust_analysis == 'true'
          ) && needs.analyze-rust.result != 'success'
        run: exit 1
      - name: Accept applicable analyses
        run: echo "all applicable CodeQL analyses passed"
