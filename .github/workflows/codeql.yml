name: CodeQL

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      codeql_actions: ${{ steps.detect.outputs.codeql_actions }}
      codeql_rust: ${{ steps.detect.outputs.codeql_rust }}
      post_merge: ${{ steps.detect.outputs.post_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes # zizmor: ignore[self-repository]
        with:
          github_token: ${{ github.token }}
          main_coalesce_seconds: ${{ vars.MAIN_PUSH_COALESCE_SECONDS || '60' }}

  analyze-actions:
    needs: changes
    if: needs.changes.outputs.codeql_actions == 'true'
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions
          build-mode: none
          queries: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'security-extended' || 'security-and-quality' }}
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  analyze-rust:
    needs: changes
    if: needs.changes.outputs.post_merge == 'true' && needs.changes.outputs.codeql_rust == 'true'
    name: Analyze (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - id: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/rust.yml
          queries: security-and-quality
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-cargo-target
          key: codeql-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.init.outputs.codeql-version }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'vendor/*/Cargo.toml', 'vendor/*/Cargo.lock') }}
          restore-keys: codeql-rust-${{ runner.os }}-${{ runner.arch }}-${{ steps.init.outputs.codeql-version }}-
      - id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-cargo-target
          CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"
      - if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.cargo-cache.outputs.cache-hit != 'true' &&
          steps.analyze.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/codeql-cargo-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  codeql-required:
    if: always()
    needs: [changes, analyze-actions, analyze-rust]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required CodeQL analyses
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [
              f"{k}={v.get('result')}"
              for k, v in sorted(needs.items())
              if (k == "changes" and v.get("result") != "success")
              or (k != "changes" and v.get("result") not in {"success", "skipped"})
          ]
          if failed:
              print("CodeQL analyses failed: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("all applicable CodeQL analyses passed")
          PY
