name: ci
# Jobs are selected by the changed surfaces that scripts/ci/changed-surfaces.sh
# reports; `make verify` reads the same classifier. `required` is the one
# status to protect: it fails on any failed or cancelled gate and accepts a
# gate the surfaces did not select. A draft pull request defers the heavy
# gates (initializer, image, integration) until it is ready for review. Job
# layout and the reason for each gate: docs/ci-cd-production-ready.md.
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
    # ready_for_review reruns a draft with the heavy gates it deferred.
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  schedule:
    # Weekly: advisory databases move without a commit, so every surface runs.
    - cron: "41 4 * * 2"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  # Line tables keep file:line in test backtraces; full debuginfo made each
  # target cache about 4 GB. Cache keys carry the level, so a change never
  # restores artifacts built at another one.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: short
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_source: ${{ steps.surfaces.outputs.rust_source }}
      cargo_dependencies: ${{ steps.surfaces.outputs.cargo_dependencies }}
      dependency_policy: ${{ steps.surfaces.outputs.dependency_policy }}
      lint_config: ${{ steps.surfaces.outputs.lint_config }}
      openapi: ${{ steps.surfaces.outputs.openapi }}
      # template:begin grpc:ci-grpc-output
      grpc_schema: ${{ steps.surfaces.outputs.grpc_schema }}
      # template:end grpc:ci-grpc-output
      tool_manifest: ${{ steps.surfaces.outputs.tool_manifest }}
      github_workflows: ${{ steps.surfaces.outputs.github_workflows }}
      dependency_automation: ${{ steps.surfaces.outputs.dependency_automation }}
      shell: ${{ steps.surfaces.outputs.shell }}
      runtime_image: ${{ steps.surfaces.outputs.runtime_image }}
      publication_metadata: ${{ steps.surfaces.outputs.publication_metadata }}
      secret_scanning: ${{ steps.surfaces.outputs.secret_scanning }}
      db_integration: ${{ steps.surfaces.outputs.db_integration }}
      messaging_integration: ${{ steps.surfaces.outputs.messaging_integration }}
      cache_integration: ${{ steps.surfaces.outputs.cache_integration }}
      migrations: ${{ steps.surfaces.outputs.migrations }}
      agent_instructions: ${{ steps.surfaces.outputs.agent_instructions }}
      documentation: ${{ steps.surfaces.outputs.documentation }}
      validation_system: ${{ steps.surfaces.outputs.validation_system }}
      module_initializer: ${{ steps.surfaces.outputs.module_initializer }}
      initializer_runtime: ${{ steps.surfaces.outputs.initializer_runtime }}
      initializer_matrix: ${{ steps.surfaces.outputs.initializer_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch exact comparison base
        if: >-
          !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '' && (github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"
      - name: Classify changed surfaces
        id: surfaces
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        # Tags, schedules, manual runs, and a push without a readable base
        # select every surface; a diff event is classified by both the base
        # and the head classifier. A selected initializer plans the runtime
        # graphs the same diff can affect (scripts/ci/initializer-matrix.py).
        run: |
          set -euo pipefail
          paths=${RUNNER_TEMP}/changed-paths
          surfaces=${RUNNER_TEMP}/surfaces
          if [[ "${EVENT_NAME}" == schedule || "${EVENT_NAME}" == workflow_dispatch || "${GITHUB_REF}" == refs/tags/* || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            bash ./scripts/ci/changed-surfaces.sh --all >"${surfaces}"
            plan=(--all)
            : >"${paths}"
          else
            bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD >"${paths}"
            bash ./scripts/ci/changed-surfaces.sh --union "${BASE_SHA}" <"${paths}" >"${surfaces}"
            plan=()
          fi
          tee -a "${GITHUB_OUTPUT}" <"${surfaces}" >>"${GITHUB_STEP_SUMMARY}"
          if grep -qx 'initializer_runtime=true' "${surfaces}"; then
            python3 ./scripts/ci/initializer-matrix.py "${plan[@]}" <"${paths}" | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
          fi
  # template:begin grpc:ci-grpc-job
  grpc:
    needs: changes
    if: needs.changes.outputs.grpc_schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore generator cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/grpc-codegen
          key: grpc-codegen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'tools/grpc-codegen/Cargo.lock') }}
      - name: Check schema and committed generation
        env:
          GRPC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/grpc-codegen
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GRPC_BASE_REF}"
          bash ./scripts/ci/measure.sh grpc-schema -- make grpc-check
  # template:end grpc:ci-grpc-job

  quality:
    needs: changes
    if: >-
      needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.lint_config == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.migrations == 'true' || needs.changes.outputs.agent_instructions == 'true' || needs.changes.outputs.validation_system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_SELECTED: >-
        ${{ needs.changes.outputs.rust_source == 'true' ||

            needs.changes.outputs.cargo_dependencies == 'true' ||
            needs.changes.outputs.lint_config == 'true' ||
            needs.changes.outputs.openapi == 'true' ||
            needs.changes.outputs.migrations == 'true' ||
            needs.changes.outputs.validation_system == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Install pinned toolchain
        # No argument: rustup reads rust-toolchain.toml, including components.
        # The affected-crate planner and its self-test also need cargo.
        if: env.RUST_SELECTED == 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Cargo caches
        # Keyed by the toolchain, every manifest and lockfile, and the CARGO_*
        # and RUST* environment (the debuginfo level among them). Only a push
        # to main saves, after a successful job, and the saved target holds
        # dependency artifacts alone: workspace crates rebuild on every
        # checkout anyway, and keeping them overran the 10 GB cache budget.
        # zizmor reads lookup-only, not save-if, hence its ignore below.
        if: env.RUST_SELECTED == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install pinned Cargo tools
        if: needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true'
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-shear@${{ env.CARGO_SHEAR_VERSION }}
      - name: Format
        if: >-
          needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.lint_config == 'true'
        run: bash ./scripts/ci/measure.sh quality-format -- make fmt-check
      - name: Affected crates
        # Pull requests select the changed crates and their dependents; every
        # other event, and any manifest, lockfile, or toolchain change, runs
        # the workspace.
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.changes.outputs.rust_source == 'true' && needs.changes.outputs.cargo_dependencies != 'true'
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD | bash ./scripts/ci/affected-crates.sh | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
      - name: Lint, build, test
        id: lint-build-test
        if: >-
          needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.lint_config == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CARGO_DEPENDENCIES: ${{ needs.changes.outputs.cargo_dependencies }}
          LINT_CONFIG: ${{ needs.changes.outputs.lint_config }}
          RUST_SOURCE: ${{ needs.changes.outputs.rust_source }}
          FALLBACK: ${{ steps.affected.outputs.fallback }}
          LINT_PACKAGES: ${{ steps.affected.outputs.lint_packages }}
          TEST_PACKAGES: ${{ steps.affected.outputs.test_packages }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" != pull_request && "${EVENT_NAME}" != merge_group ]] || [[ "${CARGO_DEPENDENCIES}" == true || "${FALLBACK}" == true ]]; then
            bash ./scripts/ci/measure.sh quality-workspace -- make --keep-going lint build test
            exit 0
          fi
          if [[ "${LINT_CONFIG}" == true ]]; then
            bash ./scripts/ci/measure.sh quality-lint -- make lint
          elif [[ -n "${LINT_PACKAGES}" ]]; then
            bash ./scripts/ci/measure.sh quality-lint-changed -- make lint-changed PKGS="${LINT_PACKAGES}"
          fi
          if [[ -n "${TEST_PACKAGES}" ]]; then
            bash ./scripts/ci/measure.sh quality-test-changed -- make test-changed PKGS="${TEST_PACKAGES}"
          elif [[ "${RUST_SOURCE}" == true ]]; then
            echo "no crate selected for tests"
          fi
      - name: Unused dependencies
        if: needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true'
        run: bash ./scripts/ci/measure.sh quality-unused-deps -- make unused-deps
      - name: OpenAPI
        # Redocly over the committed document plus the drift and contract
        # tests. Node.js is preinstalled on the runner.
        if: needs.changes.outputs.openapi == 'true'
        run: bash ./scripts/ci/measure.sh quality-openapi -- make openapi-check
      - name: Generate handler OpenAPI diagnostic
        # The committed-file drift check remains above. This always-run step
        # preserves the assembled handler output when it reports stale bytes.
        if: always() && needs.changes.outputs.openapi == 'true'
        id: generated-openapi
        run: |
          set -euo pipefail
          mkdir -p .ci/generated-openapi
          bash ./scripts/ci/measure.sh quality-openapi-generate -- make openapi-generate OPENAPI_FILE=.ci/generated-openapi/service.yaml
          test -s .ci/generated-openapi/service.yaml
      - name: Upload generated OpenAPI diagnostic
        if: always() && steps.generated-openapi.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-openapi-${{ github.sha }}
          path: .ci/generated-openapi/service.yaml
          if-no-files-found: error
      - name: OpenAPI compatibility
        # oasdiff against the pull-request base. Go is preinstalled on the runner.
        if: github.event_name == 'pull_request' && needs.changes.outputs.openapi == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git show "${BASE_SHA}:api/openapi/service.yaml" >/tmp/openapi-base.yaml
          bash ./scripts/ci/measure.sh quality-openapi-breaking -- make openapi-breaking BASE_OPENAPI=/tmp/openapi-base.yaml
      # template:begin postgres:ci-quality-migrations
      - name: Migrations
        # Static append-only history against the base plus the source rules
        # over the embedded set; the runtime checksum check runs in
        # test-integration-db and the image rehearsal.
        if: needs.changes.outputs.migrations == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            bash ./scripts/ci/measure.sh quality-migrations -- make migration-check BASE_REF="${BASE_SHA}"
          else
            bash ./scripts/ci/measure.sh quality-migrations -- make migration-check BASE_REF=HEAD
          fi
          bash ./scripts/ci/measure.sh quality-migration-history -- make migration-history-self-test
      # template:end postgres:ci-quality-migrations
      - name: Instructions
        # Skill shape plus the generated harness carriers against their sources.
        if: needs.changes.outputs.agent_instructions == 'true'
        run: bash ./scripts/ci/measure.sh quality-instructions -- make check-instructions
      - name: Validation routing
        if: needs.changes.outputs.validation_system == 'true'
        run: bash ./scripts/ci/measure.sh quality-validation-system -- make changed-surfaces-check affected-crates-check validation-lock-self-test verify-check
  security:
    needs: changes
    if: >-
      needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.dependency_policy == 'true' || needs.changes.outputs.github_workflows == 'true' || (github.event_name == 'pull_request' && (

        needs.changes.outputs.tool_manifest == 'true' ||
        needs.changes.outputs.runtime_image == 'true'
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Dependency review
        # New vulnerable dependencies on a pull request, from the lockfile
        # and the workflow action pins.
        if: >-
          github.event_name == 'pull_request' && (

            needs.changes.outputs.cargo_dependencies == 'true' ||
            needs.changes.outputs.tool_manifest == 'true' ||
            needs.changes.outputs.github_workflows == 'true' ||
            needs.changes.outputs.runtime_image == 'true'
          )
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Install pinned toolchain
        # cargo-deny resolves the locked graph through cargo.
        if: needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.dependency_policy == 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install pinned Cargo tools
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},zizmor@${{ env.ZIZMOR_VERSION }}
      - name: Dependency policy
        if: needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.dependency_policy == 'true'
        run: bash ./scripts/ci/measure.sh security-deny -- make deny
      # template:begin grpc:ci-grpc-generator-dependencies
      - name: Generator dependency policy
        if: needs.changes.outputs.grpc_schema == 'true'
        run: cargo-deny --manifest-path tools/grpc-codegen/Cargo.toml --config deny.toml --locked check
      # template:end grpc:ci-grpc-generator-dependencies
      - name: Workflow security
        if: needs.changes.outputs.github_workflows == 'true'
        env:
          # Enables the online audits (known-vulnerable-actions, impostor-commit).
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/ci/measure.sh security-zizmor -- make zizmor
  secrets:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.secret_scanning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Restore Go tool caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: Secret scan
        # Tags, manual runs, and a push without a readable base scan the whole
        # history; every other event scans the commits since the base.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* || "${EVENT_NAME}" == workflow_dispatch || "${EVENT_NAME}" == schedule || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            bash ./scripts/ci/measure.sh secrets-history -- make secret-scan-history
          else
            bash ./scripts/ci/measure.sh secrets-range -- make secret-scan BASE_REF="${BASE_SHA}"
          fi
      - name: Save Go tool caches
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
  delivery:
    needs: changes
    if: >-
      needs.changes.outputs.shell == 'true' || needs.changes.outputs.github_workflows == 'true' || needs.changes.outputs.tool_manifest == 'true' || needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.publication_metadata == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Restore Go tool caches
        if: needs.changes.outputs.github_workflows == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: Workflows
        if: needs.changes.outputs.github_workflows == 'true'
        run: bash ./scripts/ci/measure.sh delivery-actionlint -- make actionlint
      - name: Shell
        # Changed scripts on a diff event, every script otherwise.
        if: needs.changes.outputs.shell == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* || "${EVENT_NAME}" == workflow_dispatch || "${EVENT_NAME}" == schedule || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            bash ./scripts/ci/measure.sh delivery-shellcheck -- make shellcheck
          else
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            files=$(bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD | while IFS= read -r file; do if [[ ${file} == *.sh && -f ${file} ]]; then printf '%s ' "${file}"; fi; done)
            bash ./scripts/ci/measure.sh delivery-shellcheck -- make shellcheck SHELL_FILES="${files% }"
          fi
      - name: Install pinned Cargo tools
        if: needs.changes.outputs.tool_manifest == 'true'
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-shear@${{ env.CARGO_SHEAR_VERSION }},zizmor@${{ env.ZIZMOR_VERSION }}
      - name: Tool manifest
        if: needs.changes.outputs.tool_manifest == 'true'
        run: bash ./scripts/ci/measure.sh delivery-tools -- make tools-check
      - name: Dockerfile
        if: needs.changes.outputs.runtime_image == 'true'
        run: bash ./scripts/ci/measure.sh delivery-dockerfile -- make dockerfile-check
      - name: Publication metadata
        if: needs.changes.outputs.publication_metadata == 'true'
        run: bash ./scripts/ci/measure.sh delivery-publication-metadata -- make publish-image-metadata-check
  image:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        # The docker-container driver can export layers to the Actions cache.
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose the Actions runtime to buildx
        # `type=gha` reads ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL, which
        # GitHub hands to actions but not to `run:` steps; without this buildx
        # silently skips the cache import and export.
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Build runtime image
        # Layers (the cooked dependency layer above all) restore from the
        # Actions cache on every run and are written only by pushes to main
        # and schedules, so a pull request cannot poison them.
        env:
          VCS_REF: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          RUNTIME_IMAGE_CACHE_FROM: type=gha,scope=runtime-image
          RUNTIME_IMAGE_CACHE_TO: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'type=gha,mode=max,scope=runtime-image' || '' }}
        run: bash ./scripts/ci/measure.sh image-build -- make runtime-image-build
      - name: Runtime image lifecycle
        # template:begin postgres:ci-image-lifecycle-migration-branch
        if: needs.changes.outputs.migrations != 'true'
        # template:end postgres:ci-image-lifecycle-migration-branch
        env:
          VCS_REF: ${{ github.sha }}
        run: bash ./scripts/ci/measure.sh image-lifecycle -- make runtime-image-check RUNTIME_EXPECTED_COMMIT="${VCS_REF}"
      # template:begin postgres:ci-image-migration-rehearsal
      - name: Migration rehearsal
        # Contains the lifecycle check, with the PostgreSQL profile enabled
        # against a compose database the image's /migrate prepared.
        if: needs.changes.outputs.migrations == 'true'
        env:
          VCS_REF: ${{ github.sha }}
        run: bash ./scripts/ci/measure.sh image-migration-rehearsal -- env REQUIRE_DOCKER=1 make migration-validate RUNTIME_EXPECTED_COMMIT="${VCS_REF}"
      # template:end postgres:ci-image-migration-rehearsal
      - name: Image vulnerabilities
        if: needs.changes.outputs.runtime_image == 'true'
        run: bash ./scripts/ci/measure.sh image-security -- make container-security
  # template:begin integration:ci-integration-job
  integration:
    needs: changes
    if: >-
      github.event.pull_request.draft != true && (

        needs.changes.outputs.db_integration == 'true' ||
        needs.changes.outputs.messaging_integration == 'true' ||
        needs.changes.outputs.cache_integration == 'true' ||
        needs.changes.outputs.object_storage_integration == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Cargo caches
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Start selected integration services
        id: integration-services
        env:
          DATABASE_SELECTED: ${{ needs.changes.outputs.db_integration }}
          MESSAGING_SELECTED: ${{ needs.changes.outputs.messaging_integration }}
          CACHE_SELECTED: ${{ needs.changes.outputs.cache_integration }}
        run: |
          set -euo pipefail
          OUTBOX_SELECTED=$(python3 scripts/lib/template_state.py profile --repo . --field outbox)
          if [[ "${DATABASE_SELECTED}" == true ]]; then
            POSTGRES_PORT=5432 docker compose -f env/docker-compose.yml up -d --wait postgres
          fi
          if [[ "${MESSAGING_SELECTED}" == true || ( "${DATABASE_SELECTED}" == true && "${OUTBOX_SELECTED}" == postgres ) ]]; then
            NATS_PORT=4222 docker compose -f env/docker-compose.yml up -d --wait nats
          fi
          if [[ "${CACHE_SELECTED}" == true ]]; then
            VALKEY_PORT=6379 docker compose -f env/docker-compose.yml up -d --wait valkey
          fi
      - name: Integration startup diagnostics
        if: failure() && steps.integration-services.outcome == 'failure'
        run: |
          set -euo pipefail
          docker compose -f env/docker-compose.yml ps --all
          docker compose -f env/docker-compose.yml logs --no-color --tail 100
          while IFS= read -r container_id; do
            [[ -n "${container_id}" ]] || continue
            docker inspect --format '{{.Name}} status={{.State.Status}} health={{json .State.Health}}' "${container_id}"
          done < <(docker compose -f env/docker-compose.yml ps --all --quiet)
      - name: Database-backed proof
        if: needs.changes.outputs.db_integration == 'true'
        run: >-
          bash ./scripts/ci/measure.sh integration-db -- env INTEGRATION_COMPOSE_MANAGED=1 DATABASE_URL='postgres://app:app@127.0.0.1:5432/app?sslmode=disable' NATS_URL=nats://127.0.0.1:4222 make test-integration-db
      - name: Cache proof
        if: needs.changes.outputs.cache_integration == 'true'
        run: >-
          bash ./scripts/ci/measure.sh integration-cache -- env REQUIRE_DOCKER=1 CACHE_URL=redis://127.0.0.1:6379 make test-integration-cache
      - name: JetStream proof
        if: needs.changes.outputs.messaging_integration == 'true'
        run: >-
          bash ./scripts/ci/measure.sh integration-messaging -- env REQUIRE_DOCKER=1 NATS_URL=nats://127.0.0.1:4222 make test-integration-messaging
      - name: Install Go for wire compatibility
        if: needs.changes.outputs.messaging_integration == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Generate actual Go wire records
        if: needs.changes.outputs.messaging_integration == 'true'
        run: bash ./scripts/messaging-go-compat.sh generate "${RUNNER_TEMP}/go-wire/records.json"
      - name: Export actual Rust wire records
        if: needs.changes.outputs.messaging_integration == 'true'
        env:
          GO_WIRE_FIXTURES: ${{ runner.temp }}/go-wire/records.json
          GO_WIRE_RUST_EXPORT: ${{ runner.temp }}/go-wire/rust-export.json
        run: cargo test --locked -p infra-messaging --test wire_compat -- --ignored --exact rust_production_wire_exports_for_go
      - name: Verify actual Go and Rust wire records
        if: needs.changes.outputs.messaging_integration == 'true'
        run: |
          set -euo pipefail
          bash ./scripts/messaging-go-compat.sh verify-rust "${RUNNER_TEMP}/go-wire/records.json" "${RUNNER_TEMP}/go-wire/rust-export.json"
          bash ./scripts/messaging-go-compat.sh check "${RUNNER_TEMP}/go-wire/records.json"
      - name: Upload Go wire provenance
        if: always() && needs.changes.outputs.messaging_integration == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-wire-provenance
          path: ${{ runner.temp }}/go-wire/records.json
          if-no-files-found: error
  # template:end integration:ci-integration-job

  initializer:
    needs: changes
    if: needs.changes.outputs.initializer_runtime == 'true' && github.event.pull_request.draft != true
    name: initializer (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each part reports its own result; `required` reads the aggregate,
      # which is success only when every part passed.
      fail-fast: false
      # Together the parts are `make template-init-check`: the `source` part
      # runs the source suites and canonical projections, every other part a
      # group of runtime graphs. scripts/ci/initializer-matrix.py owns the
      # grouping and keeps only the graphs the diff can affect; a push without
      # a readable base, a tag, a schedule, or a manual run selects them all.
      matrix: ${{ fromJSON(needs.changes.outputs.initializer_matrix || '{"include":[{"part":"source"}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Cargo caches
        # One cache per part: a part's graphs share dependency features, so
        # its pruned target serves the next run of the same part.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          key: ${{ matrix.part }}
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Fetch locked Cargo packages
        run: cargo fetch --locked
      - name: Source suites and canonical projections
        if: matrix.part == 'source'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          bash ./scripts/ci/measure.sh template-initializer-source -- bash ./scripts/ci/template-init-check.sh --source-checks
          bash ./scripts/ci/measure.sh template-initializer-projections -- bash ./scripts/ci/template-init-check.sh --projections-only
      - name: Runtime graphs
        if: matrix.part != 'source'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PART: ${{ matrix.part }}
          GRAPHS: ${{ matrix.graphs }}
          # The runner has Docker; graphs with retained database suites fail
          # rather than refuse if it is ever missing.
          REQUIRE_DOCKER: "1"
        run: bash ./scripts/ci/measure.sh "template-initializer-${PART}" -- bash ./scripts/ci/template-init-check.sh --runtime-graphs "${GRAPHS}"
  initializer-projections:
    # Only projected text changed (documentation, instructions, harness
    # carriers, workflow and image metadata): the canonical projections prove
    # it without Cargo, and the runtime matrix waits for a change that can
    # alter an initialized service's build or the initializer itself.
    needs: changes
    if: >-
      needs.changes.outputs.module_initializer == 'true' && needs.changes.outputs.initializer_runtime != 'true'
    name: initializer (projections)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical projections
        run: bash ./scripts/ci/measure.sh template-initializer-projections -- make template-init-projections
  docs:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links
        # Relative links and #fragments only (offline); no toolchain.
        run: bash ./scripts/ci/measure.sh docs-links -- make docs-check
  required:
    if: always()
    needs:
      - changes
      - quality
      # template:begin grpc:ci-required-grpc-need
      - grpc
      # template:end grpc:ci-required-grpc-need
      - security
      - secrets
      - delivery
      - image
      # template:begin integration:ci-required-integration-need
      - integration
      # template:end integration:ci-required-integration-need
      - initializer
      - initializer-projections
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed or cancelled gates
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Require selected initializer matrix success
        # A draft defers the matrix; ready_for_review runs it.
        if: >-
          needs.changes.outputs.initializer_runtime == 'true' && github.event.pull_request.draft != true && needs.initializer.result != 'success'
        run: exit 1
      # template:begin grpc:ci-required-grpc-success
      - name: Require selected protobuf contract success
        if: needs.changes.outputs.grpc_schema == 'true' && needs.grpc.result != 'success'
        run: exit 1
      # template:end grpc:ci-required-grpc-success
      - name: Require selected initializer projections success
        if: >-
          needs.changes.outputs.module_initializer == 'true' && needs.changes.outputs.initializer_runtime != 'true' && needs.initializer-projections.result != 'success'
        run: exit 1
      - name: Accept passed and intentionally skipped gates
        run: echo "all applicable CI gates passed"
