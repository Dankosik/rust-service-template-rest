name: ci

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short

jobs:
  # One gate for now. Changed-surface classification, security, delivery, and
  # integration jobs arrive with the validation-and-delivery roadmap stage.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # No argument: rustup reads rust-toolchain.toml, including components.
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Restore cargo caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Format
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test

  required:
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed or cancelled gates
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Accept passed gates
        run: echo "all applicable CI gates passed"
