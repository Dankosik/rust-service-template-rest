name: ci

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  ZSTD_CLEVEL: "12"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      deps: ${{ steps.detect.outputs.deps }}
      openapi: ${{ steps.detect.outputs.openapi }}
      grpc: ${{ steps.detect.outputs.grpc }}
      migrations: ${{ steps.detect.outputs.migrations }}
      integration: ${{ steps.detect.outputs.integration }}
      oauth: ${{ steps.detect.outputs.oauth }}
      docker: ${{ steps.detect.outputs.docker }}
      runtime_progress: ${{ steps.detect.outputs.runtime_progress }}
      repo_lint: ${{ steps.detect.outputs.repo_lint }}
      template: ${{ steps.detect.outputs.template }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      post_merge: ${{ steps.detect.outputs.post_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes # zizmor: ignore[self-repository]
        with:
          github_token: ${{ github.token }}

  secrets:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - name: Secret scan
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" ]]; then
            make secret-scan-history
          else
            make secret-scan BASE_REF="${BASE_SHA}"
          fi

  repo-lint:
    needs: [changes, secrets]
    if: "!cancelled() && (needs.changes.outputs.repo_lint == 'true' || needs.changes.outputs.docker == 'true')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - name: Install pinned Cargo linters
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: typos@${{ env.TYPOS_VERSION }},zizmor@${{ env.ZIZMOR_VERSION }}
      - name: Repository linters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          make typos
          make actionlint
          make zizmor
          make shellcheck
          make python-lint
          make docs-check
          make check-instructions
          make monitoring-rules
      - name: Set up Buildx
        id: buildx
        if: needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
          cleanup: false
          version: v${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Check Dockerfile
        if: needs.changes.outputs.docker == 'true'
        env:
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: make dockerfile-check

  rust:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.deps == 'true' ||
      needs.changes.outputs.openapi == 'true' ||
      needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: rust-quality
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - run: cargo fetch --locked
      - name: Install pinned Cargo tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }},cargo-shear@${{ env.CARGO_SHEAR_VERSION }}
      - name: Format, lint, build, test, and architecture
        run: |
          set -euo pipefail
          make fmt-check
          make lint
          make build
          make test
          make unused-deps
          make architecture-check
      - name: Profiling and vendored transport regressions
        if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.post_merge == 'true'
        run: |
          set -euo pipefail
          make profiling-check
          make native-transport
      - name: OpenAPI contract
        if: needs.changes.outputs.openapi == 'true'
        run: make openapi-check
      - name: OpenAPI breaking compatibility
        if: github.event_name == 'pull_request' && needs.changes.outputs.openapi == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          make openapi-breaking-since BASE_REF="${BASE_SHA}"
      # template:begin postgres:ci-migrations-step
      - name: SQL migrations
        if: needs.changes.outputs.migrations == 'true'
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            make migration-check BASE_REF="${BASE_SHA}"
          else
            make migration-check BASE_REF=HEAD
          fi
      # template:end postgres:ci-migrations-step

  security:
    needs: [changes, secrets]
    if: "!cancelled() && (needs.changes.outputs.deps == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: Dependency policy and vendored drift
        run: |
          set -euo pipefail
          make deny
          make dependency-drift
          if [[ -f tools/grpc-codegen/Cargo.toml ]]; then
            make grpc-generator-deny
          fi

  # template:begin grpc:ci-grpc-job
  grpc:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.grpc == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - name: Check protobuf schemas and generated Rust
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/grpc-codegen
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            GRPC_BASE_REF="${BASE_SHA}" make grpc-check
          else
            GRPC_BASE_REF=HEAD make grpc-check
          fi
  # template:end grpc:ci-grpc-job

  # template:begin integration:ci-integration-job
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          key: integration
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - name: Restore sqlx-cli
        if: hashFiles('crates/infra-postgres/Cargo.toml') != ''
        id: sqlx-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/tools/sqlx-cli-${{ env.SQLX_CLI_VERSION }}
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}
      - name: PostgreSQL integration and SQLx check
        if: hashFiles('crates/infra-postgres/Cargo.toml') != ''
        run: |
          set -euo pipefail
          REQUIRE_DOCKER=1 make test-integration-db
          make sqlx-check
      - name: Save sqlx-cli
        if: hashFiles('crates/infra-postgres/Cargo.toml') != '' && steps.sqlx-cache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/tools/sqlx-cli-${{ env.SQLX_CLI_VERSION }}
          key: ${{ steps.sqlx-cache.outputs.cache-primary-key }}
      - name: Cache integration
        if: hashFiles('crates/infra-cache/Cargo.toml') != ''
        run: REQUIRE_DOCKER=1 make test-integration-cache
      - name: Object storage integration
        if: hashFiles('crates/infra-object-storage/Cargo.toml') != ''
        run: REQUIRE_DOCKER=1 make test-integration-object-storage
      - name: JetStream integration
        if: hashFiles('crates/infra-messaging/Cargo.toml') != ''
        run: REQUIRE_DOCKER=1 make test-integration-messaging
      - name: Set up Go for wire compatibility
        if: hashFiles('crates/infra-messaging/Cargo.toml') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go wire compatibility
        if: hashFiles('crates/infra-messaging/Cargo.toml') != ''
        run: make messaging-go-compat
  # template:end integration:ci-integration-job

  # template:begin outbound-auth:ci-oauth-job
  oauth-integration:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.oauth == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - name: Keycloak OAuth integration
        run: REQUIRE_DOCKER=1 make test-integration-oauth
  # template:end outbound-auth:ci-oauth-job

  image:
    needs: changes
    if: needs.changes.outputs.docker == 'true' && needs.changes.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
          cleanup: false
          version: v${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build, smoke-check, scan, and SBOM
        env:
          VCS_REF: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          MIGRATIONS_CHANGED: ${{ needs.changes.outputs.migrations }}
        run: |
          set -euo pipefail
          make image-build RUNTIME_IMAGE="service:ci"
          image_id=$(docker image inspect --format '{{.Id}}' service:ci)
          if [[ "${MIGRATIONS_CHANGED}" == true && -d crates/migrate ]]; then
            make migration-validate RUNTIME_IMAGE="${image_id}" RUNTIME_EXPECTED_COMMIT="${VCS_REF}"
          else
            make image-check RUNTIME_IMAGE="${image_id}" RUNTIME_EXPECTED_COMMIT="${VCS_REF}"
          fi
          make image-scan CONTAINER_IMAGE="${image_id}"
          make image-sbom CONTAINER_IMAGE="${image_id}" SBOM_OUTPUT="${RUNNER_TEMP}/source.cdx.json"

  # template:begin runtime-progress:ci-runtime-progress-job
  runtime-progress:
    needs: changes
    if: needs.changes.outputs.runtime_progress == 'true' && needs.changes.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNTIME_PROGRESS_RESULTS: ${{ github.workspace }}/.artifacts/runtime-progress/measurements
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          shared-key: runtime-progress
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
          cleanup: false
          version: v${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: CPU-quota progress proof
        env:
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: make runtime-progress-proof
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-progress-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/runtime-progress
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # template:end runtime-progress:ci-runtime-progress-job

  # template:begin source-template:ci-template-job
  template:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.template == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Projection and script unit checks
        run: |
          set -euo pipefail
          make template-check
          make template-test
      - if: needs.changes.outputs.post_merge == 'true'
        uses: ./.github/actions/load-versions # zizmor: ignore[self-repository]
      - if: needs.changes.outputs.post_merge == 'true'
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - if: needs.changes.outputs.post_merge == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@${{ env.CARGO_NEXTEST_VERSION }}
      - if: needs.changes.outputs.post_merge == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: template-matrix
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Canonical profile build and test matrix
        if: needs.changes.outputs.post_merge == 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -euo pipefail
          cargo fetch --locked
          make template-matrix
  # template:end source-template:ci-template-job

  required:
    if: always()
    needs:
      - changes
      - secrets
      - repo-lint
      - rust
      - security
      # template:begin grpc:ci-required-grpc
      - grpc
      # template:end grpc:ci-required-grpc
      # template:begin integration:ci-required-integration
      - integration
      # template:end integration:ci-required-integration
      # template:begin outbound-auth:ci-required-oauth
      - oauth-integration
      # template:end outbound-auth:ci-required-oauth
      - image
      # template:begin runtime-progress:ci-required-runtime-progress
      - runtime-progress
      # template:end runtime-progress:ci-required-runtime-progress
      # template:begin source-template:ci-required-template
      - template
      # template:end source-template:ci-required-template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required CI gates
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [
              f"{k}={v.get('result')}"
              for k, v in sorted(needs.items())
              if (k == "changes" and v.get("result") != "success")
              or (k != "changes" and v.get("result") not in {"success", "skipped"})
          ]
          if failed:
              print("CI gates failed: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("all applicable CI gates passed")
          PY
