name: ci

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  ZSTD_CLEVEL: "12"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
      deps: ${{ steps.detect.outputs.deps }}
      profiling: ${{ steps.detect.outputs.profiling }}
      vendor_transport: ${{ steps.detect.outputs.vendor_transport }}
      openapi: ${{ steps.detect.outputs.openapi }}
      grpc: ${{ steps.detect.outputs.grpc }}
      migrations: ${{ steps.detect.outputs.migrations }}
      integration: ${{ steps.detect.outputs.integration }}
      integration_db: ${{ steps.detect.outputs.integration_db }}
      sqlx_check: ${{ steps.detect.outputs.sqlx_check }}
      integration_cache: ${{ steps.detect.outputs.integration_cache }}
      integration_object_storage: ${{ steps.detect.outputs.integration_object_storage }}
      integration_messaging: ${{ steps.detect.outputs.integration_messaging }}
      integration_temporal: ${{ steps.detect.outputs.integration_temporal }}
      oauth: ${{ steps.detect.outputs.oauth }}
      docker: ${{ steps.detect.outputs.docker }}
      runtime_progress: ${{ steps.detect.outputs.runtime_progress }}
      repo_lint: ${{ steps.detect.outputs.repo_lint }}
      template: ${{ steps.detect.outputs.template }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      post_merge: ${{ steps.detect.outputs.post_merge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-changes # zizmor: ignore[self-repository]
        with:
          github_token: ${{ github.token }}
          main_coalesce_seconds: ${{ vars.MAIN_PUSH_COALESCE_SECONDS || '60' }}

  secrets:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just gitleaks
          cache_key_prefix: mise-secrets
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Secret scan
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" ]]; then
            just secret-scan-history
          else
            just secret-scan "${BASE_SHA}"
          fi

  repo-lint:
    needs: [changes, secrets]
    if: "!cancelled() && (needs.changes.outputs.repo_lint == 'true' || needs.changes.outputs.docker == 'true')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just typos zizmor actionlint shellcheck ruff lychee promtool
          cache_key_prefix: mise-repo-lint
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Repository linters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          just typos
          just actionlint
          just zizmor
          just shellcheck
          just python-lint
          just docs-check
          just monitoring-rules
          just scripts-test
          # template:begin source-template:ci-check-instructions
          just check-instructions
          # template:end source-template:ci-check-instructions
      - name: Set up Buildx
        id: buildx
        if: needs.changes.outputs.docker == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
          cleanup: false
          version: v${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Check Dockerfile
        if: needs.changes.outputs.docker == 'true'
        env:
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: just dockerfile-check

  rust:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.deps == 'true' ||
      needs.changes.outputs.openapi == 'true' ||
      needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: rust-quality
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just cargo-nextest typos github:Boshen/cargo-shear github:oasdiff/oasdiff npm:@redocly/cli
          cache_key_prefix: mise-rust
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache_save_post: true
      - run: cargo fetch --locked
      - name: Fetch PR comparison base
        if: github.event_name == 'pull_request' && needs.changes.outputs.base_sha != ''
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"
      - name: Format, lint, test, and architecture
        id: rust_quality
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          POST_MERGE: ${{ needs.changes.outputs.post_merge }}
          DEPS_CHANGED: ${{ needs.changes.outputs.deps }}
          CI_RUST_SELECTION: ${{ vars.CI_RUST_SELECTION }}
        run: |
          set -euo pipefail
          just fmt-check
          if [[ "${POST_MERGE}" == true || "${DEPS_CHANGED}" == true || "${GITHUB_EVENT_NAME}" != pull_request || -z "${BASE_SHA}" ]]; then
            plan_args=(--all)
          else
            plan_args=(--base "${BASE_SHA}")
          fi
          plan_json=$(python3 -m scripts.checks.rust_selection plan "${plan_args[@]}" --summary)
          service_tested=$(python3 -c '
          import json, sys
          from scripts import lib
          plan = json.loads(sys.stdin.read())
          service_pkg, _ = lib.read_service_meta()
          print("true" if plan["mode"] == "full" or service_pkg in plan["packages"] else "false")
          ' <<<"${plan_json}")
          echo "service_tested=${service_tested}" >>"${GITHUB_OUTPUT}"
          python3 -m scripts.checks.rust_selection lint "${plan_args[@]}"
          python3 -m scripts.checks.rust_selection test "${plan_args[@]}"
          just unused-deps
          just architecture-check
          just vendor-drift
          just typos
      - name: Advisory test-line growth budget
        if: github.event_name == 'pull_request' && needs.changes.outputs.base_sha != ''
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: python3 -m scripts.checks.test_budget --base "${BASE_SHA}" --summary
      - name: Profiling features
        if: needs.changes.outputs.profiling == 'true' || needs.changes.outputs.post_merge == 'true'
        run: just profiling-check
      - name: Vendored transport regressions
        if: needs.changes.outputs.vendor_transport == 'true' || needs.changes.outputs.post_merge == 'true'
        run: just native-transport
      - name: OpenAPI contract
        if: needs.changes.outputs.openapi == 'true'
        env:
          SERVICE_TESTED: ${{ steps.rust_quality.outputs.service_tested }}
        run: |
          set -euo pipefail
          if [[ "${SERVICE_TESTED}" == true ]]; then
            just openapi-lint
          else
            just openapi-check
          fi
      - name: OpenAPI breaking compatibility
        if: github.event_name == 'pull_request' && needs.changes.outputs.openapi == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          just openapi-breaking-since "${BASE_SHA}"
      # template:begin postgres:ci-migrations-step
      - name: SQL migrations
        if: needs.changes.outputs.migrations == 'true'
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mise install --locked github:sbdchd/squawk
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            just migration-check "${BASE_SHA}"
          else
            just migration-check HEAD
          fi
      # template:end postgres:ci-migrations-step

  security:
    needs: [changes, secrets]
    if: "!cancelled() && (needs.changes.outputs.deps == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'))"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just cargo-deny
          cache_key_prefix: mise-security
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Dependency policy and vendored drift
        run: |
          set -euo pipefail
          just deny
          just vendor-drift --online
          if [[ -f tools/grpc-codegen/Cargo.toml ]]; then
            just grpc-generator-deny
          fi

  # template:begin grpc:ci-grpc-job
  grpc:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.grpc == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just buf
          cache_key_prefix: mise-grpc
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check protobuf schemas and generated Rust
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/grpc-codegen
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            just grpc-check "${BASE_SHA}"
          else
            just grpc-check HEAD
          fi
  # template:end grpc:ci-grpc-job

  # template:begin integration:ci-integration-job
  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: integration
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just cargo-nextest
          cache_key_prefix: mise-int
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache_save_post: true
      - name: PostgreSQL integration and SQLx check
        if: >-
          hashFiles('crates/infra-postgres/Cargo.toml') != '' &&
          (needs.changes.outputs.integration_db == 'true' || needs.changes.outputs.sqlx_check == 'true')
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
          RUN_DB: ${{ needs.changes.outputs.integration_db }}
          RUN_SQLX: ${{ needs.changes.outputs.sqlx_check }}
        run: |
          set -euo pipefail
          if [[ "${RUN_SQLX}" == true ]]; then
            mise install --locked cargo:sqlx-cli
          fi
          if [[ "${RUN_DB}" == true && "${RUN_SQLX}" == true ]]; then
            REQUIRE_DOCKER=1 INTEGRATION_DB_SQLX_CHECK=1 just test-integration-db
          elif [[ "${RUN_DB}" == true ]]; then
            REQUIRE_DOCKER=1 just test-integration-db
          else
            REQUIRE_DOCKER=1 just sqlx-check
          fi
      - name: Cache integration
        if: hashFiles('crates/infra-cache/Cargo.toml') != '' && needs.changes.outputs.integration_cache == 'true'
        run: REQUIRE_DOCKER=1 just test-integration-cache
      - name: Object storage integration
        if: hashFiles('crates/infra-object-storage/Cargo.toml') != '' && needs.changes.outputs.integration_object_storage == 'true'
        run: REQUIRE_DOCKER=1 just test-integration-object-storage
      - name: JetStream integration
        if: hashFiles('crates/infra-messaging/Cargo.toml') != '' && needs.changes.outputs.integration_messaging == 'true'
        run: REQUIRE_DOCKER=1 just test-integration-messaging
      - name: Temporal integration
        if: hashFiles('crates/infra-temporal/Cargo.toml') != '' && needs.changes.outputs.integration_temporal == 'true'
        run: REQUIRE_DOCKER=1 just test-integration-temporal
  # template:end integration:ci-integration-job

  # template:begin outbound-auth:ci-oauth-job
  oauth-integration:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.oauth == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: integration
          cache-bin: "false"
          save-if: "false"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just
          cache_key_prefix: mise-just
          cache_save: false
      - name: Keycloak OAuth integration
        run: REQUIRE_DOCKER=1 just test-integration-oauth
  # template:end outbound-auth:ci-oauth-job

  image:
    needs: changes
    if: needs.changes.outputs.docker == 'true' && needs.changes.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just
          cache_key_prefix: mise-just
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
          cleanup: false
          version: v${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build, smoke-check, scan, and SBOM
        env:
          VCS_REF: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          MIGRATIONS_CHANGED: ${{ needs.changes.outputs.migrations }}
        run: |
          set -euo pipefail
          just image-build "service:ci"
          image_id=$(docker image inspect --format '{{.Id}}' service:ci)
          if [[ "${MIGRATIONS_CHANGED}" == true && -d crates/migrate ]]; then
            just migration-validate "${image_id}" "${VCS_REF}"
          else
            just image-check "${image_id}" "${VCS_REF}"
          fi
          just image-scan "${image_id}"
          just image-sbom "${image_id}" "${RUNNER_TEMP}/source.cdx.json"

  # template:begin source-template:ci-runtime-progress-job
  runtime-progress:
    needs: changes
    if: needs.changes.outputs.runtime_progress == 'true' && needs.changes.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNTIME_PROGRESS_RESULTS: ${{ github.workspace }}/.artifacts/runtime-progress/measurements
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          shared-key: rust-quality
          save-if: "false"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just
          cache_key_prefix: mise-just
          cache_save: false
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
          cleanup: false
          version: v${{ env.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: CPU-quota progress proof
        env:
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
        run: just runtime-progress-proof
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-progress-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/runtime-progress
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # template:end source-template:ci-runtime-progress-job

  # template:begin source-template:ci-template-job
  template:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.template == 'true'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just
          cache_key_prefix: mise-just
          cache_save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Projection and unit checks
        run: |
          set -euo pipefail
          just template-check
          just template-test

  template-matrix:
    needs: [changes, secrets]
    if: "!cancelled() && needs.changes.outputs.template == 'true' && needs.changes.outputs.post_merge == 'true'"
    name: template-matrix (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: core-auth
            profiles: minimal authn-jwt authn-introspection outbound-oauth
          - shard: adapters-grpc
            profiles: postgres cache-s3 grpc-service-auth temporal
          - shard: durable-full
            profiles: postgres-full messaging-outbox full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: rust-quality
          cache-bin: "false"
          save-if: "false"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10 # zizmor: ignore[cache-poisoning]
        with:
          version: "2026.11.10"
          install_args: just cargo-nextest
          cache_key_prefix: mise-int
          cache_save: false
      - name: Canonical profile build and test shard
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PROFILES: ${{ matrix.profiles }}
        run: |
          set -euo pipefail
          cargo fetch --locked
          read -r -a selected_profiles <<<"${PROFILES}"
          just template-matrix --profiles "${selected_profiles[@]}"
  # template:end source-template:ci-template-job

  required:
    if: always()
    needs:
      - changes
      - secrets
      - repo-lint
      - rust
      - security
      # template:begin grpc:ci-required-grpc
      - grpc
      # template:end grpc:ci-required-grpc
      # template:begin integration:ci-required-integration
      - integration
      # template:end integration:ci-required-integration
      # template:begin outbound-auth:ci-required-oauth
      - oauth-integration
      # template:end outbound-auth:ci-required-oauth
      - image
      # template:begin source-template:ci-required-runtime-progress
      - runtime-progress
      # template:end source-template:ci-required-runtime-progress
      # template:begin source-template:ci-required-template
      - template
      - template-matrix
      # template:end source-template:ci-required-template
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required CI gates
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [
              f"{k}={v.get('result')}"
              for k, v in sorted(needs.items())
              if (k == "changes" and v.get("result") != "success")
              or (k != "changes" and v.get("result") not in {"success", "skipped"})
          ]
          if failed:
              print("CI gates failed: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          print("all applicable CI gates passed")
          PY
