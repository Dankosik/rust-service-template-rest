name: ci

# Jobs are selected by the changed surfaces that scripts/ci/changed-surfaces.sh
# reports; `make verify` reads the same classifier. `required` is the one
# status to protect: it fails on any failed or cancelled gate and accepts a
# gate the surfaces did not select. Pull requests run the gate; the long
# proofs (initializer, images, runtime progress, jobs reliability) run after
# merge, on main, and .github/workflows/main-health.yml reports a red main and
# moves the `green` branch. A push to main replaces its pending run, so one run
# can cover several merges: it classifies the diff from `green`, not from the
# previous push. Job layout and the reason for each gate:
# docs/ci-cd-production-ready.md.
#
# The account runs at most twenty jobs at once and gives a free runner to any
# queued job, long or short. The gates that take a few minutes therefore also
# need `secrets`, the seconds-long gate every event runs: the long gates claim
# their runners first, and the short ones take the runners left beside them.
# `!cancelled()` keeps a short gate running when `secrets` fails.

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    # Weekly: advisory databases move without a commit, so every surface runs.
    - cron: "41 4 * * 2"
  workflow_dispatch:
    # template:begin messaging:ci-messaging-recovery-input
    inputs:
      messaging_recovery:
        description: Run the bounded owned R3/TLS recovery and capacity fixture
        type: boolean
        default: false
    # template:end messaging:ci-messaging-recovery-input

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  # Line tables keep file:line in test backtraces; full debuginfo made each
  # target cache about 4 GB. Cache keys carry the level, so a change never
  # restores artifacts built at another one.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Dependencies build without debuginfo: the Cargo caches hold dependency
  # artifacts alone, and workspace frames keep their line tables. Cargo reads
  # no environment variable for a package override, so each Rust job writes
  # this level to the runner's Cargo configuration; the name keeps it in the
  # CARGO_* environment the cache keys hash.
  CARGO_DEPENDENCY_DEBUG: "false"
  RUST_BACKTRACE: short
  # zstd reads its default level here when actions/cache archives a cache.
  # Only a push to main pays the slower save; restores are not slower, and
  # the smaller archives keep the caches inside the repository's 10 GB.
  ZSTD_CLEVEL: "12"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_source: ${{ steps.surfaces.outputs.rust_source }}
      cargo_dependencies: ${{ steps.surfaces.outputs.cargo_dependencies }}
      dependency_policy: ${{ steps.surfaces.outputs.dependency_policy }}
      lint_config: ${{ steps.surfaces.outputs.lint_config }}
      openapi: ${{ steps.surfaces.outputs.openapi }}
      # template:begin grpc:ci-grpc-output
      grpc_schema: ${{ steps.surfaces.outputs.grpc_schema }}
      # template:end grpc:ci-grpc-output
      tool_manifest: ${{ steps.surfaces.outputs.tool_manifest }}
      github_workflows: ${{ steps.surfaces.outputs.github_workflows }}
      dependency_automation: ${{ steps.surfaces.outputs.dependency_automation }}
      shell: ${{ steps.surfaces.outputs.shell }}
      runtime_image: ${{ steps.surfaces.outputs.runtime_image }}
      # template:begin runtime-progress:ci-runtime-progress-output
      runtime_progress: ${{ steps.surfaces.outputs.runtime_progress }}
      # template:end runtime-progress:ci-runtime-progress-output
      publication_metadata: ${{ steps.surfaces.outputs.publication_metadata }}
      secret_scanning: ${{ steps.surfaces.outputs.secret_scanning }}
      # template:begin postgres:ci-postgres-maintenance-rules-output
      postgres_maintenance_rules: ${{ steps.surfaces.outputs.postgres_maintenance_rules }}
      # template:end postgres:ci-postgres-maintenance-rules-output
      db_integration: ${{ steps.surfaces.outputs.db_integration }}
      messaging_integration: ${{ steps.surfaces.outputs.messaging_integration }}
      cache_integration: ${{ steps.surfaces.outputs.cache_integration }}
      object_storage_integration: ${{ steps.surfaces.outputs.object_storage_integration }}
      oauth_integration: ${{ steps.surfaces.outputs.oauth_integration }}
      migrations: ${{ steps.surfaces.outputs.migrations }}
      agent_instructions: ${{ steps.surfaces.outputs.agent_instructions }}
      documentation: ${{ steps.surfaces.outputs.documentation }}
      validation_system: ${{ steps.surfaces.outputs.validation_system }}
      module_initializer: ${{ steps.surfaces.outputs.module_initializer }}
      initializer_runtime: ${{ steps.surfaces.outputs.initializer_runtime }}
      initializer_matrix: ${{ steps.surfaces.outputs.initializer_matrix }}
      initializer_artifacts: ${{ steps.surfaces.outputs.initializer_artifacts }}
      artifact_graphs: ${{ steps.surfaces.outputs.artifact_graphs }}
      artifact_matrix: ${{ steps.surfaces.outputs.artifact_matrix }}
      duplication: ${{ steps.surfaces.outputs.duplication }}
      architecture: ${{ steps.surfaces.outputs.architecture }}
      post_merge: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Resolve the last green base
        # A green ancestor covers the merges whose own runs were replaced
        # while pending; without one the previous push is the base.
        id: green
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=${BEFORE_SHA}
          # A missing branch prints the error body, not a commit.
          green=$(gh api "repos/${GITHUB_REPOSITORY}/branches/green" --jq .commit.sha 2>/dev/null || true)
          if [[ ${green} =~ ^[0-9a-f]{40}$ && $(gh api "repos/${GITHUB_REPOSITORY}/compare/${green}...${GITHUB_SHA}" --jq .status) == ahead ]]; then
            base=${green}
          fi
          echo "sha=${base}" >>"${GITHUB_OUTPUT}"
      - name: Fetch exact comparison base
        if: >-
          !startsWith(github.ref, 'refs/tags/') &&
          github.event_name != 'workflow_dispatch' &&
          github.event_name != 'schedule' &&
          (steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '' &&
          (steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before) != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "${BASE_SHA}"
      - name: Classify changed surfaces
        id: surfaces
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        # Tags, schedules, manual runs, and a push without a readable base
        # select every surface; a diff event is classified by both the base
        # and the head classifier. A selected initializer plans the runtime
        # graphs the same diff can affect (scripts/ci/initializer-matrix.py).
        run: |
          set -euo pipefail
          paths=${RUNNER_TEMP}/changed-paths
          surfaces=${RUNNER_TEMP}/surfaces
          if [[ "${EVENT_NAME}" == schedule || "${EVENT_NAME}" == workflow_dispatch || "${GITHUB_REF}" == refs/tags/* || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            bash ./scripts/ci/changed-surfaces.sh --all >"${surfaces}"
            plan=(--all)
            : >"${paths}"
          else
            bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD >"${paths}"
            bash ./scripts/ci/changed-surfaces.sh --union "${BASE_SHA}" <"${paths}" >"${surfaces}"
            plan=()
          fi
          tee -a "${GITHUB_OUTPUT}" <"${surfaces}" >>"${GITHUB_STEP_SUMMARY}"
          if grep -Eq '^initializer_(runtime|artifacts)=true$' "${surfaces}"; then
            python3 ./scripts/ci/initializer-matrix.py "${plan[@]}" <"${paths}" | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
          fi

  # template:begin grpc:ci-grpc-job
  grpc:
    needs: [changes, secrets]
    if: >-
      !cancelled() && needs.changes.outputs.grpc_schema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore generator cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/grpc-codegen
          key: grpc-codegen-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'tools/grpc-codegen/Cargo.lock') }}
      - name: Check schema and committed generation
        env:
          GRPC_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || github.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/grpc-codegen
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GRPC_BASE_REF}"
          bash ./scripts/ci/measure.sh grpc-schema -- make grpc-check
  # template:end grpc:ci-grpc-job

  # template:begin postgres:ci-postgres-maintenance-rules-job
  postgres-maintenance-rules:
    needs: [changes, secrets]
    if: >-
      !cancelled() && needs.changes.outputs.postgres_maintenance_rules == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rule syntax and deterministic fixtures
        run: bash ./scripts/ci/measure.sh postgres-maintenance-rules -- make postgres-maintenance-rules
  # template:end postgres:ci-postgres-maintenance-rules-job

  quality:
    needs: changes
    if: >-
      needs.changes.outputs.rust_source == 'true' ||
      needs.changes.outputs.cargo_dependencies == 'true' ||
      needs.changes.outputs.lint_config == 'true' ||
      needs.changes.outputs.openapi == 'true' ||
      needs.changes.outputs.migrations == 'true' ||
      needs.changes.outputs.agent_instructions == 'true' ||
      needs.changes.outputs.duplication == 'true' ||
      needs.changes.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Not a CARGO_* or RUST* name: rust-cache hashes those into its keys, and
      # quality-profiles restores this job's cache.
      NEEDS_RUST: >-
        ${{ needs.changes.outputs.rust_source == 'true' ||
            needs.changes.outputs.cargo_dependencies == 'true' ||
            needs.changes.outputs.lint_config == 'true' ||
            needs.changes.outputs.openapi == 'true' ||
            needs.changes.outputs.migrations == 'true' ||
            needs.changes.outputs.duplication == 'true' ||
            needs.changes.outputs.architecture == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        # Every Rust job loads the checked-out action in this form: actionlint
        # 1.7.12 does not parse GitHub's self-repository form (`$/…`) yet.
        if: env.NEEDS_RUST == 'true'
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        # Keyed by the toolchain, every manifest and lockfile, and the CARGO_*
        # and RUST* environment (the debuginfo levels among them). Only a push
        # to main saves, after a successful job, and the saved target holds
        # dependency artifacts alone: workspace crates rebuild on every
        # checkout anyway, and keeping them overran the 10 GB cache budget.
        # The first save owns a key, so only a push that builds the workspace
        # saves: one that ran the OpenAPI or validation steps, or `make lint`
        # alone for a lint configuration change, would leave a partial target
        # under the key until the lockfile changes. The tool manifest loads
        # after this step, so a tool pin does not move the key.
        # zizmor reads lookup-only, not save-if, hence its ignore below.
        if: env.NEEDS_RUST == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: quality
          cache-bin: "false"
          save-if: >-
            ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (
                needs.changes.outputs.rust_source == 'true' ||
                needs.changes.outputs.cargo_dependencies == 'true') }}
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Fetch locked Cargo packages
        if: env.NEEDS_RUST == 'true'
        run: cargo fetch --locked
      - name: Install pinned Cargo tools
        if: needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-shear@${{ env.CARGO_SHEAR_VERSION }}
      - name: Format
        if: >-
          needs.changes.outputs.rust_source == 'true' ||
          needs.changes.outputs.cargo_dependencies == 'true' ||
          needs.changes.outputs.lint_config == 'true'
        run: bash ./scripts/ci/measure.sh quality-format -- make fmt-check
      - name: Affected crates
        # Pull requests select the changed crates and their dependents; every
        # other event, and any manifest, lockfile, or toolchain change, runs
        # the workspace.
        if: >-
          (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
          needs.changes.outputs.rust_source == 'true' &&
          needs.changes.outputs.cargo_dependencies != 'true'
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD | bash ./scripts/ci/affected-crates.sh | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
      - name: Lint, build, test
        id: lint-build-test
        if: >-
          needs.changes.outputs.rust_source == 'true' ||
          needs.changes.outputs.cargo_dependencies == 'true' ||
          needs.changes.outputs.lint_config == 'true' ||
          needs.changes.outputs.duplication == 'true' ||
          needs.changes.outputs.architecture == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          CARGO_DEPENDENCIES: ${{ needs.changes.outputs.cargo_dependencies }}
          LINT_CONFIG: ${{ needs.changes.outputs.lint_config }}
          NATIVE_CHECKER: ${{ needs.changes.outputs.duplication == 'true' || needs.changes.outputs.architecture == 'true' }}
          RUST_SOURCE: ${{ needs.changes.outputs.rust_source }}
          FALLBACK: ${{ steps.affected.outputs.fallback }}
          LINT_PACKAGES: ${{ steps.affected.outputs.lint_packages }}
          TEST_PACKAGES: ${{ steps.affected.outputs.test_packages }}
        run: |
          set -euo pipefail
          if [[ "${CARGO_DEPENDENCIES}" == true || "${FALLBACK}" == true ]] || [[ "${RUST_SOURCE}" == true && "${EVENT_NAME}" != pull_request && "${EVENT_NAME}" != merge_group ]]; then
            bash ./scripts/ci/measure.sh quality-workspace -- make --keep-going lint build test
            exit 0
          fi
          if [[ "${LINT_CONFIG}" == true || "${NATIVE_CHECKER}" == true ]]; then
            bash ./scripts/ci/measure.sh quality-lint -- make lint
          elif [[ -n "${LINT_PACKAGES}" ]]; then
            bash ./scripts/ci/measure.sh quality-lint-changed -- make lint-changed PKGS="${LINT_PACKAGES}"
          fi
          if [[ -n "${TEST_PACKAGES}" ]]; then
            bash ./scripts/ci/measure.sh quality-test-changed -- make test-changed PKGS="${TEST_PACKAGES}"
          elif [[ "${RUST_SOURCE}" == true ]]; then
            echo "no crate selected for tests"
          fi
      - name: Unused dependencies
        if: needs.changes.outputs.rust_source == 'true' || needs.changes.outputs.cargo_dependencies == 'true'
        run: bash ./scripts/ci/measure.sh quality-unused-deps -- make unused-deps
      - name: OpenAPI
        # Redocly over the committed document plus the drift and contract
        # tests. Node.js is preinstalled on the runner.
        if: needs.changes.outputs.openapi == 'true'
        run: bash ./scripts/ci/measure.sh quality-openapi -- make openapi-check
      - name: Generate handler OpenAPI diagnostic
        # The committed-file drift check remains above. This always-run step
        # preserves the assembled handler output when it reports stale bytes.
        if: always() && needs.changes.outputs.openapi == 'true'
        id: generated-openapi
        run: |
          set -euo pipefail
          mkdir -p .ci/generated-openapi
          bash ./scripts/ci/measure.sh quality-openapi-generate -- make openapi-generate OPENAPI_FILE=.ci/generated-openapi/service.yaml
          test -s .ci/generated-openapi/service.yaml
      - name: Upload generated OpenAPI diagnostic
        if: always() && steps.generated-openapi.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-openapi-${{ github.sha }}
          path: .ci/generated-openapi/service.yaml
          if-no-files-found: error
      - name: OpenAPI compatibility
        # oasdiff against the pull-request base. Go is preinstalled on the runner.
        if: github.event_name == 'pull_request' && needs.changes.outputs.openapi == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          git show "${BASE_SHA}:api/openapi/service.yaml" >/tmp/openapi-base.yaml
          bash ./scripts/ci/measure.sh quality-openapi-breaking -- make openapi-breaking BASE_OPENAPI=/tmp/openapi-base.yaml
      # template:begin postgres:ci-quality-migrations
      - name: Migrations
        # Static append-only history against the base, the lint of the added
        # files, and the source rules over the embedded set; the runtime
        # checksum check runs in test-integration-db and the image rehearsal.
        # A push compares with the commit it replaced, so a migration that a
        # branch merged behind its base added out of order still fails here.
        if: needs.changes.outputs.migrations == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == merge_group ]]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            bash ./scripts/ci/measure.sh quality-migrations -- make migration-check BASE_REF="${BASE_SHA}"
          elif [[ "${EVENT_NAME}" == push && "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
            bash ./scripts/ci/measure.sh quality-migrations -- make migration-check BASE_REF="${BEFORE_SHA}"
          else
            bash ./scripts/ci/measure.sh quality-migrations -- make migration-check BASE_REF=HEAD
          fi
          bash ./scripts/ci/measure.sh quality-migration-history -- make migration-history-self-test
      # template:end postgres:ci-quality-migrations
      - name: Instructions
        # Skill shape plus the generated harness carriers against their sources.
        if: needs.changes.outputs.agent_instructions == 'true'
        run: bash ./scripts/ci/measure.sh quality-instructions -- make check-instructions
      - name: Readability checker prerequisites
        if: needs.changes.outputs.duplication == 'true' || needs.changes.outputs.architecture == 'true'
        run: |
          command -v python3
          command -v npx
          command -v rustup
      - name: Readability checker self-test
        # Reuses the compiler-artifact receipt `make lint` wrote above.
        if: needs.changes.outputs.duplication == 'true' || needs.changes.outputs.architecture == 'true'
        run: bash ./scripts/ci/measure.sh quality-checkers -- make quality-check-self-test
      - name: Rust duplication
        if: needs.changes.outputs.duplication == 'true'
        run: bash ./scripts/ci/measure.sh quality-duplication -- make duplication-check
      - name: Declared architecture
        if: needs.changes.outputs.architecture == 'true'
        run: bash ./scripts/ci/measure.sh quality-architecture -- make architecture-check
      - name: Readability profile projections
        if: needs.changes.outputs.duplication == 'true' || needs.changes.outputs.architecture == 'true'
        env:
          # The two webhook projections compile their tests over this job's
          # dependencies; each projection writes its sources before it builds.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          if [ -f make/source.mk ]; then
            bash ./scripts/ci/measure.sh quality-projections -- make template-quality-projections
          fi

  # Quality checks that need no workspace build of their own run beside
  # `quality`; `required` demands each one its surfaces select.
  # quality-profiles restores quality's cache without saving it: the shared key
  # matches only because neither job adds a CARGO_* or RUST* variable before
  # its cache step.
  quality-profiles:
    needs: [changes, secrets]
    if: >-
      !cancelled() && (
        needs.changes.outputs.rust_source == 'true' ||
        needs.changes.outputs.cargo_dependencies == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: quality
          cache-bin: "false"
          save-if: "false"
      - name: Fetch locked Cargo packages
        run: cargo fetch --locked
      - name: Native transport regressions
        # The helper records root and excluded-package graph identities, then
        # runs every selected vendor filter serially with locked Cargo.
        if: needs.changes.outputs.cargo_dependencies == 'true'
        env:
          CARGO_TARGET_DIR: target
        run: bash ./scripts/ci/measure.sh quality-native-transport -- make native-transport-regressions
      - name: Upload native transport receipt
        if: always() && needs.changes.outputs.cargo_dependencies == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-transport-receipt
          path: .ci/native-transport/receipt.json
          if-no-files-found: error
      - name: Optional profiling configurations
        if: '!cancelled()'
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path crates/service/Cargo.toml --all-targets --features hotpath
          cargo check --locked --manifest-path crates/service/Cargo.toml --all-targets --features hotpath,hotpath-alloc,hotpath-mcp,hotpath-cpu,hotpath/hotpath-prometheus
          cargo tree --locked --manifest-path crates/service/Cargo.toml --features hotpath,hotpath-alloc,hotpath-mcp,hotpath-cpu,hotpath/hotpath-prometheus -e features -i hotpath
          if [ -f specs/hotpath-remaining-optimizations/scripts/check-profile-mcp.py ]; then
            python3 specs/hotpath-remaining-optimizations/scripts/check-vendor.py
            cargo build --locked -p service --bin service --features hotpath,hotpath-alloc,hotpath-mcp
            python3 specs/hotpath-remaining-optimizations/scripts/check-profile-mcp.py
          fi
      - name: Preserve profiling compatibility receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-mcp-${{ github.sha }}
          path: .ci/profile-mcp
          if-no-files-found: ignore

  quality-validation:
    needs: [changes, secrets]
    if: >-
      !cancelled() && needs.changes.outputs.validation_system == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        # The affected-crate planner and the verify self-test read the
        # workspace through cargo; nothing here compiles it.
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - name: Fetch locked Cargo packages
        run: cargo fetch --locked
      - name: Validation routing
        # Four independent self-tests over private fixtures, run side by side.
        run: bash ./scripts/ci/measure.sh quality-validation-system -- make -j4 --output-sync=target changed-surfaces-check affected-crates-check validation-lock-self-test verify-check

  security:
    needs: [changes, secrets]
    if: >-
      !cancelled() && (
        needs.changes.outputs.cargo_dependencies == 'true' ||
        needs.changes.outputs.dependency_policy == 'true' ||
        needs.changes.outputs.github_workflows == 'true' ||
        (github.event_name == 'pull_request' && (
          needs.changes.outputs.tool_manifest == 'true' ||
          needs.changes.outputs.runtime_image == 'true'
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Dependency review
        # New vulnerable dependencies on a pull request, from the lockfile
        # and the workflow action pins.
        if: >-
          github.event_name == 'pull_request' && (
            needs.changes.outputs.cargo_dependencies == 'true' ||
            needs.changes.outputs.tool_manifest == 'true' ||
            needs.changes.outputs.github_workflows == 'true' ||
            needs.changes.outputs.runtime_image == 'true'
          )
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Install pinned toolchain
        # cargo-deny resolves the locked graph through cargo.
        if: needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.dependency_policy == 'true'
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Install pinned Cargo tools
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},zizmor@${{ env.ZIZMOR_VERSION }}
      - name: Dependency policy
        if: needs.changes.outputs.cargo_dependencies == 'true' || needs.changes.outputs.dependency_policy == 'true'
        run: bash ./scripts/ci/measure.sh security-deny -- make deny
      # template:begin grpc:ci-grpc-generator-dependencies
      - name: Generator dependency policy
        if: needs.changes.outputs.grpc_schema == 'true'
        run: cargo-deny --manifest-path tools/grpc-codegen/Cargo.toml --config deny.toml --locked check
      # template:end grpc:ci-grpc-generator-dependencies
      - name: Workflow security
        if: needs.changes.outputs.github_workflows == 'true'
        env:
          # Enables the online audits (known-vulnerable-actions, impostor-commit).
          GH_TOKEN: ${{ github.token }}
        run: bash ./scripts/ci/measure.sh security-zizmor -- make zizmor

  secrets:
    needs: changes
    if: github.event_name != 'schedule' || needs.changes.outputs.secret_scanning == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Restore Go tool caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: Secret scan
        # Tags, manual runs, selected schedules, and a push without a readable base
        # scan complete HEAD ancestry; other events scan commits since the base.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* || "${EVENT_NAME}" == workflow_dispatch || "${EVENT_NAME}" == schedule || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            bash ./scripts/ci/measure.sh secrets-history -- make secret-scan-history
          else
            bash ./scripts/ci/measure.sh secrets-range -- make secret-scan BASE_REF="${BASE_SHA}"
          fi
      - name: Save Go tool caches
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  delivery:
    needs: [changes, secrets]
    if: >-
      !cancelled() && (
        needs.changes.outputs.shell == 'true' ||
        needs.changes.outputs.github_workflows == 'true' ||
        needs.changes.outputs.tool_manifest == 'true' ||
        needs.changes.outputs.runtime_image == 'true' ||
        needs.changes.outputs.publication_metadata == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Restore Go tool caches
        if: needs.changes.outputs.github_workflows == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/versions.env') }}
      - name: Workflows
        if: needs.changes.outputs.github_workflows == 'true'
        run: bash ./scripts/ci/measure.sh delivery-actionlint -- make actionlint
      - name: Shell
        # Changed scripts on a diff event, every script otherwise.
        if: needs.changes.outputs.shell == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* || "${EVENT_NAME}" == workflow_dispatch || "${EVENT_NAME}" == schedule || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
            bash ./scripts/ci/measure.sh delivery-shellcheck -- make shellcheck
          else
            git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            files=$(bash ./scripts/ci/git-changed-paths.sh --diff "${BASE_SHA}" HEAD | while IFS= read -r file; do if [[ ${file} == *.sh && -f ${file} ]]; then printf '%s ' "${file}"; fi; done)
            bash ./scripts/ci/measure.sh delivery-shellcheck -- make shellcheck SHELL_FILES="${files% }"
          fi
      - name: Install pinned Cargo tools
        if: needs.changes.outputs.tool_manifest == 'true'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }},cargo-shear@${{ env.CARGO_SHEAR_VERSION }},zizmor@${{ env.ZIZMOR_VERSION }}
      - name: Tool manifest
        if: needs.changes.outputs.tool_manifest == 'true'
        run: bash ./scripts/ci/measure.sh delivery-tools -- make tools-check
      - name: Set up Buildx
        id: buildx
        if: needs.changes.outputs.runtime_image == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          use: false
          cleanup: false
      - name: Dockerfile
        if: needs.changes.outputs.runtime_image == 'true'
        env:
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          VALIDATION_BUILDER_EXCLUSIVE: "1"
        run: bash ./scripts/ci/measure.sh delivery-dockerfile -- make dockerfile-check
      - name: Publication metadata
        if: needs.changes.outputs.publication_metadata == 'true'
        run: bash ./scripts/ci/measure.sh delivery-publication-metadata -- make publish-image-metadata-check

  image-source:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' && needs.changes.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    # Keep the existing ceiling until matched native measurement justifies narrowing it.
    timeout-minutes: 90
    env:
      IMAGE_LANE: source
    outputs:
      artifact-id: ${{ steps.proof.outputs.artifact-id }}
      artifact-digest: ${{ steps.proof.outputs.artifact-digest }}
      artifact-url: ${{ steps.proof.outputs.artifact-url }}
      producing-attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        id: buildx
        with:
          use: false
          cleanup: false
      - name: Record producing attempt
        id: provenance
        run: printf 'attempt=%s\n' "${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
      # No BuildKit cache import or export: the lane runs for image, manifest
      # and lockfile changes, which change the cooked recipe anyway, and the
      # exported stage never survived the repository's 10 GB cache budget
      # (docs/ci-cd-production-ready.md, Pipeline time).
      - name: Build runtime image
        env:
          VCS_REF: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
          VALIDATION_BUILDER_EXCLUSIVE: "1"
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-source
        run: |
          set -euo pipefail
          bash ./scripts/ci/measure.sh image-build -- make runtime-image-build
          image_id=$(docker image inspect --format '{{.Id}}' service:ci)
          [[ ${image_id} =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'image_id=%s\n' "${image_id}" >>"${GITHUB_OUTPUT}"
          printf '%s\n' "${image_id}" >"${MEASURE_OUTPUT_DIR}/image-id"
        id: source-image
      - name: Runtime image lifecycle
        if: needs.changes.outputs.runtime_image == 'true' && needs.changes.outputs.migrations != 'true'
        env:
          VCS_REF: ${{ github.sha }}
          IMAGE_ID: ${{ steps.source-image.outputs.image_id }}
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-source
        run: bash ./scripts/ci/measure.sh image-lifecycle -- make runtime-image-check RUNTIME_IMAGE="${IMAGE_ID}" RUNTIME_EXPECTED_COMMIT="${VCS_REF}"
      # template:begin postgres:ci-image-migration-rehearsal
      - name: Migration rehearsal
        if: needs.changes.outputs.runtime_image == 'true' && needs.changes.outputs.migrations == 'true'
        env:
          VCS_REF: ${{ github.sha }}
          IMAGE_ID: ${{ steps.source-image.outputs.image_id }}
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-source
        run: bash ./scripts/ci/measure.sh image-migration-rehearsal -- env REQUIRE_DOCKER=1 make migration-validate RUNTIME_IMAGE="${IMAGE_ID}" RUNTIME_EXPECTED_COMMIT="${VCS_REF}"
      # template:end postgres:ci-image-migration-rehearsal
      - name: Image vulnerabilities
        run: bash ./scripts/ci/measure.sh image-security -- make container-security CONTAINER_IMAGE="${IMAGE_ID}"
        env:
          IMAGE_ID: ${{ steps.source-image.outputs.image_id }}
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-source
      - name: Source image SBOM
        env:
          IMAGE_ID: ${{ steps.source-image.outputs.image_id }}
          MEASURE_ARTIFACT_PATH: ${{ runner.temp }}/image-proof-source/source.cdx.json
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-source
        run: bash ./scripts/ci/measure.sh image-sbom -- make container-sbom CONTAINER_IMAGE="${IMAGE_ID}" SBOM_OUTPUT="${MEASURE_ARTIFACT_PATH}"
      - name: Upload image proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-proof-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image-proof-source
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
        id: proof

  image-derived:
    needs: changes
    if: needs.changes.outputs.artifact_graphs != '' && needs.changes.outputs.post_merge == 'true'
    name: image-derived (${{ matrix.graphs }})
    runs-on: ubuntu-latest
    # Keep the existing ceiling until matched native measurement justifies narrowing it.
    timeout-minutes: 90
    strategy:
      # The graphs share no BuildKit layer (each build gets its own builder),
      # so a leg takes the sum of its graphs: graph 65 runs alone, and the two
      # core representatives share a leg no longer than an initializer part
      # (scripts/ci/initializer-matrix.py ARTIFACT_LEGS). Every leg reports its
      # own result; the aggregate is success only when each selected leg
      # passed with its uploaded proof. With the initializer's cap it leaves
      # about six of the account's twenty runners to pull-request gates while
      # main proves a merge.
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.changes.outputs.artifact_matrix || '{"include":[]}') }}
    env:
      IMAGE_LANE: derived
    outputs:
      # A matrix job's outputs come from whichever leg finished last; the
      # `image` aggregate reads them as one leg's proof beside the result.
      artifact-id: ${{ steps.proof.outputs.artifact-id }}
      artifact-digest: ${{ steps.proof.outputs.artifact-digest }}
      artifact-url: ${{ steps.proof.outputs.artifact-url }}
      producing-attempt: ${{ steps.provenance.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Record producing attempt
        id: provenance
        run: printf 'attempt=%s\n' "${GITHUB_RUN_ATTEMPT}" >>"${GITHUB_OUTPUT}"
      - name: Install initializer toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        # The initialization's staged OpenAPI build compiles the graph's debug
        # dependencies; the initializer family cache already holds most of them.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: initializer-${{ matrix.cache }}
          cache-bin: "false"
          save-if: "false"
      - name: Fetch locked initializer packages
        run: bash ./scripts/ci/measure.sh image-derived-fetch -- cargo fetch --locked
        env:
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-derived
      - name: Initialized release artifacts
        env:
          GRAPHS: ${{ matrix.graphs }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          MEASURE_OUTPUT_DIR: ${{ runner.temp }}/image-proof-derived
        run: bash ./scripts/ci/measure.sh image-derived-artifacts -- make template-init-artifacts ARTIFACT_GRAPHS="${GRAPHS}"
      - name: Upload image proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-proof-derived-${{ matrix.graphs }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.git/codex/template-init
            ${{ runner.temp }}/image-proof-derived
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
        id: proof

  image:
    needs:
      - changes
      - image-source
      - image-derived
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admit selected image lanes
        env:
          IMAGE_NEEDS: ${{ toJSON(needs) }}
          IMAGE_DEFERRED: ${{ needs.changes.outputs.post_merge != 'true' }}
        run: python3 scripts/ci/image-results.py

  # template:begin runtime-progress:ci-runtime-progress-job
  runtime-progress:
    needs: changes
    if: needs.changes.outputs.runtime_progress == 'true' && needs.changes.outputs.post_merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUNTIME_PROGRESS_RESULTS: ${{ github.workspace }}/.artifacts/runtime-progress/measurements
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          shared-key: runtime-progress
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Release process under one CPU quota
        run: bash ./scripts/ci/measure.sh runtime-progress -- make runtime-progress-proof
      - name: Preserve every quota observation and build identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-progress-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/runtime-progress
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # template:end runtime-progress:ci-runtime-progress-job

  # template:begin messaging:ci-messaging-recovery-job
  messaging-recovery:
    if: github.event_name == 'workflow_dispatch' && inputs.messaging_recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
      - name: Cargo caches
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          shared-key: messaging-recovery
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Go for the native backup CLI
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Build the fixed fixture artifacts once
        run: |
          set -euo pipefail
          source tools/versions.env
          test "$(df -Pk . | awk 'END {print $4}')" -ge 8388608
          mkdir -p .artifacts/messaging-recovery/bin .artifacts/messaging-recovery/results
          runtime_image=$(yq -r '.services.postgres.image' env/docker-compose.yml)
          # One static artifact set works in both canonical client runtimes,
          # independent of the hosted runner's glibc version.
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          packages=(-p infra-messaging --example dlq_recovery)
          if [[ -f test/examples/messaging_recovery.rs ]]; then
            packages+=(-p integration-tests --example messaging_recovery -p migrate --bin migrate)
          fi
          cargo build --locked --release --target x86_64-unknown-linux-musl --features infra-messaging/integration "${packages[@]}"
          cp target/x86_64-unknown-linux-musl/release/examples/dlq_recovery .artifacts/messaging-recovery/bin/
          if [[ -f test/examples/messaging_recovery.rs ]]; then
            cp target/x86_64-unknown-linux-musl/release/examples/messaging_recovery .artifacts/messaging-recovery/bin/
            cp target/x86_64-unknown-linux-musl/release/migrate .artifacts/messaging-recovery/bin/
          fi
          CGO_ENABLED=0 GOBIN="${PWD}/.artifacts/messaging-recovery/bin" go install "github.com/nats-io/natscli/nats@v${NATS_CLI_VERSION}"
          docker pull "$(yq -r '.services.nats.image' env/docker-compose.yml)"
          if [[ "${runtime_image}" != null ]]; then
            docker pull "${runtime_image}"
          fi
      - name: Controller custody checks
        run: make messaging-recovery-self-test
      - name: Owned one-record R3/TLS demonstration
        run: >-
          make messaging-recovery
          RECOVERY_ARTIFACTS="${PWD}/.artifacts/messaging-recovery/bin"
          RECOVERY_SESSION="${PWD}/.artifacts/messaging-recovery/results/dlq"
  # template:end messaging:ci-messaging-recovery-job
      # template:begin outbox:ci-native-recovery-rehearsals
      - name: Native backup, fault, capacity and retention situations
        run: >-
          make messaging-recovery RECOVERY_COMMAND=rehearse
          RECOVERY_ARTIFACTS="${PWD}/.artifacts/messaging-recovery/bin"
          RECOVERY_SESSION="${PWD}/.artifacts/messaging-recovery/results/rehearsal"
      - name: Shared-worker R3/TLS capacity, outage and catch-up measurements
        run: >-
          make messaging-recovery RECOVERY_COMMAND=measure
          RECOVERY_ARTIFACTS="${PWD}/.artifacts/messaging-recovery/bin"
          RECOVERY_SESSION="${PWD}/.artifacts/messaging-recovery/results/capacity"
      # template:end outbox:ci-native-recovery-rehearsals
  # template:begin messaging:ci-messaging-recovery-cleanup
      - name: Terminate any interrupted original lifetime
        if: always()
        run: |
          for manifest in .artifacts/messaging-recovery/results/dlq/session.json .artifacts/messaging-recovery/results/rehearsal/*/session.json .artifacts/messaging-recovery/results/capacity/*/session.json; do
            if [[ -f "${manifest}" ]]; then
              bash scripts/ci/messaging-recovery.sh stop --session "${manifest%/session.json}"
            fi
          done
      - name: Retain synthetic evidence without fixture credentials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: messaging-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/messaging-recovery/results/**/evidence/*.json
            .artifacts/messaging-recovery/results/**/session.json
            .artifacts/messaging-recovery/results/**/selections/*.json
            .artifacts/messaging-recovery/results/**/rehearsal.json
            .artifacts/messaging-recovery/results/**/oracle.json
            .artifacts/messaging-recovery/results/**/backups/**/boundary.json
            .artifacts/messaging-recovery/results/capacity/capacity.json
            .artifacts/messaging-recovery/results/capacity/measurement-plan.json
            .artifacts/messaging-recovery/results/capacity/**/measurement.json
            .artifacts/messaging-recovery/results/capacity/**/timeseries.csv
            .artifacts/messaging-recovery/results/capacity/**/report.md
            .artifacts/messaging-recovery/results/capacity/**/IDs.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # template:end messaging:ci-messaging-recovery-cleanup

  # template:begin integration:ci-integration-job
  integration:
    needs: changes
    if: >-
      needs.changes.outputs.db_integration == 'true' ||
      needs.changes.outputs.messaging_integration == 'true' ||
      needs.changes.outputs.cache_integration == 'true' ||
      needs.changes.outputs.object_storage_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        id: cargo-cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Database-backed proof
        if: needs.changes.outputs.db_integration == 'true'
        run: bash ./scripts/ci/measure.sh integration-db -- make test-integration-db
        # Each proof owns a registered Compose project through its canonical script.
      - name: Load tool manifest
        if: needs.changes.outputs.db_integration == 'true'
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Restore sqlx-cli
        # sqlx-cli publishes no release binaries; make builds the pinned
        # version once and this cache keeps it until the pin moves.
        if: needs.changes.outputs.db_integration == 'true'
        id: sqlx-cli-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/tools/sqlx-cli-${{ env.SQLX_CLI_VERSION }}
          key: sqlx-cli-${{ runner.os }}-${{ runner.arch }}-${{ env.SQLX_CLI_VERSION }}
      - name: Query metadata
        # .sqlx/ against the statements and a database that holds exactly
        # the embedded migrations; offline builds trust it.
        if: needs.changes.outputs.db_integration == 'true'
        run: bash ./scripts/ci/measure.sh integration-query-metadata -- make sqlx-check
      - name: Save sqlx-cli
        if: >-
          needs.changes.outputs.db_integration == 'true' &&
          steps.sqlx-cli-cache.outputs.cache-hit != 'true' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/tools/sqlx-cli-${{ env.SQLX_CLI_VERSION }}
          key: ${{ steps.sqlx-cli-cache.outputs.cache-primary-key }}
      - name: Cache proof
        if: needs.changes.outputs.cache_integration == 'true'
        run: bash ./scripts/ci/measure.sh integration-cache -- env REQUIRE_DOCKER=1 make test-integration-cache
      - name: Object storage proof
        if: needs.changes.outputs.object_storage_integration == 'true'
        run: bash ./scripts/ci/measure.sh integration-object-storage -- env REQUIRE_DOCKER=1 make test-integration-object-storage
      - name: JetStream proof
        if: needs.changes.outputs.messaging_integration == 'true'
        run: bash ./scripts/ci/measure.sh integration-messaging -- env REQUIRE_DOCKER=1 make test-integration-messaging
      - name: Install Go for wire compatibility
        if: needs.changes.outputs.messaging_integration == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Generate actual Go wire records
        if: needs.changes.outputs.messaging_integration == 'true'
        run: bash ./scripts/messaging-go-compat.sh generate "${RUNNER_TEMP}/go-wire/records.json"
      - name: Export actual Rust wire records
        if: needs.changes.outputs.messaging_integration == 'true'
        env:
          GO_WIRE_FIXTURES: ${{ runner.temp }}/go-wire/records.json
          GO_WIRE_RUST_EXPORT: ${{ runner.temp }}/go-wire/rust-export.json
        run: cargo test --locked -p infra-messaging --test wire_compat -- --ignored --exact rust_production_wire_exports_for_go
      - name: Verify actual Go and Rust wire records
        if: needs.changes.outputs.messaging_integration == 'true'
        run: |
          set -euo pipefail
          bash ./scripts/messaging-go-compat.sh verify-rust "${RUNNER_TEMP}/go-wire/records.json" "${RUNNER_TEMP}/go-wire/rust-export.json"
          bash ./scripts/messaging-go-compat.sh check "${RUNNER_TEMP}/go-wire/records.json"
      - name: Compile every suite for the cache
        # The first save owns the cache key. A push that selected some of the
        # suites would keep the others cold until the lockfile changes, so the
        # run that saves compiles them all; a selected suite is already built.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        env:
          INTEGRATION_COMPOSE_MANAGED: "1"
          DATABASE_URL: compile-only
          PGBOUNCER_DATABASE_URL: compile-only
          NATS_URL: compile-only
          CACHE_URL: compile-only
          OBJECT_STORAGE_TEST_ENDPOINT: compile-only
        run: |
          set -euo pipefail
          for suite in db messaging cache object-storage; do
            if [[ -f scripts/ci/test-integration-${suite}.sh ]]; then
              bash "./scripts/ci/test-integration-${suite}.sh" --no-run
            fi
          done
          if [[ -f scripts/messaging-go-compat.sh ]]; then
            cargo test --locked -p infra-messaging --test wire_compat --no-run
          fi
      - name: Upload Go wire provenance
        if: always() && needs.changes.outputs.messaging_integration == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-wire-provenance
          path: ${{ runner.temp }}/go-wire/records.json
          if-no-files-found: error
  # template:end integration:ci-integration-job

  # template:begin source-template:ci-jobs-reliability-job
  jobs-reliability:
    # The source template's recovery and upgrade reference beside the
    # database suite: three release builds and fixed fault windows that used
    # to lengthen `integration` by about eighteen minutes. It owns its own
    # Compose project through `make jobs-reliability-reference`.
    needs: changes
    if: needs.changes.outputs.db_integration == 'true' && needs.changes.outputs.post_merge == 'true'
    name: jobs reliability reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: jobs-reliability-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The derived rehearsal adopts an exact older baseline.
          fetch-depth: 0
          # Bind its runtime/adoption receipt to the PR candidate itself.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        # The source candidate's release dependencies; the derived checkouts
        # build in their own targets outside the workspace.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          cache-bin: "false"
          shared-key: jobs-reliability
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Recovery and upgrade reference
        run: bash ./scripts/ci/measure.sh jobs-reliability -- make jobs-reliability-reference
      - name: Upload jobs reliability diagnosis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jobs-reliability-reference
          path: target/jobs-reliability-reference/
          if-no-files-found: ignore
  # template:end source-template:ci-jobs-reliability-job

  # template:begin outbound-auth:ci-oauth-integration-job
  oauth-integration:
    needs: [changes, secrets]
    if: >-
      !cancelled() && needs.changes.outputs.oauth_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Keycloak proof
        # No Cargo cache: one crate's test build, selected only when the
        # OAuth surface changes, is not worth a saved target of its own.
        run: >-
          bash ./scripts/ci/measure.sh integration-oauth --
          env REQUIRE_DOCKER=1
          make test-integration-oauth
  # template:end outbound-auth:ci-oauth-integration-job

  initializer:
    needs: changes
    if: needs.changes.outputs.initializer_runtime == 'true' && needs.changes.outputs.post_merge == 'true'
    name: initializer (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each part reports its own result; `required` reads the aggregate,
      # which is success only when every part passed. Four at a time keep
      # runners free for pull-request gates (see image-derived).
      fail-fast: false
      max-parallel: 4
      # With `initializer (projections)` the parts are `make
      # template-init-check`: the `source` part runs the source suites, every
      # other part a group of runtime graphs. scripts/ci/initializer-matrix.py owns the
      # grouping and keeps only the graphs the diff can affect; a push without
      # a readable base, a tag, a schedule, or a manual run selects them all.
      matrix: ${{ fromJSON(needs.changes.outputs.initializer_matrix || '{"include":[{"part":"source","cache":"source","save":true}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned toolchain
        uses: ./.github/actions/rust-toolchain # zizmor: ignore[self-repository]
        with:
          dependency-debug: "true"
      - name: Cargo caches
        # One cache per family of parts (scripts/ci/initializer-matrix.py):
        # every part restores it, and only the family's saving part writes it,
        # on a push to main that ran all of its graphs. image-derived restores
        # the same keys.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 # zizmor: ignore[cache-poisoning]
        with:
          shared-key: initializer-${{ matrix.cache }}
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.save }}
      - name: Fetch locked Cargo packages
        run: cargo fetch --locked
      - name: Load tool manifest
        run: grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
      - name: Install pinned Cargo tools
        # Every runtime graph runs the initialized service's `make unused-deps`.
        if: matrix.part != 'source'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-shear@${{ env.CARGO_SHEAR_VERSION }}
      - name: Source suites
        if: matrix.part == 'source'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: bash ./scripts/ci/measure.sh template-initializer-source -- bash ./scripts/ci/template-init-check.sh --source-checks
      - name: Runtime graphs
        if: matrix.part != 'source'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          PART: ${{ matrix.part }}
          GRAPHS: ${{ matrix.graphs }}
          # The runner has Docker; graphs with retained database suites fail
          # rather than refuse if it is ever missing.
          REQUIRE_DOCKER: "1"
        run: bash ./scripts/ci/measure.sh "template-initializer-${PART}" -- bash ./scripts/ci/template-init-check.sh --runtime-graphs "${GRAPHS}"

  initializer-projections:
    # The canonical projections need no Cargo, so they run beside the matrix
    # instead of inside its `source` part. A change to projected text alone
    # (documentation, instructions, harness carriers, workflow and image
    # metadata) runs only this job: the runtime matrix waits for a change that
    # can alter an initialized service's build or the initializer itself.
    needs: [changes, secrets]
    if: >-
      !cancelled() && needs.changes.outputs.module_initializer == 'true'
    name: initializer (projections)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Canonical projections
        run: bash ./scripts/ci/measure.sh template-initializer-projections -- make template-init-projections

  docs:
    needs: [changes, secrets]
    if: >-
      !cancelled() && needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links
        # Relative links and #fragments only (offline); no toolchain.
        run: bash ./scripts/ci/measure.sh docs-links -- make docs-check

  required:
    if: always()
    needs:
      - changes
      - quality
      - quality-profiles
      - quality-validation
      # template:begin postgres:ci-postgres-maintenance-rules-need
      - postgres-maintenance-rules
      # template:end postgres:ci-postgres-maintenance-rules-need
      # template:begin grpc:ci-required-grpc-need
      - grpc
      # template:end grpc:ci-required-grpc-need
      - security
      - secrets
      - delivery
      - image
      # template:begin runtime-progress:ci-required-runtime-progress-need
      - runtime-progress
    # template:end runtime-progress:ci-required-runtime-progress-need
    # template:begin messaging:ci-required-messaging-recovery-need
      - messaging-recovery
    # template:end messaging:ci-required-messaging-recovery-need
      # template:begin integration:ci-required-integration-need
      - integration
      # template:end integration:ci-required-integration-need
      # template:begin source-template:ci-required-jobs-reliability-need
      - jobs-reliability
      # template:end source-template:ci-required-jobs-reliability-need
      # template:begin outbound-auth:ci-required-oauth-integration-need
      - oauth-integration
      # template:end outbound-auth:ci-required-oauth-integration-need
      - initializer
      - initializer-projections
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed or cancelled gates
        # Classification must succeed before skipped jobs can be intentional.
        # Explicit always() also removes the step's implicit status guard.
        if: always() && (needs.changes.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
      # Mirror each job selector: only an unselected gate may be skipped.
      - name: Require selected quality success
        if: >-
          always() && (
            needs.changes.outputs.rust_source == 'true' ||
            needs.changes.outputs.cargo_dependencies == 'true' ||
            needs.changes.outputs.lint_config == 'true' ||
            needs.changes.outputs.openapi == 'true' ||
            needs.changes.outputs.migrations == 'true' ||
            needs.changes.outputs.agent_instructions == 'true' ||
            needs.changes.outputs.duplication == 'true' ||
            needs.changes.outputs.architecture == 'true'
          ) && needs.quality.result != 'success'
        run: exit 1
      - name: Require selected quality profiles success
        if: >-
          always() && (
            needs.changes.outputs.rust_source == 'true' ||
            needs.changes.outputs.cargo_dependencies == 'true'
          ) && needs.quality-profiles.result != 'success'
        run: exit 1
      - name: Require selected validation self-tests success
        if: >-
          always() && needs.changes.outputs.validation_system == 'true' &&
          needs.quality-validation.result != 'success'
        run: exit 1
      # template:begin runtime-progress:ci-required-runtime-progress-success
      - name: Require selected quota proof success
        if: >-
          always() && needs.changes.outputs.runtime_progress == 'true' &&
          needs.changes.outputs.post_merge == 'true' &&
          needs.runtime-progress.result != 'success'
        run: exit 1
      # template:end runtime-progress:ci-required-runtime-progress-success
      # template:begin grpc:ci-required-grpc-success
      - name: Require selected protobuf contract success
        if: >-
          always() && (
            needs.changes.outputs.grpc_schema == 'true'
          ) && needs.grpc.result != 'success'
        run: exit 1
      # template:end grpc:ci-required-grpc-success
      - name: Require selected security success
        if: >-
          always() && (
            needs.changes.outputs.cargo_dependencies == 'true' ||
            needs.changes.outputs.dependency_policy == 'true' ||
            needs.changes.outputs.github_workflows == 'true' ||
            (github.event_name == 'pull_request' && (
              needs.changes.outputs.tool_manifest == 'true' ||
              needs.changes.outputs.runtime_image == 'true'
            ))
          ) && needs.security.result != 'success'
        run: exit 1
      - name: Require selected secret scan success
        if: >-
          always() && (
            github.event_name != 'schedule' || needs.changes.outputs.secret_scanning == 'true'
          ) && needs.secrets.result != 'success'
        run: exit 1
      - name: Require selected delivery success
        if: >-
          always() && (
            needs.changes.outputs.shell == 'true' ||
            needs.changes.outputs.github_workflows == 'true' ||
            needs.changes.outputs.tool_manifest == 'true' ||
            needs.changes.outputs.runtime_image == 'true' ||
            needs.changes.outputs.publication_metadata == 'true'
          ) && needs.delivery.result != 'success'
        run: exit 1
      - name: Require selected image success
        if: >-
          always() && (
            (needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.artifact_graphs != '') && needs.changes.outputs.post_merge == 'true'
          ) && needs.image.result != 'success'
        run: exit 1
      # template:begin integration:ci-required-integration-success
      - name: Require selected integration success
        if: >-
          always() && (
            needs.changes.outputs.db_integration == 'true' ||
            needs.changes.outputs.messaging_integration == 'true' ||
            needs.changes.outputs.cache_integration == 'true' ||
            needs.changes.outputs.object_storage_integration == 'true'
          ) && needs.integration.result != 'success'
        run: exit 1
      # template:end integration:ci-required-integration-success
      # template:begin source-template:ci-required-jobs-reliability-success
      - name: Require selected jobs reliability reference success
        if: >-
          always() && (
            needs.changes.outputs.db_integration == 'true' && needs.changes.outputs.post_merge == 'true'
          ) && needs.jobs-reliability.result != 'success'
        run: exit 1
      # template:end source-template:ci-required-jobs-reliability-success
      # template:begin outbound-auth:ci-required-oauth-integration-success
      - name: Require selected OAuth integration success
        if: >-
          always() && (
            needs.changes.outputs.oauth_integration == 'true'
          ) && needs.oauth-integration.result != 'success'
        run: exit 1
      # template:end outbound-auth:ci-required-oauth-integration-success
      - name: Require selected initializer matrix success
        if: >-
          always() && (
            needs.changes.outputs.initializer_runtime == 'true' && needs.changes.outputs.post_merge == 'true'
          ) && needs.initializer.result != 'success'
        run: exit 1
      - name: Require selected initializer projections success
        if: >-
          always() && (
            needs.changes.outputs.module_initializer == 'true'
          ) && needs.initializer-projections.result != 'success'
        run: exit 1
      - name: Require selected documentation success
        if: >-
          always() && (
            needs.changes.outputs.documentation == 'true'
          ) && needs.docs.result != 'success'
        run: exit 1
      # template:begin postgres:ci-postgres-maintenance-rules-success
      - name: Require selected PostgreSQL rule proof success
        if: needs.changes.outputs.postgres_maintenance_rules == 'true' && needs.postgres-maintenance-rules.result != 'success'
        run: exit 1
      # template:end postgres:ci-postgres-maintenance-rules-success
      - name: Accept passed and intentionally skipped gates
        run: echo "all applicable CI gates passed"
