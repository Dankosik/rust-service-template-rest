name: prepare-utility-toolbox

# One-off branch authoring, removed before opening the PR. Existing CI is unchanged.
on:
  push:
    branches: [refactor/production-utility-toolbox]
    paths: [.github/workflows/prepare-utility-toolbox.yml]

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refactor/production-utility-toolbox
      - name: Apply the scoped migration
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/utility-before.lock
          python3 .github/utility-edit.py
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one correction anchor')
              p.write_text(text.replace(old, new))
          replace('test/tests/utility_async.rs',
                  '    let peak = AtomicUsize::new(0);\n',
                  '    let peak = AtomicUsize::new(0);\n    let active = &active;\n    let peak = &peak;\n')
          replace('test/tests/utility_async.rs', '.map(|id| async {', '.map(|id| async move {')
          replace('test/tests/utility_async.rs', '    tracker.spawn(async move {', '    let task = tracker.spawn(async move {')
          replace('test/tests/utility_async.rs',
                  '    assert!(!parent.is_cancelled());',
                  '    task.await.unwrap();\n    assert!(!parent.is_cancelled());')
          replace('test/tests/utility_text_io.rs',
                  'fn_normalization_and_graphemes_have_explicit_meanings() {',
                  'fn normalization_and_graphemes_have_explicit_meanings() {')
          replace('test/tests/utility_text_io.rs',
                  '    assert_eq!(path.as_str(), "exports/report.csv");',
                  '    assert_eq!(path.parent(), Some(camino::Utf8Path::new("exports")));')
          replace('test/Cargo.toml', ', "with-rejection"', '')
          replace('test/tests/utility_data.rs',
                  'fn validate_name(input: &NameRequest) -> Result<(), Problem> {',
                  'fn validate_name(input: &NameRequest) -> Result<(), Box<Problem>> {')
          replace('test/tests/utility_data.rs',
                  '        Problem::new(Code::UnprocessableContent)\n            .invalid_param("/name", "length must be between 1 and 4 characters")',
                  '        Box::new(Problem::new(Code::UnprocessableContent)\n            .invalid_param("/name", "length must be between 1 and 4 characters"))')
          PY
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Resolve the intentional dependency change and inspect its graph
        shell: bash
        run: |
          set -euo pipefail
          # Authoring only: allow Cargo to incorporate the selected libraries.
          # Validation below and normal CI remain locked. No blanket update.
          cargo metadata --format-version 1 >/tmp/utility-metadata.json
          cargo tree --locked --duplicates
          cargo tree --locked -p service -e normal,build >/tmp/utility-production-tree.txt
          cat /tmp/utility-production-tree.txt
          for package in async-trait serde_with derive_more axum-extra; do
            cargo tree --locked -e features -i "${package}"
          done
          python3 - <<'PY'
          import json, tomllib
          from pathlib import Path
          before = tomllib.loads(Path('/tmp/utility-before.lock').read_text())['package']
          after = tomllib.loads(Path('Cargo.lock').read_text())['package']
          key = lambda p: (p['name'], p['version'], p.get('source', 'workspace'))
          old, new = {key(p) for p in before}, {key(p) for p in after}
          manifest = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['dependencies']
          metadata = json.loads(Path('/tmp/utility-metadata.json').read_text())
          selected = {'async-trait', 'serde_with', 'derive_more', 'itertools', 'axum-extra', 'indexmap', 'heck', 'bstr', 'regex', 'unicode-normalization', 'unicode-segmentation', 'strsim', 'fs-err', 'walkdir', 'camino', 'csv', 'base64', 'ipnet', 'semver', 'bytes', 'json-patch', 'uuid', 'rust_decimal', 'time', 'bon', 'validator', 'insta', 'proptest', 'backon', 'moka', 'wiremock', 'reqwest'}
          lines = ['# Cargo resolution observations', '', 'Generated by Cargo metadata on the repository-pinned Rust toolchain, 2026-09-19.', '', f'Lockfile package identities added: **{len(new-old)}**. Removed: **{len(old-new)}**.', 'Package counts are not a binary-size or compile-time measurement.', '', '| Library | Declared requirement | Resolved version | License | Declared minimum Rust |', '| --- | --- | --- | --- | --- |']
          for p in sorted(metadata['packages'], key=lambda p: (p['name'], p['version'])):
              if p['name'] in selected:
                  lines.append(f"| `{p['name']}` | `{manifest[p['name']]['version']}` | `{p['version']}` | {p.get('license') or 'not declared'} | {p.get('rust_version') or 'not declared'} |")
          lines += ['', '## Lockfile identity changes', '', 'Added:', '']
          lines.extend(f'- `{name} {version}`' for name, version, _ in sorted(new-old))
          lines += ['', 'Removed:', '']
          lines.extend(f'- `{name} {version}`' for name, version, _ in sorted(old-new))
          if not old-new:
              lines.append('None.')
          lines += ['', 'Duplicate/feature edges and the service normal/build dependency graph are in the', 'authoring-run log. Dev-only recipes are not service runtime integrations.', 'Normal PR CI remains the build/test, license, advisory and policy authority.', '']
          p = Path('specs/production-utility-toolbox/research/resolution.md')
          p.write_text('\n'.join(lines))
          print(p.read_text())
          PY
      - name: Format and constrain the resulting diff
        shell: bash
        run: |
          set -euo pipefail
          make fmt
          git diff --check
          git diff --stat
          git grep -n 'impl Probe for' -- '*.rs'
          python3 - <<'PY'
          import subprocess
          allowed = {'Cargo.toml', 'Cargo.lock', 'crates/health/Cargo.toml', 'crates/health/src/lib.rs', 'crates/infra-postgres/Cargo.toml', 'crates/infra-postgres/src/probe.rs', 'crates/infra-postgres/src/dsn.rs', 'crates/infra-http/Cargo.toml', 'crates/infra-http/src/problem.rs', 'crates/infra-http/src/router.rs', 'crates/infra-http/src/harden.rs', 'crates/infra-telemetry/Cargo.toml', 'crates/infra-telemetry/src/metrics.rs', 'crates/infra-telemetry/src/tracing.rs', 'test/Cargo.toml', 'docs/backend-library-selection.md', 'specs/production-utility-toolbox/research/resolution.md'}
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          for path in changed:
              if path not in allowed and not path.startswith('test/tests/utility_'):
                  raise SystemExit(f'Unexpected edit: {path}')
          PY
      - name: Commit only source, manifests and the generated resolution report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add Cargo.toml Cargo.lock crates/health crates/infra-postgres crates/infra-http crates/infra-telemetry test/Cargo.toml test/tests/utility_*.rs docs/backend-library-selection.md specs/production-utility-toolbox/research/resolution.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: apply production utility migrations and resolve tested toolkit'
          gh auth setup-git
          git push origin HEAD:refs/heads/refactor/production-utility-toolbox
