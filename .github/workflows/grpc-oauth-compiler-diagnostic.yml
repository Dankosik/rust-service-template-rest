name: grpc-oauth-compiler-diagnostic

on:
  push:
    branches: [codex/stage-10-7-grpc-send-diagnostic]
    paths:
      - .github/workflows/grpc-oauth-compiler-diagnostic.yml
      - scripts/ci/oauth-send-diagnostic.py

permissions:
  contents: read

concurrency:
  group: grpc-oauth-compiler-diagnostic
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  compile-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore existing cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-
      - name: Provision declared compiler
        run: make grpc-tools
      - name: Compile bounded OAuth variants
        run: python3 scripts/ci/oauth-send-diagnostic.py oauth-send-diagnostic
      - name: Preserve exact variant evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oauth-send-diagnostic-${{ github.sha }}
          path: oauth-send-diagnostic/
          if-no-files-found: error
          retention-days: 1
