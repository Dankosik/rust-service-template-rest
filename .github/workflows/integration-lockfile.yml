name: integration lockfile

# Temporary source-generation helper, removed before the final PR candidate.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  resolve:
    if: github.head_ref == 'codex/integrate-hotpath-20261005' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Resolve the deliberate workspace lock change
        run: |
          set -euo pipefail
          rustup toolchain install
          python3 specs/hotpath-remaining-optimizations/scripts/check-vendor.py
          cargo update --workspace
          mkdir -p "${RUNNER_TEMP}/integration-lock"
          cp Cargo.lock "${RUNNER_TEMP}/integration-lock/Cargo.lock"
          cargo metadata --locked --format-version 1 > "${RUNNER_TEMP}/integration-lock/metadata.json"
          cargo tree --locked --duplicates > "${RUNNER_TEMP}/integration-lock/duplicates.txt"
          cargo metadata --locked --format-version 1 --features service/hotpath,service/hotpath-alloc,service/hotpath-mcp,service/hotpath-cpu > "${RUNNER_TEMP}/integration-lock/profile-metadata.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/integration-lock
          if-no-files-found: error
