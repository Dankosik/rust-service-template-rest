name: cd

# workflow_run admits only this repository's successful default-branch push
# at github.sha. Release tag creation is restricted by the repository ruleset.

on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  admission:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' && (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_sha == github.sha
        ) || (
          github.event_name == 'push' &&
          github.event.created && !github.event.deleted && !github.event.forced &&
          startsWith(github.ref, 'refs/tags/v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for exact-SHA admission workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          refs=("${DEFAULT_BRANCH}")
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            main_sha=$(gh api "repos/${GH_REPO}/branches/${DEFAULT_BRANCH}" --jq .commit.sha)
            merge_base=$(gh api "repos/${GH_REPO}/compare/${CANDIDATE_SHA}...${main_sha}?per_page=1" --jq .merge_base_commit.sha)
            [[ "${merge_base}" == "${CANDIDATE_SHA}" ]] || {
              echo "Release commit ${CANDIDATE_SHA} is outside ${DEFAULT_BRANCH}." >&2
              exit 1
            }
            refs+=("${GITHUB_REF_NAME}")
          fi
          for ref in "${refs[@]}"; do
            for workflow in ci.yml codeql.yml; do
              endpoint="repos/${GH_REPO}/actions/workflows/${workflow}/runs"
              for attempt in {1..12}; do
                id=$(gh api --method GET "${endpoint}" -f event=push -f branch="${ref}" \
                  -f head_sha="${CANDIDATE_SHA}" -F per_page=1 --jq '.workflow_runs[0].id // empty')
                [[ -z "${id}" ]] || break
                if (( attempt == 12 )); then
                  echo "Missing ${workflow} push run for ${ref}@${CANDIDATE_SHA}." >&2
                  exit 1
                fi
                sleep 10
              done
              echo "Waiting for ${workflow} push run ${id} at ${ref}@${CANDIDATE_SHA}."
              while true; do
                conclusion=$(gh api "repos/${GH_REPO}/actions/runs/${id}" --jq '.conclusion // "pending"')
                case "${conclusion}" in
                  success) break ;;
                  pending) sleep 30 ;;
                  *) echo "Run ${id} concluded ${conclusion}." >&2; exit 1 ;;
                esac
              done
            done
          done
  publish:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # The checkout above is at the exact candidate SHA, so the
      # workspace-relative form loads the action version CI validated.
      # GitHub's self-repository form (`$/…`) is not parsed by actionlint
      # 1.7.12, the latest release; switch when it is.
      - uses: ./.github/actions/publish-image # zizmor: ignore[self-repository]
        with:
          mode: ${{ github.event_name == 'workflow_run' && 'main' || 'release' }}
          candidate_sha: ${{ github.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
