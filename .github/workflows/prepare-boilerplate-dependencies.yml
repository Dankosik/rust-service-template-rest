name: prepare-boilerplate-dependencies

# Temporary authoring workspace, removed before opening the PR.
# The permanent CI workflow and its validation gates are unchanged.
on:
  push:
    branches: [refactor/backend-boilerplate-libraries]
    paths: [.github/workflows/prepare-boilerplate-dependencies.yml]

permissions:
  contents: write

jobs:
  apply-and-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refactor/backend-boilerplate-libraries
      - name: Apply the scoped source and documentation edits
        run: python3 .github/boilerplate-edit.py
      - name: Install the repository toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - name: Format and inspect the exact diff
        shell: bash
        run: |
          set -euo pipefail
          make fmt
          git diff --check
          git diff --exit-code -- Cargo.lock
          python3 - <<'PY'
          import subprocess
          allowed = {
              'crates/infra-http/src/problem.rs',
              'crates/infra-http/src/harden.rs',
              'crates/config/src/validate.rs',
              'crates/service/tests/openapi.rs',
              'CONTRIBUTING.md',
              'docs/first-production-feature.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected changed paths: {changed ^ allowed}')
          PY
          git diff --stat
          git diff
      - name: Commit the formatted source and documentation only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add crates/infra-http/src/problem.rs crates/infra-http/src/harden.rs crates/config/src/validate.rs crates/service/tests/openapi.rs CONTRIBUTING.md docs/first-production-feature.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: replace enum and test boilerplate with selected libraries'
          gh auth setup-git
          git push origin HEAD:refs/heads/refactor/backend-boilerplate-libraries
