name: grpc-codegen-bootstrap

on:
  push:
    branches: [codex/stage-10-7-grpc]
    paths:
      - .github/workflows/grpc-codegen-bootstrap.yml
      - tools/grpc-codegen/**
      - tools/versions.env
      - api/proto/**
      - buf.yaml
      - buf.lock
      - scripts/grpc-generate.sh

permissions:
  contents: read

concurrency:
  group: grpc-codegen-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/grpc-codegen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Generate committed contracts
        run: |
          set -euo pipefail
          bash scripts/grpc-generate.sh buf dep update
          bash scripts/grpc-generate.sh .ci/grpc-generated
          cp buf.lock .ci/grpc-generated/buf.lock
      - name: Upload exact generated bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grpc-generated-${{ github.sha }}
          path: .ci/grpc-generated
          if-no-files-found: error
          retention-days: 1
