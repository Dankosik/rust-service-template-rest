name: dependency-drift

# Weekly drift that Dependabot does not cover: vendored [patch.crates-io] forks,
# `mise.toml` tool/env pins, and Dockerfile static-archive ARG pins. The report
# (`python3 -m scripts.checks.vendor drift --upstream`) updates the single open
# `dependency-drift` issue and closes it when clean.

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-drift-${{ github.repository }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: "2026.11.10"
          install: false
          cache: false
      - name: Report vendored fork and tool pin drift
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          report=$(python3 -m scripts.checks.vendor drift --upstream) || status=$?
          if ((status > 1)) || [[ -z ${report} ]]; then
            printf 'dependency-drift: weekly poll did not produce a complete report (status %s)\n' "${status}" >&2
            exit 2
          fi
          printf '%s\n' "${report}"
          issue=$(gh issue list --label dependency-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if ((status == 0)); then
            [[ -z ${issue} ]] || gh issue close "${issue}" --comment "No dependency drift at ${GITHUB_SHA}."
            exit 0
          fi
          body=$(printf 'Weekly drift report at %s ([run](%s/%s/actions/runs/%s)):\n\n%s\n\nThe update procedure: docs/ci-cd-production-ready.md#vendored-forks.\n' \
            "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" "${GH_REPO}" "${GITHUB_RUN_ID}" "${report}")
          gh label create dependency-drift --color FBCA04 --description "A vendored fork or tool pin is behind upstream" --force >/dev/null
          if [[ -z ${issue} ]]; then
            gh issue create --label dependency-drift --title "Dependency drift" --body "${body}"
          else
            gh issue edit "${issue}" --body "${body}"
          fi
