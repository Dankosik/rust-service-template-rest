name: grpc-runtime-diagnostic

on:
  push:
    branches: [codex/stage-10-7-grpc-runtime-diagnostic]

permissions:
  contents: read

concurrency:
  group: grpc-runtime-diagnostic
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: short

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Restore existing cargo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-${{ env.CARGO_PROFILE_DEV_DEBUG }}-
      - name: Provision declared compiler
        run: make grpc-tools
      - name: Existing transport proof
        id: transport
        continue-on-error: true
        run: timeout 300s cargo test --locked -p infra-grpc --all-features --test transport --no-fail-fast 2>&1 | tee transport.log
      - name: Existing OAuth proof
        id: oauth
        continue-on-error: true
        run: timeout 300s cargo test --locked -p infra-oauth2-client-credentials --all-features --lib --no-fail-fast 2>&1 | tee oauth.log
      - name: Existing process proof
        id: process
        continue-on-error: true
        run: timeout 300s cargo test --locked -p service --test grpc_process --no-fail-fast 2>&1 | tee process.log
      - name: Require every suite to pass
        if: always() && (steps.transport.outcome != 'success' || steps.oauth.outcome != 'success' || steps.process.outcome != 'success')
        run: exit 1
      - name: Preserve exact runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grpc-runtime-diagnostic-${{ github.sha }}
          path: |
            transport.log
            oauth.log
            process.log
          if-no-files-found: error
          retention-days: 1
