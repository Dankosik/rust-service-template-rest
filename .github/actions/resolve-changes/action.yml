name: Resolve changed surfaces
description: >-
  Resolve the comparison base (including the last green commit on main pushes),
  classify changed surfaces via scripts/verify/surfaces.py, and optionally plan
  source-template initializer matrices.

inputs:
  github_token:
    description: GITHUB_TOKEN used to resolve the green branch on main pushes.
    required: false
    default: ${{ github.token }}
  plan_initializer:
    description: Plan source-template initializer and artifact matrices when selected.
    required: false
    default: "false"

outputs:
  rust_source:
    description: Rust source or runtime configuration changed.
    value: ${{ steps.surfaces.outputs.rust_source }}
  cargo_dependencies:
    description: Cargo manifests, lockfiles, or toolchain changed.
    value: ${{ steps.surfaces.outputs.cargo_dependencies }}
  dependency_policy:
    description: Dependency policy or vendored drift rules changed.
    value: ${{ steps.surfaces.outputs.dependency_policy }}
  lint_config:
    description: Rustfmt or Clippy configuration changed.
    value: ${{ steps.surfaces.outputs.lint_config }}
  openapi:
    description: OpenAPI contract or generator changed.
    value: ${{ steps.surfaces.outputs.openapi }}
  # template:begin grpc:resolve-changes-grpc-output
  grpc_schema:
    description: Protobuf schemas, generated contracts, or codegen changed.
    value: ${{ steps.surfaces.outputs.grpc_schema }}
  # template:end grpc:resolve-changes-grpc-output
  tool_manifest:
    description: Pinned tool manifest or image pins changed.
    value: ${{ steps.surfaces.outputs.tool_manifest }}
  github_workflows:
    description: GitHub Actions workflows, actions, or CodeQL config changed.
    value: ${{ steps.surfaces.outputs.github_workflows }}
  dependency_automation:
    description: Dependabot configuration changed.
    value: ${{ steps.surfaces.outputs.dependency_automation }}
  shell:
    description: Shell scripts changed.
    value: ${{ steps.surfaces.outputs.shell }}
  python:
    description: Python scripts or ruff configuration changed.
    value: ${{ steps.surfaces.outputs.python }}
  runtime_image:
    description: Runtime image inputs or scripts changed.
    value: ${{ steps.surfaces.outputs.runtime_image }}
  # template:begin runtime-progress:resolve-changes-runtime-progress-output
  runtime_progress:
    description: Runtime CPU-quota progress proof inputs changed.
    value: ${{ steps.surfaces.outputs.runtime_progress }}
  # template:end runtime-progress:resolve-changes-runtime-progress-output
  publication_metadata:
    description: Image publication action or metadata script changed.
    value: ${{ steps.surfaces.outputs.publication_metadata }}
  secret_scanning:
    description: Gitleaks configuration or ignore rules changed.
    value: ${{ steps.surfaces.outputs.secret_scanning }}
  monitoring_rules:
    description: Prometheus alerting/recording rules or fixtures changed.
    value: ${{ steps.surfaces.outputs.monitoring_rules }}
  db_integration:
    description: PostgreSQL integration inputs changed.
    value: ${{ steps.surfaces.outputs.db_integration }}
  messaging_integration:
    description: JetStream integration inputs changed.
    value: ${{ steps.surfaces.outputs.messaging_integration }}
  cache_integration:
    description: Cache integration inputs changed.
    value: ${{ steps.surfaces.outputs.cache_integration }}
  object_storage_integration:
    description: Object storage integration inputs changed.
    value: ${{ steps.surfaces.outputs.object_storage_integration }}
  oauth_integration:
    description: OAuth2 client-credentials integration inputs changed.
    value: ${{ steps.surfaces.outputs.oauth_integration }}
  migrations:
    description: SQL migrations or migration rehearsal inputs changed.
    value: ${{ steps.surfaces.outputs.migrations }}
  agent_instructions:
    description: Agent instructions, skills, roles, or harness carriers changed.
    value: ${{ steps.surfaces.outputs.agent_instructions }}
  documentation:
    description: Markdown documentation or image-input watch rules changed.
    value: ${{ steps.surfaces.outputs.documentation }}
  validation_system:
    description: Validation router, lock, or checker scripts changed.
    value: ${{ steps.surfaces.outputs.validation_system }}
  template_engine:
    description: Template initialization or sync engine changed.
    value: ${{ steps.surfaces.outputs.template_engine }}
  module_initializer:
    description: Source-template projections changed.
    value: ${{ steps.surfaces.outputs.module_initializer }}
  initializer_runtime:
    description: Source-template runtime graph inputs changed.
    value: ${{ steps.surfaces.outputs.initializer_runtime }}
  initializer_artifacts:
    description: Source-template release artifact graph inputs changed.
    value: ${{ steps.surfaces.outputs.initializer_artifacts }}
  initializer_matrix:
    description: Planned initializer matrix JSON.
    value: ${{ steps.surfaces.outputs.initializer_matrix }}
  artifact_graphs:
    description: Selected release artifact graph IDs.
    value: ${{ steps.surfaces.outputs.artifact_graphs }}
  artifact_matrix:
    description: Planned release artifact matrix JSON.
    value: ${{ steps.surfaces.outputs.artifact_matrix }}
  duplication:
    description: Rust clone-detection inputs changed.
    value: ${{ steps.surfaces.outputs.duplication }}
  architecture:
    description: Workspace dependency-direction inputs changed.
    value: ${{ steps.surfaces.outputs.architecture }}
  quality_tooling:
    description: Readability checker configuration, scripts, or fixtures changed.
    value: ${{ steps.surfaces.outputs.quality_tooling }}
  rust_analysis:
    description: CodeQL Rust analysis inputs changed.
    value: ${{ steps.surfaces.outputs.rust_analysis }}
  base_sha:
    description: Resolved comparison base commit SHA (empty when classifying all surfaces).
    value: ${{ steps.surfaces.outputs.base_sha }}
  post_merge:
    description: True for post-merge, tag, schedule, and dispatch runs.
    value: ${{ steps.surfaces.outputs.post_merge }}

runs:
  using: composite
  steps:
    - name: Resolve the last green base
      # A green ancestor covers the merges whose own runs were replaced
      # while pending; without one the previous push is the base.
      id: green
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        base=${BEFORE_SHA}
        # A missing branch prints the error body, not a commit.
        green=$(gh api "repos/${GITHUB_REPOSITORY}/branches/green" --jq .commit.sha 2>/dev/null || true)
        if [[ ${green} =~ ^[0-9a-f]{40}$ && $(gh api "repos/${GITHUB_REPOSITORY}/compare/${green}...${GITHUB_SHA}" --jq .status) == ahead ]]; then
          base=${green}
        fi
        echo "sha=${base}" >>"${GITHUB_OUTPUT}"

    - name: Classify changed surfaces
      id: surfaces
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        PLAN_INITIALIZER: ${{ inputs.plan_initializer }}
      # Tags, schedules, manual runs, and a push without a readable base
      # select every surface; a diff event is classified by both the base
      # and the head classifier. A selected initializer plans the runtime
      # graphs the same diff can affect (scripts/template/matrix.py).
      run: |
        set -euo pipefail
        paths=${RUNNER_TEMP}/changed-paths
        surfaces=${RUNNER_TEMP}/surfaces
        post_merge=true
        if [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == merge_group ]]; then
          post_merge=false
        fi
        post_merge_args=()
        if [[ "${post_merge}" == true ]]; then
          post_merge_args=(--post-merge)
        fi
        analysis_config=false
        if [[ "${EVENT_NAME}" == schedule || "${EVENT_NAME}" == workflow_dispatch || "${GITHUB_REF}" == refs/tags/* || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
          resolved_base_sha=
          python3 ./scripts/verify/surfaces.py --all "${post_merge_args[@]}" >"${surfaces}"
          plan=(--all)
          : >"${paths}"
        else
          resolved_base_sha=${BASE_SHA}
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          python3 ./scripts/verify/changed_paths.py --base "${BASE_SHA}" >"${paths}"
          mapfile -t changed_files <"${paths}"
          python3 ./scripts/verify/surfaces.py --union "${BASE_SHA}" "${post_merge_args[@]}" --files ${changed_files[@]+"${changed_files[@]}"} >"${surfaces}"
          plan=(--union "${BASE_SHA}" --files ${changed_files[@]+"${changed_files[@]}"})
          if grep -Eq '^(\.github/workflows/codeql\.yml|\.github/codeql/rust\.yml|\.github/actions/resolve-changes/action\.yml)$' "${paths}"; then
            analysis_config=true
          fi
        fi
        {
          printf 'base_sha=%s\n' "${resolved_base_sha}"
          printf 'post_merge=%s\n' "${post_merge}"
          cat "${surfaces}"
          if [[ "${analysis_config}" == true ]] || grep -Eq '^(rust_source|cargo_dependencies)=true$' "${surfaces}"; then
            echo "rust_analysis=true"
          else
            echo "rust_analysis=false"
          fi
        } | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
        if [[ "${PLAN_INITIALIZER}" == true && -f scripts/template/matrix.py ]] && grep -Eq '^initializer_(runtime|artifacts)=true$' "${surfaces}"; then
          python3 ./scripts/template/matrix.py "${plan[@]}" | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
        fi
