name: Detect changed surfaces
description: Resolve comparison base (including green branch on main pushes) and classify changed surfaces.

inputs:
  github_token:
    description: GITHUB_TOKEN used to resolve the green branch on main pushes.
    required: false
    default: ${{ github.token }}
  main_coalesce_seconds:
    description: Seconds to wait on main push runs so back-to-back merges coalesce before allocating heavy runners.
    required: false
    default: "60"

outputs:
  rust:
    value: ${{ steps.classify.outputs.rust }}
  deps:
    value: ${{ steps.classify.outputs.deps }}
  profiling:
    value: ${{ steps.classify.outputs.profiling }}
  vendor_transport:
    value: ${{ steps.classify.outputs.vendor_transport }}
  openapi:
    value: ${{ steps.classify.outputs.openapi }}
  grpc:
    value: ${{ steps.classify.outputs.grpc }}
  migrations:
    value: ${{ steps.classify.outputs.migrations }}
  integration:
    value: ${{ steps.classify.outputs.integration }}
  integration_db:
    value: ${{ steps.classify.outputs.integration_db }}
  sqlx_check:
    value: ${{ steps.classify.outputs.sqlx_check }}
  integration_cache:
    value: ${{ steps.classify.outputs.integration_cache }}
  integration_object_storage:
    value: ${{ steps.classify.outputs.integration_object_storage }}
  integration_messaging:
    value: ${{ steps.classify.outputs.integration_messaging }}
  integration_clickhouse:
    value: ${{ steps.classify.outputs.integration_clickhouse }}
  integration_temporal:
    value: ${{ steps.classify.outputs.integration_temporal }}
  oauth:
    value: ${{ steps.classify.outputs.oauth }}
  docker:
    value: ${{ steps.classify.outputs.docker }}
  runtime_progress:
    value: ${{ steps.classify.outputs.runtime_progress }}
  repo_lint:
    value: ${{ steps.classify.outputs.repo_lint }}
  template:
    value: ${{ steps.classify.outputs.template }}
  codeql_actions:
    value: ${{ steps.classify.outputs.codeql_actions }}
  codeql_rust:
    value: ${{ steps.classify.outputs.codeql_rust }}
  base_sha:
    value: ${{ steps.classify.outputs.base_sha }}
  post_merge:
    value: ${{ steps.classify.outputs.post_merge }}

runs:
  using: composite
  steps:
    - name: Coalesce rapid pushes to main
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        DELAY: ${{ inputs.main_coalesce_seconds }}
      run: |
        set -euo pipefail
        if [[ "${DELAY}" =~ ^[1-9][0-9]*$ ]]; then
          echo "Waiting ${DELAY}s so back-to-back merges to main coalesce before allocating heavy runners"
          sleep "${DELAY}"
        fi

    - name: Resolve last green base
      id: green
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail
        base=${BEFORE_SHA}
        green=$(gh api "repos/${GITHUB_REPOSITORY}/branches/green" --jq .commit.sha 2>/dev/null || true)
        if [[ ${green} =~ ^[0-9a-f]{40}$ && $(gh api "repos/${GITHUB_REPOSITORY}/compare/${green}...${GITHUB_SHA}" --jq .status) == ahead ]]; then
          base=${green}
        fi
        echo "sha=${base}" >>"${GITHUB_OUTPUT}"

    - name: Classify changed surfaces
      id: classify
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ steps.green.outputs.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      run: |
        set -euo pipefail
        post_merge=true
        if [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == merge_group ]]; then
          post_merge=false
        fi
        if [[ "${EVENT_NAME}" == schedule || "${EVENT_NAME}" == workflow_dispatch || "${GITHUB_REF}" == refs/tags/* || -z "${BASE_SHA}" || "${BASE_SHA}" == 0000000000000000000000000000000000000000 ]]; then
          resolved_base=""
          out=$(python3 .github/actions/detect-changes/detect.py --all)
        else
          resolved_base=${BASE_SHA}
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          out=$(python3 .github/actions/detect-changes/detect.py --base "${BASE_SHA}")
        fi
        {
          printf 'base_sha=%s\n' "${resolved_base}"
          printf 'post_merge=%s\n' "${post_merge}"
          printf '%s\n' "${out}"
        } | tee -a "${GITHUB_OUTPUT}" >>"${GITHUB_STEP_SUMMARY}"
