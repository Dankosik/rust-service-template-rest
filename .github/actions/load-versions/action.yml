name: Load tool versions
description: >-
  Export the pinned tool versions and image digests from tools/versions.env into
  the job's GITHUB_ENV.

runs:
  using: composite
  steps:
    - name: Load tool manifest
      shell: bash
      run: |
        set -euo pipefail
        grep -v '^#' tools/versions.env | grep . >>"${GITHUB_ENV}"
