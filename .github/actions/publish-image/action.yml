name: Publish runtime image
description: Build, smoke-check, scan, SBOM, push, sign, attest, verify, and promote runtime image tags.

inputs:
  mode:
    description: '"main" promotes sha-<12> + main; "release" promotes v* + latest.'
    required: true
  candidate_sha:
    description: Exact commit SHA being published.
    required: true
  github_token:
    description: GITHUB_TOKEN for GHCR login and gh attestation queries.
    required: true
  trivy_db_repository:
    description: Vulnerability database source for Trivy.
    required: false
    default: ghcr.io/aquasecurity/trivy-db:2

runs:
  using: composite
  steps:
    - name: Set up pinned tools (mise)
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        version: "2026.11.10"
        install_args: just cosign
        cache: false

    - name: Prepare image metadata
      id: meta
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
        python3 .github/actions/publish-image/publish.py prepare

    - name: Login to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.github_token }}
        GHCR_USER: ${{ github.actor }}
      run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

    - name: Set up Buildx
      id: buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v${{ env.BUILDX_VERSION }}
        cache-binary: false
        driver-opts: image=${{ env.BUILDKIT_IMAGE }}
        use: false
        cleanup: false

    - name: Build image
      id: build
      shell: bash
      env:
        APP_VERSION: ${{ steps.meta.outputs.version }}
        VCS_REF: ${{ inputs.candidate_sha }}
        SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        PRIMARY_IMAGE: ${{ steps.meta.outputs.primary_image }}
        RUNTIME_IMAGE_CACHE_FROM: type=registry,ref=${{ steps.meta.outputs.image_repo }}:buildcache
        RUNTIME_IMAGE_CACHE_TO: type=registry,ref=${{ steps.meta.outputs.image_repo }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
        VALIDATION_BUILDER_NAME: ${{ steps.buildx.outputs.name }}
      run: |
        set -euo pipefail
        metadata_dir=$(mktemp -d "${RUNNER_TEMP}/runtime-export.XXXXXXXX")
        trap 'rm -rf -- "${metadata_dir}"' EXIT
        export RUNTIME_IMAGE_METADATA_FILE="${metadata_dir}/metadata.json"
        just image-build "${PRIMARY_IMAGE}"
        python3 .github/actions/publish-image/publish.py identify

    - name: Smoke-test runtime image
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.image_id }}
        CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      run: just image-check "${IMAGE_ID}" "${CANDIDATE_SHA}"

    - name: Scan image with Trivy
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.image_id }}
        TRIVY_DB_REPOSITORY: ${{ inputs.trivy_db_repository }}
      run: just image-scan "${IMAGE_ID}"

    - name: Generate SBOM (CycloneDX)
      shell: bash
      env:
        IMAGE_ID: ${{ steps.build.outputs.image_id }}
        TRIVY_DB_REPOSITORY: ${{ inputs.trivy_db_repository }}
      run: just image-sbom "${IMAGE_ID}" sbom.cdx.json

    - name: Push candidate and confirm registry identity
      id: digest
      shell: bash
      env:
        PRIMARY_IMAGE: ${{ steps.meta.outputs.primary_image }}
        IMAGE_ID: ${{ steps.build.outputs.image_id }}
        ID_KIND: ${{ steps.build.outputs.id_kind }}
      run: python3 .github/actions/publish-image/publish.py push

    - name: Sign container image (keyless)
      shell: bash
      env:
        COSIGN_YES: "true"
        IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
        DIGEST: ${{ steps.digest.outputs.digest }}
      run: cosign sign "${IMAGE_REPO}@${DIGEST}"

    - name: Attest build provenance
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.meta.outputs.image_repo }}
        subject-digest: ${{ steps.digest.outputs.digest }}
        push-to-registry: true
        create-storage-record: false

    - name: Attest SBOM
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ steps.meta.outputs.image_repo }}
        subject-digest: ${{ steps.digest.outputs.digest }}
        sbom-path: sbom.cdx.json
        push-to-registry: true
        create-storage-record: false

    - name: Verify release trust
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
        DIGEST: ${{ steps.digest.outputs.digest }}
        IDENTITY: ${{ steps.meta.outputs.identity }}
        CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      run: |
        set -euo pipefail
        image="${IMAGE_REPO}@${DIGEST}"
        cosign verify \
          --certificate-identity "${IDENTITY}" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "${image}"
        policy=(
          --repo "${GITHUB_REPOSITORY}"
          --bundle-from-oci
          --cert-identity "${IDENTITY}"
          --source-ref "${GITHUB_REF}"
          --source-digest "${CANDIDATE_SHA}"
        )
        gh attestation verify "oci://${image}" "${policy[@]}" --predicate-type "https://slsa.dev/provenance/v1"
        gh attestation verify "oci://${image}" "${policy[@]}" --predicate-type "https://cyclonedx.org/bom" --format json |
          jq -e --slurpfile sbom sbom.cdx.json 'any(.[]; .verificationResult.statement.predicate == $sbom[0])'

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.meta.outputs.artifact_name }}
        path: sbom.cdx.json
        if-no-files-found: error

    - name: Promote verified tags
      shell: bash
      env:
        IMAGE_REPO: ${{ steps.meta.outputs.image_repo }}
        IMAGE_ID: ${{ steps.build.outputs.image_id }}
        DIGEST: ${{ steps.digest.outputs.digest }}
        PROMOTE_TAGS: ${{ steps.meta.outputs.promote_tags }}
      run: python3 .github/actions/publish-image/publish.py promote
