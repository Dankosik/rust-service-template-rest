version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      # template:begin grpc:dependabot-grpc-generator
      # The standalone generator workspace; one grouped PR keeps its prost
      # and tonic pins with the runtime's.
      - "/tools/grpc-codegen"
      # template:end grpc:dependabot-grpc-generator
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      # sqlx 0.9 reaches parking_lot 0.12 through futures-intrusive, and
      # cargo-deny bans the duplicate a 0.13 bump creates. Drop this once
      # sqlx resolves parking_lot 0.13.
      - dependency-name: "parking_lot"
        versions: [">=0.13"]
      # The runtime tonic is a patched vendor copy (vendor/tonic/PATCHES.md);
      # the generator moves only together with that patch.
      - dependency-name: "tonic*"
        versions: [">0.14.8"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/.github/actions/publish-image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      publish-image-actions:
        patterns:
          - "*"

  # FROM digests in the Dockerfile. A rust:<version> bump must land with the
  # same version in rust-toolchain.toml; `make tools-check` refuses drift.
  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"

  # template:begin integration:dependabot-compose
  - package-ecosystem: "docker-compose"
    directory: "/env"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      docker-compose:
        patterns:
          - "*"
  # template:end integration:dependabot-compose

  - package-ecosystem: "npm"
    directory: "/.railway"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      railway-iac:
        patterns:
          - "*"
