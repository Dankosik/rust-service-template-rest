version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Actions used inside the composite publication action.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/publish-image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      publish-image-actions:
        patterns:
          - "*"

  # FROM digests in the Dockerfile. A rust:<version> bump must land with the
  # same version in rust-toolchain.toml; `make tools-check` refuses drift.
  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"

  # template:begin integration:dependabot-compose
  # PostgreSQL and NATS image digests in the local compose file.
  - package-ecosystem: "docker-compose"
    directory: "/env"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    groups:
      docker-compose:
        patterns:
          - "*"
  # template:end integration:dependabot-compose
