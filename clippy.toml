# Lint levels live in `[workspace.lints]` in Cargo.toml; this file holds only lint configuration.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Proper nouns `doc_markdown` would otherwise ask to backtick; `..` keeps the defaults.
doc-valid-idents = ["OpenAPI", ".."]
