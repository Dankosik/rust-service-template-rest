    { path = "std::process::Child", reason = "use tokio::process::Command; build scripts and owned synchronous process fixtures need a narrow exception" },
    { path = "fs_err::File", reason = "use tokio::fs or an explicitly owned blocking fixture", allow-invalid = true },
    { path = "fs_err::OpenOptions", reason = "use tokio::fs or an explicitly owned blocking fixture", allow-invalid = true },
    { path = "fs_err::ReadDir", reason = "use tokio::fs or an explicitly owned blocking fixture", allow-invalid = true },
    { path = "walkdir::WalkDir", reason = "use tokio::fs directory traversal or bounded owned blocking work", allow-invalid = true },
    { path = "ureq::Agent", reason = "use the asynchronous client; synchronous HTTP fixtures need a narrow exception", allow-invalid = true },
    { path = "ureq::RequestBuilder", reason = "use the asynchronous client; synchronous HTTP fixtures need a narrow exception", allow-invalid = true },
    # Request data enters through `infra_http::extract::{Json, Query, Path}`, whose
    # rejections are Problems; axum's own answer `text/plain`. `infra_http`'s
    # `Json` is also the response body, so the one import serves both directions.
    # `allow-invalid`: a crate that builds axum without its `json` or `query`
    # feature has no such type to resolve.
    { path = "axum::Json", reason = "use infra_http::extract::Json: its rejections are Problems and it renders the same response", allow-invalid = true },
    { path = "axum::extract::Query", reason = "use infra_http::extract::Query: its rejections are Problems", allow-invalid = true },
    { path = "axum::extract::Path", reason = "use infra_http::extract::Path: its rejections are Problems" },
    { path = "axum_extra::extract::Query", reason = "use infra_http::extract::Query: its rejections are Problems and it reads a repeated key into a list", allow-invalid = true },
    { path = "axum_extra::extract::OptionalQuery", reason = "use infra_http::extract::Query with optional members: its rejections are Problems", allow-invalid = true },
    { path = "axum_extra::TypedHeader", reason = "read the header with HeaderMapExt::typed_try_get and answer a Problem: this extractor rejects with text/plain", allow-invalid = true },
]
