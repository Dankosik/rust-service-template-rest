# Lint levels live in `[workspace.lints]` in Cargo.toml; this file holds only lint configuration.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Proper nouns `doc_markdown` would otherwise ask to backtick; `..` keeps the defaults.
doc-valid-idents = ["OpenAPI", ".."]

# Application operations are authored with OpenApiRouter::routes(routes!(handler)).
# Bind each upstream routes! macro alone under a statement-local lint expectation.
# Exact non-contract transport fixtures and the hardened fallback explain local allowances.
disallowed-methods = [
    { path = "utoipa_axum::router::OpenApiRouter::route", reason = "Use an annotated routes! tuple with its scoped upstream-macro expectation" },
    { path = "utoipa_axum::router::OpenApiRouter::route_service", reason = "Use an annotated routes! tuple with its scoped upstream-macro expectation" },
    { path = "utoipa_axum::router::OpenApiRouter::nest_service", reason = "Use an annotated routes! tuple with its scoped upstream-macro expectation" },
