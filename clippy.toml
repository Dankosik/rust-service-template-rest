excessive-nesting-threshold = 6
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Proper nouns `doc_markdown` would otherwise ask to backtick; `..` keeps the defaults.
doc-valid-idents = ["OpenAPI", "PgBouncer", ".."]
# A span guard held across `.await` stays entered while the task is suspended,
# so events from other tasks on that thread land in the span.
await-holding-invalid-types = [
    { path = "tracing::span::Entered", reason = "attach the span with tracing::Instrument or Span::in_scope" },
    { path = "tracing::span::EnteredSpan", reason = "attach the span with tracing::Instrument or Span::in_scope" },
]

# Finite runtime-progress policy, pinned Rust 1.100.0 and reqwest 0.13.5.
