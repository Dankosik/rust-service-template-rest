excessive-nesting-threshold = 6
# Lint levels live in `[workspace.lints]` in Cargo.toml; this file holds only lint configuration.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Proper nouns `doc_markdown` would otherwise ask to backtick; `..` keeps the defaults.
doc-valid-idents = ["OpenAPI", "PgBouncer", ".."]

# Operations are registered as annotated `utoipa_axum::routes!` tuples through
# `OpenApiRouter::routes`, so served routes and the OpenAPI document share one
# source. The final policy layer answers a sanitized 500 for any served method
# the document lacks, and HEAD follows GET unless HEAD is documented. These bans
# keep undocumented routes, fallbacks, routes added after finalization and
# separately registered HEAD handlers out of application code.
# Finite runtime-progress policy, pinned Rust 1.99.0 and reqwest 0.13.5.
# Resolved identities cover renamed imports and synchronous helpers. Generic
# Read/Write remain usable for memory; inferred opaque handles, dependency
# internals, arbitrary CPU work and unlisted APIs still require review.
disallowed-methods = [
    { path = "std::thread::sleep", reason = "use tokio::time::sleep; only an owned synchronous fixture may wait here" },
    { path = "std::thread::sleep_ms", reason = "use tokio::time::sleep; only an owned synchronous fixture may wait here" },
    { path = "std::fs::read", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::read_to_string", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::write", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::copy", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::rename", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::remove_file", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::hard_link", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::soft_link", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::read_link", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::canonicalize", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::create_dir", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::create_dir_all", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::remove_dir", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::remove_dir_all", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::read_dir", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::metadata", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::symlink_metadata", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::set_permissions", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::exists", reason = "use tokio::fs or bounded owned blocking work; finite startup and fixture IO need a narrow exception" },
    { path = "std::fs::File::open", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::create", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::create_new", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::sync_all", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::sync_data", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::set_len", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::metadata", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::set_permissions", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::set_times", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::set_modified", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::lock", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::lock_shared", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::try_lock", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::try_lock_shared", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::unlock", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::File::try_clone", reason = "use tokio::fs or bounded owned blocking work" },
    { path = "std::fs::OpenOptions::open", reason = "use tokio::fs::OpenOptions or bounded owned blocking work" },
    { path = "std::fs::DirBuilder::create", reason = "use tokio::fs::create_dir or bounded owned blocking work" },
    { path = "std::fs::DirEntry::metadata", reason = "use tokio::fs directory entries or bounded owned blocking work" },
    { path = "std::fs::DirEntry::file_type", reason = "use tokio::fs directory entries or bounded owned blocking work" },
    { path = "std::path::Path::exists", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::try_exists", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::is_file", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::is_dir", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::is_symlink", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::metadata", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::symlink_metadata", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::canonicalize", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::read_link", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::path::Path::read_dir", reason = "use tokio::fs queries or bounded owned blocking work" },
    { path = "std::io::stdin", reason = "use tracing for runtime diagnostics; owned output threads and finite CLI output need a narrow exception" },
    { path = "std::io::stdout", reason = "use tracing for runtime diagnostics; owned output threads and finite CLI output need a narrow exception" },
    { path = "std::io::stderr", reason = "use tracing for runtime diagnostics; owned output threads and finite CLI output need a narrow exception" },
    { path = "std::io::Stdin::lock", reason = "use asynchronous input or an owned blocking reader" },
    { path = "std::io::Stdin::read_line", reason = "use asynchronous input or an owned blocking reader" },
    { path = "std::io::Stdin::lines", reason = "use asynchronous input or an owned blocking reader" },
    { path = "std::io::Stdout::lock", reason = "only the owned output thread or finite CLI output may lock stdout" },
    { path = "std::io::Stderr::lock", reason = "only the owned output thread or finite CLI output may lock stderr" },
    { path = "std::net::TcpStream::connect", reason = "use tokio::net::TcpStream" },
    { path = "std::net::TcpStream::connect_timeout", reason = "use tokio::net::TcpStream" },
    { path = "std::net::TcpStream::peek", reason = "use tokio::net::TcpStream" },
    { path = "std::net::TcpListener::bind", reason = "use tokio::net::TcpListener" },
    { path = "std::net::TcpListener::accept", reason = "use tokio::net::TcpListener" },
    { path = "std::net::TcpListener::incoming", reason = "use tokio::net::TcpListener" },
    { path = "std::net::UdpSocket::bind", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::connect", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::send", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::send_to", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::recv", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::recv_from", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::peek", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::UdpSocket::peek_from", reason = "use tokio::net::UdpSocket" },
    { path = "std::net::ToSocketAddrs::to_socket_addrs", reason = "use tokio::net::lookup_host with the owning operation budget" },
    # Unix APIs are absent on non-Unix targets; the native proof runs with cfg(unix).
    { path = "std::os::unix::net::UnixStream::connect", reason = "use tokio::net::UnixStream", allow-invalid = true },
    { path = "std::os::unix::net::UnixStream::connect_addr", reason = "use tokio::net::UnixStream", allow-invalid = true },
    { path = "std::os::unix::net::UnixStream::pair", reason = "use tokio::net::UnixStream", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener::bind", reason = "use tokio::net::UnixListener", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener::bind_addr", reason = "use tokio::net::UnixListener", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener::accept", reason = "use tokio::net::UnixListener", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener::incoming", reason = "use tokio::net::UnixListener", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::bind", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::bind_addr", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::unbound", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::pair", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::connect", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::connect_addr", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::send", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::send_to", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::send_to_addr", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::recv", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram::recv_from", reason = "use tokio::net::UnixDatagram", allow-invalid = true },
    # reqwest blocking/json APIs only exist with their respective features.
    # charset is not enabled by this workspace; enabling it reopens body-method coverage.
    { path = "reqwest::blocking::get", reason = "use the configured asynchronous outbound HTTP client", allow-invalid = true },
    { path = "reqwest::blocking::Client::new", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::Client::builder", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::Client::execute", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::ClientBuilder::new", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::ClientBuilder::build", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::RequestBuilder::send", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::Response::bytes", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::Response::text", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::Response::json", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "reqwest::blocking::Response::copy_to", reason = "use the configured asynchronous outbound HTTP client; startup exporter construction needs its own exception", allow-invalid = true },
    { path = "utoipa_axum::router::OpenApiRouter::route", reason = "register an annotated routes! tuple with OpenApiRouter::routes" },
    { path = "utoipa_axum::router::OpenApiRouter::route_service", reason = "register an annotated routes! tuple with OpenApiRouter::routes" },
    { path = "utoipa_axum::router::OpenApiRouter::nest_service", reason = "register an annotated routes! tuple with OpenApiRouter::routes" },
    { path = "utoipa_axum::router::OpenApiRouter::fallback", reason = "the hardened chain owns the 404 fallback" },
    { path = "utoipa_axum::router::OpenApiRouter::fallback_service", reason = "the hardened chain owns the 404 fallback" },
    { path = "axum::routing::Router::route", reason = "register an annotated routes! tuple with OpenApiRouter::routes before finalization" },
    { path = "axum::routing::Router::route_service", reason = "register an annotated routes! tuple with OpenApiRouter::routes before finalization" },
    { path = "axum::routing::Router::nest_service", reason = "register an annotated routes! tuple with OpenApiRouter::routes before finalization" },
    { path = "axum::routing::Router::fallback", reason = "the hardened chain owns the 404 fallback" },
    { path = "axum::routing::Router::fallback_service", reason = "the hardened chain owns the 404 fallback" },
    { path = "axum::routing::method_routing::MethodRouter::head", reason = "HEAD follows GET unless the annotation documents HEAD" },
    { path = "axum::routing::method_routing::MethodRouter::head_service", reason = "HEAD follows GET unless the annotation documents HEAD" },
    { path = "axum::routing::method_routing::head", reason = "HEAD follows GET unless the annotation documents HEAD" },
    { path = "axum::routing::method_routing::head_service", reason = "HEAD follows GET unless the annotation documents HEAD" },
    { path = "axum::routing::method_routing::any", reason = "register only annotated methods" },
    { path = "axum::routing::method_routing::any_service", reason = "register only annotated methods" },
    # A transaction opened on the pool itself skips the commit-outcome policy
    # and the transaction signals `infra_postgres::in_tx` owns. Savepoints
    # (`Connection::begin` on a borrowed connection) are not affected.
    { path = "sqlx_core::pool::Pool::begin", reason = "open the transaction with infra_postgres::in_tx" },
    { path = "sqlx_core::pool::Pool::begin_with", reason = "open the transaction with infra_postgres::in_tx_with" },
    { path = "sqlx_core::pool::Pool::try_begin", reason = "open the transaction with infra_postgres::in_tx" },
    { path = "sqlx_core::pool::Pool::try_begin_with", reason = "open the transaction with infra_postgres::in_tx_with" },
    # Direct checkout bypasses named acquisition diagnostics.
    { path = "sqlx_core::pool::Pool::acquire", reason = "acquire through infra_postgres::acquire or open infra_postgres::in_tx" },
    { path = "sqlx_core::pool::Pool::try_acquire", reason = "acquire through infra_postgres::acquire or open infra_postgres::in_tx" },
]

# Request data enters through `infra_http::extract::{Json, Query, Path}`, whose
# rejections are Problems; axum's own answer `text/plain`. `infra_http`'s
# `Json` is also the response body, so the one import serves both directions.
# `allow-invalid`: a crate that builds axum without its `json` or `query`
# feature has no such type to resolve.
disallowed-types = [
    { path = "std::io::Stdin", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::io::StdinLock", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::io::Stdout", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::io::StdoutLock", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::io::Stderr", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::io::StderrLock", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::net::TcpStream", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::net::TcpListener", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::net::UdpSocket", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception" },
    { path = "std::os::unix::net::UnixStream", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception", allow-invalid = true },
    { path = "std::os::unix::net::UnixListener", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception", allow-invalid = true },
    { path = "std::os::unix::net::UnixDatagram", reason = "use asynchronous IO; owned synchronous output and socket fixtures need a narrow exception", allow-invalid = true },
    { path = "std::fs::File", reason = "use tokio::fs or an explicitly owned blocking fixture" },
    { path = "std::fs::OpenOptions", reason = "use tokio::fs or an explicitly owned blocking fixture" },
    { path = "std::fs::ReadDir", reason = "use tokio::fs or an explicitly owned blocking fixture" },
    { path = "reqwest::blocking::Client", reason = "use the asynchronous client; the startup exporter owns its blocking exception", allow-invalid = true },
    { path = "reqwest::blocking::ClientBuilder", reason = "use the asynchronous client; the startup exporter owns its blocking exception", allow-invalid = true },
    { path = "reqwest::blocking::RequestBuilder", reason = "use the asynchronous client; the startup exporter owns its blocking exception", allow-invalid = true },
    { path = "reqwest::blocking::Response", reason = "use the asynchronous client; the startup exporter owns its blocking exception", allow-invalid = true },
    { path = "reqwest::blocking::Request", reason = "use the asynchronous client; the startup exporter owns its blocking exception", allow-invalid = true },
    { path = "reqwest::blocking::Body", reason = "use the asynchronous client; the startup exporter owns its blocking exception", allow-invalid = true },
    { path = "axum::Json", reason = "use infra_http::extract::Json: its rejections are Problems and it renders the same response", allow-invalid = true },
    { path = "axum::extract::Query", reason = "use infra_http::extract::Query: its rejections are Problems", allow-invalid = true },
    { path = "axum::extract::Path", reason = "use infra_http::extract::Path: its rejections are Problems", allow-invalid = true },
]
