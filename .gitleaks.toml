title = "rust-service-template-rest gitleaks configuration"

# Default rules; every allowlist below names its current reason. Historical
# public fixtures use exact commit-qualified fingerprints in .gitleaksignore.
[extend]
useDefault = true

[[allowlists]]
description = "Cargo build output is not source; `gitleaks dir` ignores .gitignore and would otherwise read hundreds of megabytes of it"
paths = ['''^target/''']

[[allowlists]]
description = "Public fixed HMAC fixture used only by the three synthetic hotpath load generators"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ["^specs/hotpath-(profiling|optimizations|remaining-optimizations)/scripts/load[.]js$"]
regexes = ["^0123456789abcdef0123456789abcdef$"]

# template:begin messaging:gitleaks-messaging-upstream-fixtures
# Published async-nats 0.50.0 test fixtures, byte-checked against the archive
# recorded in vendor/async-nats/PATCHES.md. These are public synthetic keys.
[[allowlists]]
description = "Pristine upstream NATS TLS test keys; exact public fixture paths only"
targetRules = ["private-key"]
paths = ['''^vendor/async-nats/tests/configs/certs/(client-all|client-key|ip-key|rootCA-key|server-key)[.]pem$''']

[[allowlists]]
description = "Pristine upstream NATS JWT test accounts; exact public fixture paths only"
targetRules = ["jwt"]
paths = ['''^vendor/async-nats/tests/configs/(TestUser[.]creds|jwt[.]conf)$''']

[[allowlists]]
description = "Pristine upstream NATS public nkey test identity"
targetRules = ["generic-api-key"]
paths = ['''^vendor/async-nats/tests/configs/nkey[.]conf$''']
# template:end messaging:gitleaks-messaging-upstream-fixtures

# These exact public digests are bound to retained native receipts. Path AND
# full match keeps other fields, values and locations subject to detection.
[[allowlists]]
description = "Verified OpenAPI lint receipt digest in adoption evidence"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ["\\Aspecs/consumer-lifecycle/completion-records/adoption-a(?:-final)?/validation[.]json\\z"]
regexes = ["\\Aconsumer-a-openapi-lint[.]json sha256:f910abe3095ea4607d6864588220099f2a77d686b9d837c0fda61aae717efa64\"\\z"]
[[allowlists]]
description = "Verified initialized OpenAPI digests in native control summary"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ["\\Aspecs/consumer-lifecycle/completion-records/ci/old-control-observations[.]json\\z"]
regexes = ["\\Aopenapi_sha256=(?:ba4e3b956663cf7366c437c72b61c9ab1e084b849e9a81c6cfa26650ba16a127|54e4ee62c5980979460dc84a2019cf7564778d526b3ee40a27ce54ac9ca5d534|fe70f6d570dc131191815d416464d5117497d6947b9b651f197a9437986490a3|afe903e491a9437c550652b975034f1e27f8e3998f7285400916445180c5e4b3) \\z"]
[[allowlists]]
description = "Verified initialized OpenAPI digests in paired native summary"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "match"
paths = ["\\Aspecs/consumer-lifecycle/completion-records/ci/final-pair-observations[.]json\\z"]
regexes = ["\\Aopenapi_sha256\": \"(?:ba4e3b956663cf7366c437c72b61c9ab1e084b849e9a81c6cfa26650ba16a127|54e4ee62c5980979460dc84a2019cf7564778d526b3ee40a27ce54ac9ca5d534|fe70f6d570dc131191815d416464d5117497d6947b9b651f197a9437986490a3|afe903e491a9437c550652b975034f1e27f8e3998f7285400916445180c5e4b3)\"\\z"]
