# Prometheus 3.5.0. Run with the pinned task-local promtool, without a server.
# Tests load the shipped expressions unchanged and assert on ALERTS, so every
# case also proves which alerts stay silent. Counters advance per one-minute
# sample: "0+90x300" is 90 requests a minute for five hours. Every case scrapes
# the service, since ServiceDown fires when discovery loses it.
# See https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
rule_files:
  - ../../env/monitoring/service.rules.yml
evaluation_interval: 1m
tests:
  - name: "HTTP 5xx at 10% pages on the 1h window first, then every window; probe failures stay out"
    interval: 1m
    input_series:
      - &service_up
        series: 'up{job="service",instance="a"}'
        values: "1x300"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200"}'
        values: "0+90x300"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="500"}'
        values: "0+10x300"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/health/ready",http_response_status_code="503"}'
        values: "0+50x300"
    promql_expr_test:
      - expr: round(job:slo_http_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.1
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 5h
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="6h",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1d",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="3d",severity="ticket"}'
            value: 1

  - name: "HTTP 5xx at 0.5% opens a ticket on the 1d window and pages nobody"
    interval: 1m
    input_series:
      - *service_up
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="POST",http_route="/v1/items",http_response_status_code="201"}'
        values: "0+199x150"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="POST",http_route="/v1/items",http_response_status_code="503"}'
        values: "0+1x150"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1d",severity="ticket"}'
            value: 1

  - name: "Failing readiness probes and 4xx answers alone page nobody"
    interval: 1m
    input_series:
      - *service_up
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200"}'
        values: "0+50x60"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="<unmatched>",http_response_status_code="404"}'
        values: "0+50x60"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/health/ready",http_response_status_code="503"}'
        values: "0+500x60"
      - series: 'http_server_request_duration_seconds_bucket{job="service",instance="a",http_request_method="GET",http_route="/health/ready",http_response_status_code="503",le="0.5"}'
        values: "0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 1h
        exp_samples: []

  - name: "30% of HTTP requests over 500 ms burn the latency budget"
    interval: 1m
    input_series:
      - *service_up
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200"}'
        values: "0+100x30"
      - series: 'http_server_request_duration_seconds_bucket{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200",le="0.5"}'
        values: "0+70x30"
    promql_expr_test:
      - expr: round(job:slo_http_slow:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.3
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPLatencyBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1

  - name: "A job with no reachable target pages; the lost replica becomes a ticket"
    interval: 1m
    input_series:
      - series: 'up{job="service",instance="a"}'
        values: "0x30"
      - series: 'up{job="jobs-worker",instance="w"}'
        values: "1x30"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceDown",alertstate="firing",job="service",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="ServiceTargetDown",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1

  - name: "A service missing from discovery pages as down"
    interval: 1m
    input_series:
      - series: 'up{job="jobs-worker",instance="w"}'
        values: "1x10"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceDown",alertstate="firing",job="service",severity="page"}'
            value: 1

  - name: "Crash loops, withheld and flapping readiness open tickets; one restart does not"
    interval: 1m
    input_series:
      - series: 'up{job="service",instance="a"}'
        values: "1x20"
      - series: 'process_start_time_seconds{job="service",instance="a"}'
        values: "100 100 200 200 300 300 400 400"
      - series: 'process_start_time_seconds{job="service",instance="b"}'
        values: "100 100 200 200 200 200 200 200"
      - series: 'readiness_ready{job="service",instance="a"}'
        values: "0x20"
      - series: 'readiness_ready{job="service",instance="b"}'
        values: "1 0 1 0 1 1 1 1x12"
      - series: 'readiness_ready{job="service",instance="c"}'
        values: "1 1 0 1 1x15"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 7m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceRestarting",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="ServiceReadinessFlapping",alertstate="firing",job="service",instance="b",severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="ServiceNotReady",alertstate="firing"}'
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceNotReady",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1

  # template:begin grpc:monitoring-grpc-fixture
  - name: "gRPC server faults and slow calls burn their budgets; client errors and health checks do not"
    interval: 1m
    input_series:
      - *service_up
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_service="example.v1.Example",grpc_method="Get",grpc_code="OK"}'
        values: "0+90x30"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_service="example.v1.Example",grpc_method="Get",grpc_code="InvalidArgument"}'
        values: "0+100x30"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_service="example.v1.Example",grpc_method="Get",grpc_code="Unavailable"}'
        values: "0+10x30"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_service="grpc.health.v1.Health",grpc_method="Check",grpc_code="Unavailable"}'
        values: "0+1000x30"
      - series: 'grpc_server_handling_seconds_count{job="service",instance="a",grpc_service="example.v1.Example",grpc_method="Get"}'
        values: "0+200x30"
      - series: 'grpc_server_handling_seconds_bucket{job="service",instance="a",grpc_service="example.v1.Example",grpc_method="Get",le="0.5"}'
        values: "0+120x30"
      - series: 'grpc_server_handling_seconds_count{job="service",instance="a",grpc_service="grpc.health.v1.Health",grpc_method="Check"}'
        values: "0+1000x30"
      - series: 'grpc_server_handling_seconds_bucket{job="service",instance="a",grpc_service="grpc.health.v1.Health",grpc_method="Check",le="0.5"}'
        values: "0x30"
    promql_expr_test:
      - expr: round(job:slo_grpc_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.05
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="GRPCErrorBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="GRPCLatencyBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
  # template:end grpc:monitoring-grpc-fixture

  # template:begin postgres:monitoring-postgres-fixture
  - name: "Sustained pooled-connection waits open a ticket for that instance only"
    interval: 1m
    input_series:
      - *service_up
      - series: 'db_client_connection_wait_time_seconds_count{job="service",instance="a",db_client_connection_pool_name="postgres"}'
        values: "0+100x40"
      - series: 'db_client_connection_wait_time_seconds_bucket{job="service",instance="a",db_client_connection_pool_name="postgres",le="0.1"}'
        values: "0+80x40"
      - series: 'db_client_connection_wait_time_seconds_count{job="service",instance="b",db_client_connection_pool_name="postgres"}'
        values: "0+100x40"
      - series: 'db_client_connection_wait_time_seconds_bucket{job="service",instance="b",db_client_connection_pool_name="postgres",le="0.1"}'
        values: "0+98x40"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 25m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresPoolSaturated",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
  # template:end postgres:monitoring-postgres-fixture

  # template:begin jobs:monitoring-jobs-fixture
  - name: "A stalled job kind and terminal job failures open tickets"
    interval: 1m
    input_series:
      - *service_up
      - series: 'jobs_oldest_available_age_seconds{job="jobs-worker",instance="w1",kind="email"}'
        values: "400x20"
      - series: 'jobs_oldest_available_age_seconds{job="jobs-worker",instance="w2",kind="email"}'
        values: "0x20"
      - series: 'jobs_oldest_available_age_seconds{job="jobs-worker",instance="w1",kind="report"}'
        values: "100x20"
      - series: 'jobs_attempts_total{job="jobs-worker",instance="w1",kind="email",outcome="exhausted"}'
        values: "0 0 0 1x17"
      - series: 'jobs_attempts_total{job="jobs-worker",instance="w1",kind="report",outcome="retry"}'
        values: "0+5x20"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 12m
        exp_samples:
          - labels: 'ALERTS{alertname="JobsQueueBacklog",alertstate="firing",kind="email",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="JobsDeadLettered",alertstate="firing",kind="email",severity="ticket"}'
            value: 1
  # template:end jobs:monitoring-jobs-fixture

  # template:begin messaging:monitoring-messaging-fixture
  - name: "A dead-lettered event opens a ticket naming its type, reason and publication outcome"
    interval: 1m
    input_series:
      - *service_up
      - series: 'messaging_dead_letter_total{job="jobs-worker",instance="w1",event_type="order.created",reason="permanent",outcome="accepted"}'
        values: "0 0 1x10"
      - series: 'messaging_handler_total{job="jobs-worker",instance="w1",event_type="order.created",outcome="retryable"}'
        values: "0+3x12"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="MessagingDeadLettered",alertstate="firing",event_type="order.created",outcome="accepted",reason="permanent",severity="ticket"}'
            value: 1
  # template:end messaging:monitoring-messaging-fixture
