            value: 1
      - expr: "pg:no_progress{database=\"fixture\",population=\"jobs\"}"
        eval_time: 30m
        exp_samples:
          - labels: "pg:no_progress{database=\"fixture\",population=\"jobs\"}"
            value: 0
      - expr: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresMaintenanceObservationUnavailable\",alertstate=\"firing\"}"
        eval_time: 30m
        exp_samples: []
      - expr: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresMaintenanceBacklogAttention\",alertstate=\"firing\"}"
        eval_time: 30m
        exp_samples:
          - labels: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresMaintenanceBacklogAttention\",alertstate=\"firing\"}"
            value: 1
      - expr: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresCleanupProgressAttention\",alertstate=\"firing\"}"
        eval_time: 30m
        exp_samples:
          - labels: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresCleanupProgressAttention\",alertstate=\"firing\"}"
            value: 1
  - name: "Successful empty population is usable and clears factual backlog and progress attention"
    interval: 15s
