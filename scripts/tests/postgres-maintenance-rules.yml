# Prometheus 3.5.0. Run with the pinned task-local promtool, without a server.
# Tests load the shipped expressions unchanged. The independent fixture inventory
# models reviewed deployment configuration; the shipped example keeps timestamp 0.
# ALERTS selectors isolate this inventory from the intentionally unconfigured example.
# Shared raw series are YAML anchors; overrides model faults at the scrape boundary.
# See https://prometheus.io/docs/prometheus/latest/configuration/unit_testing_rules/
rule_files:
  - ../../env/monitoring/postgres-maintenance.rules.yml
evaluation_interval: 15s
group_eval_order: [postgres-maintenance]
tests:
  - name: "Continuous nonempty backlog: incomplete startup then factual no progress"
    interval: 15s
    input_series:
      - &expect1
        series: "pg:expected{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &up1
        series: "up{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\"}"
        values: "1x160"
      - &enabled1
        series: "postgres_maintenance_observer_enabled{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &started1
        series: "postgres_maintenance_observer_started_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &success1
        series: "postgres_maintenance_last_success_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "0+15x160"
      - &observed1
        series: "postgres_maintenance_database_observed_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "0+15x160"
      - &present1
        series: "postgres_maintenance_present{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &oldest1
        series: "postgres_maintenance_oldest_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &attempt1
        series: "postgres_maintenance_last_attempt_success{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &clock1
        series: "postgres_maintenance_clock_valid{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",population=\"jobs\"}"
        values: "1x160"
      - &counter1
        series: "postgres_cleanup_removed_rows_total{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-1:9090\",cleanup=\"jobs\"}"
        values: "100x160"
      - &expect2
        series: "pg:expected{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &up2
        series: "up{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\"}"
        values: "1x160"
      - &enabled2
        series: "postgres_maintenance_observer_enabled{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &started2
        series: "postgres_maintenance_observer_started_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &success2
        series: "postgres_maintenance_last_success_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "0+15x160"
      - &observed2
        series: "postgres_maintenance_database_observed_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "0+15x160"
      - &present2
        series: "postgres_maintenance_present{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &oldest2
        series: "postgres_maintenance_oldest_timestamp_seconds{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &attempt2
        series: "postgres_maintenance_last_attempt_success{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &clock2
        series: "postgres_maintenance_clock_valid{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",population=\"jobs\"}"
        values: "1x160"
      - &counter2
        series: "postgres_cleanup_removed_rows_total{database=\"fixture\",job=\"jobs-worker\",instance=\"worker-2:9090\",cleanup=\"jobs\"}"
        values: "100x160"
      - &writers
        series: "pg:writer_set_changed_timestamp_seconds{database=\"fixture\",population=\"jobs\"}"
        values: "1x160"
    promql_expr_test:
      - expr: "pg:population_ok{database=\"fixture\",population=\"jobs\"}"
        eval_time: 30m
        exp_samples:
          - labels: "pg:population_ok{database=\"fixture\",population=\"jobs\"}"
            value: 1
      - expr: "pg:age_seconds{database=\"fixture\",population=\"jobs\"}"
        eval_time: 30m
        exp_samples:
          - labels: "pg:age_seconds{database=\"fixture\",population=\"jobs\"}"
            value: 1799
      - expr: "pg:backlog_present{database=\"fixture\",population=\"jobs\"}"
        eval_time: 30m
        exp_samples:
          - labels: "pg:backlog_present{database=\"fixture\",population=\"jobs\"}"
            value: 1
      - expr: "pg:progress_window_ok{database=\"fixture\",population=\"jobs\"}"
        eval_time: 10m
        exp_samples: []
      - expr: "pg:no_progress{database=\"fixture\",population=\"jobs\"}"
        eval_time: 10m
        exp_samples: []
      - expr: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresCleanupProgressAttention\",alertstate=\"firing\"}"
        eval_time: 10m
        exp_samples:
          - labels: "ALERTS{database=\"fixture\",population=\"jobs\",alertname=\"PostgresCleanupProgressAttention\",alertstate=\"firing\"}"
            value: 1
      - expr: "pg:progress_window_ok{database=\"fixture\",population=\"jobs\"}"
        eval_time: 30m
