# cargo-deny policy: advisories, licenses, bans, and sources over the locked
# dependency graph. `make deny` runs every check; CI runs it on the
# `cargo_dependencies` and `dependency_policy` surfaces and on schedule,
# because the advisory database moves without a commit.
# Decisions: docs/ci-cd-production-ready.md.

[graph]
# Only the targets the service is built and tested for. Without this list
# cargo-deny evaluates every target, and macOS-only crates (libproc, mach2,
# bindgen) would enter license and advisory decisions about the Linux binary.
# `all-features = true` covers optional `hotpath`, `integration`, and
# `test-support` graphs that default workspace resolution omits.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
# chrono reaches only tests (axum-test's non-optional expect-json) and the
# opt-in hotpath profiler's MCP server (rmcp, directly and through schemars `chrono04`);
# `[bans]` refuses it on every other path, so service code cannot adopt it
# under this waiver. Remove when those parents drop chrono.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono reaches only tests and the opt-in hotpath MCP server; bans deny every other path" },
]

[licenses]
include-dev = true
# Permissive licenses that the current graph uses; cargo-deny warns on an
# allowance no crate matches, so a new license is added when a crate brings
# it. CC0-1.0 covers axum-tracing-opentelemetry and
# tracing-opentelemetry-instrumentation-sdk; dual-licensed crates (r-efi, ryu,
# memchr, zerocopy) are satisfied by MIT or Apache-2.0. The rustls stack
# (sqlx + OTLP reqwest, both aws-lc-rs) adds ISC (rustls-webpki, untrusted,
# aws-lc-sys) and the Mozilla root store's CDLA-Permissive-2.0 (webpki-roots).
allow = [
    "MIT",
    # template:begin cache:deny-cache-license
    # xxhash-rust (redis key hashing) uses the Boost Software License 1.0.
    "BSL-1.0",
    # template:end cache:deny-cache-license
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Unreviewed duplicate versions fail closed; cargo-deny warns when an upstream
# upgrade or profile projection retires a `skip` entry so stale waivers surface.
multiple-versions = "deny"
# OpenTelemetry stays explicitly denied even against a future `skip`: a second
# version brings its own `global` tracer provider and propagator, which nothing
# installs, so crates built against it export and propagate nothing silently.
deny = [
    { crate = "opentelemetry", deny-multiple-versions = true },
    { crate = "opentelemetry_sdk", deny-multiple-versions = true },
    { crate = "chrono", wrappers = ["expect-json", "rmcp", "schemars"], reason = "unmaintained (RUSTSEC-2026-0543); only axum-test assertions and the hotpath MCP schema may bring it" },
]
skip = [
    { crate = "base64@0.22", reason = "async-nats, headers, jsonwebtoken, and metrics-exporter-prometheus have not moved to 0.23" },
    { crate = "block-buffer@0.10", reason = "digest 0.10 transitive chain alongside digest 0.11" },
    { crate = "const-oid@0.9", reason = "jsonwebtoken 11 transitive chain alongside rcgen on 0.10" },
    { crate = "cpufeatures@0.2", reason = "sha2 0.10 and sha1 0.10 transitive chain alongside sha2 0.11" },
    { crate = "crypto-common@0.1", reason = "digest 0.10 transitive chain alongside digest 0.11" },
    { crate = "digest@0.10", reason = "sqlx-core, ed25519-dalek, and crc-fast alongside digest 0.11" },
    { crate = "getrandom@0.2", reason = "rand 0.8 via nkeys has not moved to getrandom 0.4" },
    { crate = "getrandom@0.3", reason = "rand 0.9 and aws-sdk-s3 have not moved to getrandom 0.4" },
    { crate = "hashbrown@0.16", reason = "moka and metrics-exporter-prometheus transitive chain alongside indexmap on 0.17" },
    { crate = "itertools@0.13", reason = "prost-derive 0.14 has not moved to itertools 0.15" },
    { crate = "pem@3", reason = "jsonwebtoken 11 has not moved to pem 4, which rcgen uses in tls-test-support" },
    { crate = "rand@0.8", reason = "nkeys 0.4 via async-nats has not moved to rand 0.10" },
    { crate = "rand@0.9", reason = "metrics-util 0.20 and opentelemetry_sdk 0.33 have not moved to rand 0.10" },
    { crate = "rand_chacha@0.3", reason = "rand 0.8 via nkeys alongside rand 0.9 on rand_chacha 0.9" },
    { crate = "rand_core@0.6", reason = "rand 0.8 and signatory via nkeys have not moved to rand_core 0.10" },
    { crate = "rand_core@0.9", reason = "rand 0.9 via metrics-util and opentelemetry_sdk has not moved to rand_core 0.10" },
    { crate = "sha2@0.10", reason = "sqlx-core 0.9 and ed25519-dalek alongside sha2 0.11 in sqlx-postgres and aws-sdk-s3" },
    { crate = "syn@2", reason = "proc-macro crates split across syn 2 and syn 3" },
    { crate = "tower-http@0.6", reason = "reqwest 0.13 has not moved to tower-http 0.7" },
    { crate = "untrusted@0.7", reason = "aws-lc-rs 1.19 uses untrusted 0.7 alongside rustls-webpki on 0.9" },
]
wildcards = "deny"
# Workspace crates depend on each other by path without a version; cargo-deny
# treats a bare path dependency as a wildcard unless this is set.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
