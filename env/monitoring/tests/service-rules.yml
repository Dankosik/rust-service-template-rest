rule_files:
  - ../service.rules.yml
evaluation_interval: 1m
tests:
  - name: "HTTP 5xx at 10% pages on the 1h window first, then every window; probe failures stay out"
    interval: 1m
    input_series:
      - &service_up
        series: 'up{job="service",instance="a"}'
        values: "1x300"
      - &temporal_worker_up
        series: 'up{job="temporal-worker",instance="tw"}'
        values: "1x300"
      - &api_start
        series: 'process_start_time_seconds{job="service",instance="a"}'
        values: "100x300"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200"}'
        values: "0+90x300"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="500"}'
        values: "0+10x300"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/health/ready",http_response_status_code="503"}'
        values: "0+50x300"
    promql_expr_test:
      - expr: round(job:slo_http_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.1
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 5h
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="6h",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1d",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="3d",severity="ticket"}'
            value: 1

  - name: "HTTP 5xx at 0.5% opens a ticket on the 1d window and pages nobody"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - *api_start
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="POST",http_route="/v1/items",http_response_status_code="201"}'
        values: "0+199x150"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="POST",http_route="/v1/items",http_response_status_code="503"}'
        values: "0+1x150"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 2h
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPErrorBudgetBurn",alertstate="firing",job="service",long_window="1d",severity="ticket"}'
            value: 1

  - name: "Failing readiness probes and 4xx answers alone page nobody"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - *api_start
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200"}'
        values: "0+50x60"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="<unmatched>",http_response_status_code="404"}'
        values: "0+50x60"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/health/ready",http_response_status_code="503"}'
        values: "0+500x60"
      - series: 'http_server_request_duration_seconds_bucket{job="service",instance="a",http_request_method="GET",http_route="/health/ready",http_response_status_code="503",le="0.5"}'
        values: "0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 1h
        exp_samples: []

  - name: "30% of HTTP requests over 500 ms burn the latency budget"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - *api_start
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200"}'
        values: "0+100x30"
      - series: 'http_server_request_duration_seconds_bucket{job="service",instance="a",http_request_method="GET",http_route="/v1/items",http_response_status_code="200",le="0.5"}'
        values: "0+70x30"
    promql_expr_test:
      - expr: round(job:slo_http_slow:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.3
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="HTTPLatencyBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1

  - name: "HTTP counts a new failure series after a healthy baseline and counts a failed body once"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - *api_start
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_response_status_code="200"}'
        values: "0+10x12"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_response_status_code="500",error_type="response_body_error"}'
        values: "_x9 1x3"
      - series: 'http_server_request_duration_seconds_bucket{job="service",instance="a",http_response_status_code="200",le="0.5"}'
        values: "0+10x12"
      - series: 'http_server_request_duration_seconds_bucket{job="service",instance="a",http_response_status_code="500",error_type="response_body_error",le="0.5"}'
        values: "_x9 1x3"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_response_status_code="200",error_type="response_body_error"}'
        values: "_x9 1x3"
    promql_expr_test:
      - expr: job:slo_http_errors:ratio_rate5m
        eval_time: 8m
        exp_samples:
          - labels: 'job:slo_http_errors:ratio_rate5m{job="service"}'
            value: 0
      - expr: instance:slo_http_errors:sum
        eval_time: 11m
        exp_samples:
          - labels: 'instance:slo_http_errors:sum{job="service",instance="a",process_start="100"}'
            value: 2
      - expr: instance:slo_http_fast_responses:sum
        eval_time: 11m
        exp_samples:
          - labels: 'instance:slo_http_fast_responses:sum{job="service",instance="a",process_start="100"}'
            value: 110
      - expr: job:slo_http_errors:ratio_rate5m > bool 0
        eval_time: 11m
        exp_samples:
          - labels: '{job="service"}'
            value: 1
      - expr: job:slo_http_errors:ratio_rate5m{job="jobs-worker"}
        eval_time: 11m
        exp_samples: []

  - name: "A replacement at the same scrape address gets a separate SLO baseline"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - series: 'process_start_time_seconds{job="service",instance="a"}'
        values: "100x9 700x10"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_response_status_code="200"}'
        values: "99x9 96+95x9"
      - series: 'http_server_request_duration_seconds_count{job="service",instance="a",http_response_status_code="500"}'
        values: "1x9 5+5x9"
    promql_expr_test:
      - expr: round(job:slo_http_errors:ratio_rate5m, 0.0001)
        eval_time: 11m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.05

  - name: "All reachable API targets must report unready before paging, without request traffic"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - series: 'up{job="service",instance="b"}'
        values: "1x30"
      - series: 'readiness_ready{job="service",instance="a"}'
        values: "0x30"
      - series: 'readiness_ready{job="service",instance="b"}'
        values: "_x6 1x4 0x9 1x9"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing",alertname="ServiceNoReadyTargets"}'
        eval_time: 6m
        exp_samples: []
      - expr: 'ALERTS{alertstate="firing",alertname="ServiceNoReadyTargets"}'
        eval_time: 11m
        exp_samples: []
      - expr: 'ALERTS{alertstate="firing",alertname="ServiceNoReadyTargets"}'
        eval_time: 19m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceNoReadyTargets",alertstate="firing",job="service",severity="page"}'
            value: 1
      - expr: 'ALERTS{alertstate="firing",alertname="ServiceNoReadyTargets"}'
        eval_time: 24m
        exp_samples: []

  - name: "Persistent loss opens tickets only on affected log sinks and enabled trace exporters"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - series: 'telemetry_log_records_dropped_total{job="service",instance="log",reason="queue_full"}'
        values: "0+1x20"
      - series: 'telemetry_log_sink_errors_total{job="service",instance="brief",operation="write"}'
        values: "0 1x20"
      - series: 'telemetry_trace_exporter_sdk_result_spans_total{job="service",instance="trace",outcome="error",error_type="timeout"}'
        values: "0+4x20"
      - series: 'service_startup_trace_exporter_active{job="service",instance="trace"}'
        values: "1x20"
      - series: 'telemetry_sdk_reported_rejected_spans_total{job="service",instance="partial"}'
        values: "0+2x20"
      - series: 'service_startup_trace_exporter_active{job="service",instance="partial"}'
        values: "1x20"
      - series: 'telemetry_sdk_diagnostics_total{job="service",instance="off",event="response_parse_error"}'
        values: "0+1x20"
      - series: 'service_startup_trace_exporter_active{job="service",instance="off"}'
        values: "0x20"
      - series: 'runtime_scheduler_sample_age_seconds{job="service",instance="lag"}'
        values: "0+60x20"
      - series: 'runtime_scheduler_freshness_limit_seconds{job="service",instance="lag"}'
        values: "1x20"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="TelemetryRecordsLost",alertstate="firing",job="service",instance="log",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="TelemetryRecordsLost",alertstate="firing",job="service",instance="trace",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="TelemetryRecordsLost",alertstate="firing",job="service",instance="partial",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="RuntimeSchedulerSampleStale",alertstate="firing",job="service",instance="lag",severity="ticket"}'
            value: 1

  - name: "One pre-export span drop opens a bounded ticket even before the first scrape"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - series: 'service_startup_trace_exporter_active{job="service",instance="a"}'
        values: "1x15"
      - series: 'process_start_time_seconds{job="service",instance="a"}'
        values: "0x15"
      - series: 'telemetry_sdk_diagnostics_total{job="service",instance="a",event="queue_dropping_started"}'
        values: "0x5 1x9"
      - series: 'service_startup_trace_exporter_active{job="service",instance="restarted"}'
        values: "1x15"
      - series: 'process_start_time_seconds{job="service",instance="restarted"}'
        values: "0x7 480x7"
      - series: 'telemetry_sdk_diagnostics_total{job="service",instance="restarted",event="queue_dropping_started"}'
        values: "0x5 1x1 0x7"
      - series: 'service_startup_trace_exporter_active{job="service",instance="early"}'
        values: "_ 1x14"
      - series: 'process_start_time_seconds{job="service",instance="early"}'
        values: "_ 0x14"
      - series: 'telemetry_sdk_diagnostics_total{job="service",instance="early",event="queue_dropping_started"}'
        values: "_ 1x14"
      - series: 'service_startup_trace_exporter_active{job="service",instance="off"}'
        values: "0x15"
      - series: 'telemetry_sdk_diagnostics_total{job="service",instance="off",event="queue_dropping_started"}'
        values: "0x5 1x9"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 0m
        exp_samples: []
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 1m
        exp_samples:
          - labels: 'ALERTS{alertname="TelemetrySpanQueueOverflow",alertstate="firing",job="service",instance="early",severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 5m
        exp_samples: []
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 6m
        exp_samples:
          - &service_span_queue_ticket
            labels: 'ALERTS{alertname="TelemetrySpanQueueOverflow",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="TelemetrySpanQueueOverflow",alertstate="firing",job="service",instance="restarted",severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 8m
        exp_samples:
          - *service_span_queue_ticket
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'ALERTS{alertstate="firing",alertname=~"TelemetrySpanQueueOverflow|TelemetryRecordsLost"}'
        eval_time: 15m
        exp_samples: []

  - name: "A job with no reachable target pages; the lost replica becomes a ticket"
    interval: 1m
    input_series:
      - *temporal_worker_up
      - series: 'up{job="service",instance="a"}'
        values: "0x30"
      - series: 'up{job="jobs-worker",instance="w"}'
        values: "1x30"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceDown",alertstate="firing",job="service",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="ServiceTargetDown",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1

  - name: "A service missing from discovery pages as down"
    interval: 1m
    input_series:
      - *temporal_worker_up
      - series: 'up{job="jobs-worker",instance="w"}'
        values: "1x10"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceDown",alertstate="firing",job="service",severity="page"}'
            value: 1

  - name: "Crash loops, withheld and flapping readiness open tickets; one restart does not"
    interval: 1m
    input_series:
      - *temporal_worker_up
      - series: 'up{job="service",instance="a"}'
        values: "1x20"
      - series: 'up{job="service",instance="b"}'
        values: "1x30"
      - series: 'process_start_time_seconds{job="service",instance="a"}'
        values: "100 100 200 200 300 300 400 400"
      - series: 'process_start_time_seconds{job="service",instance="b"}'
        values: "100 100 200 200 200 200 200 200"
      - series: 'readiness_ready{job="service",instance="a"}'
        values: "0x20"
      - series: 'readiness_ready{job="service",instance="b"}'
        values: "1 0 1 0 1 1 1 1x12"
      - series: 'readiness_ready{job="service",instance="c"}'
        values: "1 1 0 1 1x15"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 7m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceRestarting",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="ServiceReadinessFlapping",alertstate="firing",job="service",instance="b",severity="ticket"}'
            value: 1
      - expr: 'ALERTS{alertname="ServiceNotReady",alertstate="firing"}'
        eval_time: 16m
        exp_samples:
          - labels: 'ALERTS{alertname="ServiceNotReady",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1

  - name: "A starved runtime, a thread pile-up, descriptors and memory near their limits open tickets for that instance only"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - series: 'runtime_scheduler_lag_seconds_count{job="service",instance="a"}'
        values: "0+600x30"
      - series: 'runtime_scheduler_lag_seconds_bucket{job="service",instance="a",le="0.1"}'
        values: "0+580x30"
      - series: 'runtime_scheduler_lag_seconds_count{job="service",instance="b"}'
        values: "0+600x30"
      - series: 'runtime_scheduler_lag_seconds_bucket{job="service",instance="b",le="0.1"}'
        values: "0+599x30"
      - series: 'process_threads{job="service",instance="a"}'
        values: "120x30"
      - series: 'tokio_workers_count{job="service",instance="a"}'
        values: "4x30"
      - series: 'process_threads{job="service",instance="b"}'
        values: "32x30"
      - series: 'tokio_workers_count{job="service",instance="b"}'
        values: "24x30"
      - series: 'process_open_fds{job="service",instance="a"}'
        values: "900x30"
      - series: 'process_max_fds{job="service",instance="a"}'
        values: "1024x30"
      - series: 'process_open_fds{job="service",instance="b"}'
        values: "900x30"
      - series: 'process_max_fds{job="service",instance="b"}'
        values: "524288x30"
      - series: 'process_resident_memory_bytes{job="service",instance="a"}'
        values: "483183820x30"
      - series: 'process_memory_limit_bytes{job="service",instance="a"}'
        values: "536870912x30"
      - series: 'process_resident_memory_bytes{job="service",instance="b"}'
        values: "483183820x30"
    promql_expr_test:
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 14m
        exp_samples: []
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 22m
        exp_samples:
          - labels: 'ALERTS{alertname="RuntimeSchedulerLagging",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="RuntimeThreadsElevated",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="OpenFilesNearLimit",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1
          - labels: 'ALERTS{alertname="MemoryNearLimit",alertstate="firing",job="service",instance="a",severity="ticket"}'
            value: 1

  # template:begin grpc:monitoring-grpc-fixture
  - name: "gRPC server faults and slow unary calls burn their budgets; client errors, health checks and streams do not"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - *api_start
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_type="unary",grpc_service="example.v1.Example",grpc_method="Get",grpc_code="OK"}'
        values: "0+90x30"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_type="unary",grpc_service="example.v1.Example",grpc_method="Get",grpc_code="InvalidArgument"}'
        values: "0+100x30"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_type="unary",grpc_service="example.v1.Example",grpc_method="Get",grpc_code="Unavailable"}'
        values: "0+10x30"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_type="unary",grpc_service="grpc.health.v1.Health",grpc_method="Check",grpc_code="Unavailable"}'
        values: "0+1000x30"
      - series: 'grpc_server_handling_seconds_count{job="service",instance="a",grpc_type="unary",grpc_service="example.v1.Example",grpc_method="Get"}'
        values: "0+200x30"
      - series: 'grpc_server_handling_seconds_bucket{job="service",instance="a",grpc_type="unary",grpc_service="example.v1.Example",grpc_method="Get",le="0.5"}'
        values: "0+120x30"
      - series: 'grpc_server_handling_seconds_count{job="service",instance="a",grpc_type="server_stream",grpc_service="example.v1.Example",grpc_method="Watch"}'
        values: "0+500x30"
      - series: 'grpc_server_handling_seconds_bucket{job="service",instance="a",grpc_type="server_stream",grpc_service="example.v1.Example",grpc_method="Watch",le="0.5"}'
        values: "0x30"
      - series: 'grpc_server_handling_seconds_count{job="service",instance="a",grpc_type="unary",grpc_service="grpc.health.v1.Health",grpc_method="Check"}'
        values: "0+1000x30"
      - series: 'grpc_server_handling_seconds_bucket{job="service",instance="a",grpc_type="unary",grpc_service="grpc.health.v1.Health",grpc_method="Check",le="0.5"}'
        values: "0x30"
    promql_expr_test:
      - expr: round(job:slo_grpc_errors:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.05
      - expr: round(job:slo_grpc_slow:ratio_rate5m, 0.0001)
        eval_time: 10m
        exp_samples:
          - labels: '{job="service"}'
            value: 0.4
      - expr: 'ALERTS{alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="GRPCErrorBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
          - labels: 'ALERTS{alertname="GRPCLatencyBudgetBurn",alertstate="firing",job="service",long_window="1h",severity="page"}'
            value: 1
  - name: "gRPC reports zero before the first server failure and includes that first failure"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - *api_start
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_service="example.API",grpc_code="OK"}'
        values: "0+10x12"
      - series: 'grpc_server_handled_total{job="service",instance="a",grpc_service="example.API",grpc_code="Internal"}'
        values: "_x9 1x3"
    promql_expr_test:
      - expr: job:slo_grpc_errors:ratio_rate5m
        eval_time: 8m
        exp_samples:
          - labels: 'job:slo_grpc_errors:ratio_rate5m{job="service"}'
            value: 0
      - expr: job:slo_grpc_errors:ratio_rate5m > bool 0
        eval_time: 11m
        exp_samples:
          - labels: '{job="service"}'
            value: 1
  # template:end grpc:monitoring-grpc-fixture

  # template:begin postgres:monitoring-postgres-fixture
  - name: "Sustained pooled-connection waits open a ticket for that instance only"
    interval: 1m
    input_series:
      - *service_up
      - *temporal_worker_up
      - series: 'db_client_connection_wait_time_seconds_count{job="service",instance="a",db_client_connection_pool_name="postgres"}'
        values: "0+100x40"
