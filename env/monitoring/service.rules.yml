          sum by(job) (rate(grpc_server_handled_total{job=~"service|jobs-worker",grpc_service!~"grpc\\.health\\.v1\\.Health|grpc\\.reflection\\..+",grpc_code=~"Unknown|DeadlineExceeded|ResourceExhausted|Internal|Unavailable|DataLoss"}[5m]))
          /
