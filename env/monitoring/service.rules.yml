        labels: {severity: page, long_window: 1h}
        annotations:
          summary: gRPC calls slower than 500 ms burns the 99% under 500 ms latency error budget 14.4x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc calls slower than 500 ms over 1h, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate6h > (6 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels: {severity: page, long_window: 6h}
        annotations:
          summary: gRPC calls slower than 500 ms burns the 99% under 500 ms latency error budget 6x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc calls slower than 500 ms over 6h, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate1d > (3 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate2h > (3 * 0.01)
        for: 1h
        labels: {severity: ticket, long_window: 1d}
        annotations:
          summary: gRPC calls slower than 500 ms burns the 99% under 500 ms latency error budget 3x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc calls slower than 500 ms over 1d, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate3d > (1 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate6h > (1 * 0.01)
        for: 3h
        labels: {severity: ticket, long_window: 3d}
        annotations:
          summary: gRPC calls slower than 500 ms burns the 99% under 500 ms latency error budget 1x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc calls slower than 500 ms over 3d, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
  # template:end grpc:monitoring-grpc-slo
  # template:begin postgres:monitoring-postgres-pool
  - name: service-postgres
    rules:
      - record: instance:db_client_connection_wait_slow:ratio_rate10m
        expr: |
          1 - (
            sum by(job,instance) (rate(db_client_connection_wait_time_seconds_bucket{job=~"service|jobs-worker",le="0.1"}[10m]))
            /
            sum by(job,instance) (rate(db_client_connection_wait_time_seconds_count{job=~"service|jobs-worker"}[10m]))
          )
      - alert: PostgresPoolSaturated
        expr: instance:db_client_connection_wait_slow:ratio_rate10m > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: More than 5% of transactions wait over 100 ms for a pooled connection
          description: '{{ $labels.instance }} of {{ $labels.job }}: {{ $value | humanizePercentage }} of connection acquisitions waited over 100 ms.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#postgrespoolsaturated
  # template:end postgres:monitoring-postgres-pool
  # template:begin jobs:monitoring-jobs
  - name: service-jobs
    rules:
      - alert: JobsQueueBacklog
        expr: max by(kind) (jobs_oldest_available_age_seconds{job=~"service|jobs-worker"}) > 300
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Available jobs have waited over five minutes for a worker
          description: 'The oldest available {{ $labels.kind }} job has waited {{ $value | humanizeDuration }}.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#jobsqueuebacklog
      - alert: JobsDeadLettered
        expr: |
          sum by(kind) (increase(jobs_attempts_total{job=~"service|jobs-worker",outcome=~"exhausted|permanent"}[15m])) > 0
        labels: {severity: ticket}
        annotations:
          summary: Jobs failed for good and wait for operator recovery
          description: '{{ $value | humanize }} {{ $labels.kind }} jobs failed permanently or exhausted their attempts in 15 minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#jobsdeadlettered
  # template:end jobs:monitoring-jobs
  # template:begin messaging:monitoring-messaging
  - name: service-messaging
    rules:
      - alert: MessagingDeadLettered
        expr: |
          sum by(event_type,reason,outcome) (increase(messaging_dead_letter_total{job=~"service|jobs-worker"}[15m])) > 0
        labels: {severity: ticket}
        annotations:
          summary: Consumed events were dead-lettered
          description: '{{ $value | humanize }} {{ $labels.event_type }} events dead-lettered for {{ $labels.reason }} in 15 minutes; publication {{ $labels.outcome }}.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#messagingdeadlettered
  # template:end messaging:monitoring-messaging
