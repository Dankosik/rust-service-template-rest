# Service alerting: symptom-based SLO burn rates, plus tickets for lost
# capacity, crash loops and queues that stop draining. See docs/alerting.md for
# the objectives, thresholds and how a derived service tunes them.
# Selectors name the scrape jobs `service`, `jobs-worker`, and `temporal-worker`; replace them with
# yours. Rule proof uses Prometheus 3.5.5.
groups:
  - name: service-http-slo
    rules:
      - record: instance:slo_http_process:count_values
        expr: |
          count_values by(job,instance) ("process_start", process_start_time_seconds{job=~"service|jobs-worker|temporal-worker"})
      - record: instance:slo_http_requests:sum
        expr: |
          sum by(job,instance) (http_server_request_duration_seconds_count{job=~"service|jobs-worker|temporal-worker",http_route!~"/health/live|/health/ready"})
          * on(job,instance) group_left(process_start) instance:slo_http_process:count_values
      - record: instance:slo_http_errors:sum
        expr: |
          sum by(job,instance) (
            http_server_request_duration_seconds_count{job=~"service|jobs-worker|temporal-worker",http_route!~"/health/live|/health/ready",http_response_status_code=~"5.."}
            or http_server_request_duration_seconds_count{job=~"service|jobs-worker|temporal-worker",http_route!~"/health/live|/health/ready",error_type=~"server_shutdown|response_body_error"}
          )
          * on(job,instance) group_left(process_start) instance:slo_http_process:count_values
          or on(job,instance,process_start) (0 * instance:slo_http_requests:sum)
      - record: instance:slo_http_fast_responses:sum
        expr: |
          (
            sum by(job,instance) (http_server_request_duration_seconds_bucket{job=~"service|jobs-worker|temporal-worker",http_route!~"/health/live|/health/ready",le="0.5",error_type!~"server_shutdown|response_body_error|client_closed"})
            or on(job,instance) (0 * sum by(job,instance) (http_server_request_duration_seconds_bucket{job=~"service|jobs-worker|temporal-worker",http_route!~"/health/live|/health/ready",le="0.5"}))
          )
          * on(job,instance) group_left(process_start) instance:slo_http_process:count_values
      - record: job:slo_http_errors:ratio_rate5m
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[5m]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[5m]))
      - record: job:slo_http_errors:ratio_rate30m
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[30m]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[30m]))
      - record: job:slo_http_errors:ratio_rate1h
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[1h]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[1h]))
      - record: job:slo_http_errors:ratio_rate2h
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[2h]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[2h]))
      - record: job:slo_http_errors:ratio_rate6h
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[6h]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[6h]))
      - record: job:slo_http_errors:ratio_rate1d
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[1d]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[1d]))
      - record: job:slo_http_errors:ratio_rate3d
        expr: |
          sum by(job) (rate(instance:slo_http_errors:sum[3d]))
          /
          sum by(job) (rate(instance:slo_http_requests:sum[3d]))
      - record: job:slo_http_slow:ratio_rate5m
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[5m]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[5m]))
          )
      - record: job:slo_http_slow:ratio_rate30m
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[30m]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[30m]))
          )
      - record: job:slo_http_slow:ratio_rate1h
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[1h]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[1h]))
          )
      - record: job:slo_http_slow:ratio_rate2h
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[2h]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[2h]))
          )
      - record: job:slo_http_slow:ratio_rate6h
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[6h]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[6h]))
          )
      - record: job:slo_http_slow:ratio_rate1d
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[1d]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[1d]))
          )
      - record: job:slo_http_slow:ratio_rate3d
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_http_fast_responses:sum[3d]))
            /
            sum by(job) (rate(instance:slo_http_requests:sum[3d]))
          )
      - alert: HTTPErrorBudgetBurn
        expr: |
          job:slo_http_errors:ratio_rate1h > (14.4 * 0.001)
          and
          job:slo_http_errors:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels: {severity: page, long_window: 1h}
        annotations:
          summary: HTTP response failures burn the 99.9% availability error budget 14.4x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP requests failed over 1h, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httperrorbudgetburn
      - alert: HTTPErrorBudgetBurn
        expr: |
          job:slo_http_errors:ratio_rate6h > (6 * 0.001)
          and
          job:slo_http_errors:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels: {severity: page, long_window: 6h}
        annotations:
          summary: HTTP response failures burn the 99.9% availability error budget 6x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP requests failed over 6h, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httperrorbudgetburn
      - alert: HTTPErrorBudgetBurn
        expr: |
          job:slo_http_errors:ratio_rate1d > (3 * 0.001)
          and
          job:slo_http_errors:ratio_rate2h > (3 * 0.001)
        for: 1h
        labels: {severity: ticket, long_window: 1d}
        annotations:
          summary: HTTP response failures burn the 99.9% availability error budget 3x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP requests failed over 1d, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httperrorbudgetburn
      - alert: HTTPErrorBudgetBurn
        expr: |
          job:slo_http_errors:ratio_rate3d > (1 * 0.001)
          and
          job:slo_http_errors:ratio_rate6h > (1 * 0.001)
        for: 3h
        labels: {severity: ticket, long_window: 3d}
        annotations:
          summary: HTTP response failures burn the 99.9% availability error budget 1x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP requests failed over 3d, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httperrorbudgetburn
      - alert: HTTPLatencyBudgetBurn
        expr: |
          job:slo_http_slow:ratio_rate1h > (14.4 * 0.01)
          and
          job:slo_http_slow:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: {severity: page, long_window: 1h}
        annotations:
          summary: HTTP responses incomplete within 500 ms burn the 99% under 500 ms latency error budget 14.4x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP responses incomplete within 500 ms over 1h, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httplatencybudgetburn
      - alert: HTTPLatencyBudgetBurn
        expr: |
          job:slo_http_slow:ratio_rate6h > (6 * 0.01)
          and
          job:slo_http_slow:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels: {severity: page, long_window: 6h}
        annotations:
          summary: HTTP responses incomplete within 500 ms burn the 99% under 500 ms latency error budget 6x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP responses incomplete within 500 ms over 6h, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httplatencybudgetburn
      - alert: HTTPLatencyBudgetBurn
        expr: |
          job:slo_http_slow:ratio_rate1d > (3 * 0.01)
          and
          job:slo_http_slow:ratio_rate2h > (3 * 0.01)
        for: 1h
        labels: {severity: ticket, long_window: 1d}
        annotations:
          summary: HTTP responses incomplete within 500 ms burn the 99% under 500 ms latency error budget 3x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP responses incomplete within 500 ms over 1d, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httplatencybudgetburn
      - alert: HTTPLatencyBudgetBurn
        expr: |
          job:slo_http_slow:ratio_rate3d > (1 * 0.01)
          and
          job:slo_http_slow:ratio_rate6h > (1 * 0.01)
        for: 3h
        labels: {severity: ticket, long_window: 3d}
        annotations:
          summary: HTTP responses incomplete within 500 ms burn the 99% under 500 ms latency error budget 1x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of HTTP responses incomplete within 500 ms over 3d, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#httplatencybudgetburn
  - name: service-health
    rules:
      - alert: ServiceDown
        expr: |
          sum by(job) (up{job=~"service|jobs-worker|temporal-worker"}) == 0
          or
          absent(up{job="service"})
        for: 5m
        labels: {severity: page}
        annotations:
          summary: No scrape target of the job answers
          description: '{{ $labels.job }} has no reachable target; every other alert for it is blind.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#servicedown
      - alert: ServiceNoReadyTargets
        expr: |
          count by(job) (
            (readiness_ready{job="service"} == 0)
            and on(job,instance) (up{job="service"} == 1)
          ) == on(job) sum by(job) (up{job="service"})
        for: 5m
        labels: {severity: page}
        annotations:
          summary: Every reachable API replica has withheld readiness for five minutes
          description: '{{ $labels.job }} has no ready scrape target to receive routed traffic.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#servicenoreadytargets
      - alert: ServiceTargetDown
        expr: up{job=~"service|jobs-worker|temporal-worker"} == 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: One scrape target stays unreachable for 15 minutes
          description: '{{ $labels.instance }} of {{ $labels.job }} has not answered a scrape for 15 minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#servicetargetdown
      - alert: ServiceRestarting
        expr: changes(process_start_time_seconds{job=~"service|jobs-worker|temporal-worker"}[30m]) >= 3
        labels: {severity: ticket}
        annotations:
          summary: A process restarted at least three times in 30 minutes
          description: '{{ $labels.instance }} of {{ $labels.job }} restarted {{ $value }} times in 30 minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#servicerestarting
      - alert: ServiceNotReady
        expr: readiness_ready{job=~"service|jobs-worker|temporal-worker"} == 0
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: A running process has withheld readiness for 15 minutes
          description: '{{ $labels.instance }} of {{ $labels.job }} is unready. Check for drain, stale checks, or a failing dependency.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#servicenotready
      - alert: ServiceReadinessFlapping
        expr: changes(readiness_ready{job=~"service|jobs-worker|temporal-worker"}[30m]) >= 4
        labels: {severity: ticket}
        annotations:
          summary: Readiness flipped at least four times in 30 minutes
          description: '{{ $labels.instance }} of {{ $labels.job }} changed readiness {{ $value }} times in 30 minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#servicereadinessflapping
  - name: service-runtime
    rules:
      - alert: RuntimeSchedulerLagging
        expr: |
          1 - (
            sum by(job,instance) (rate(runtime_scheduler_lag_seconds_bucket{job=~"service|jobs-worker|temporal-worker",le="0.1"}[5m]))
            /
            sum by(job,instance) (rate(runtime_scheduler_lag_seconds_count{job=~"service|jobs-worker|temporal-worker"}[5m]))
          ) > 0.01
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: More than 1% of runtime progress samples run over 100 ms late
          description: '{{ $labels.instance }} of {{ $labels.job }}: {{ $value | humanizePercentage }} of scheduler samples ran over 100 ms late.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#runtimeschedulerlagging
      - alert: RuntimeSchedulerSampleStale
        expr: |
          runtime_scheduler_sample_age_seconds{job=~"service|jobs-worker|temporal-worker"}
          > on(job,instance) runtime_scheduler_freshness_limit_seconds{job=~"service|jobs-worker|temporal-worker"}
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: The scheduler heartbeat has stopped updating on a reachable target
          description: '{{ $labels.instance }} of {{ $labels.job }} last sampled scheduler progress {{ $value | humanizeDuration }} ago.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#runtimeschedulersamplestale
      - alert: TelemetryRecordsLost
        expr: |
          sum by(job,instance) (rate(telemetry_log_records_dropped_total{job=~"service|jobs-worker|temporal-worker"}[5m])) > 0
          or sum by(job,instance) (rate(telemetry_log_sink_errors_total{job=~"service|jobs-worker|temporal-worker"}[5m])) > 0
          or (
            (
              sum by(job,instance) (rate(telemetry_trace_exporter_sdk_result_spans_total{job=~"service|jobs-worker|temporal-worker",outcome="error"}[5m])) > 0
              or sum by(job,instance) (rate(telemetry_sdk_reported_rejected_spans_total{job=~"service|jobs-worker|temporal-worker"}[5m])) > 0
              or sum by(job,instance) (rate(telemetry_sdk_diagnostics_total{job=~"service|jobs-worker|temporal-worker",event="response_parse_error"}[5m])) > 0
            )
            and on(job,instance) (service_startup_trace_exporter_active{job=~"service|jobs-worker|temporal-worker"} == 1)
          )
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Application logs or trace exports are persistently failing
          description: '{{ $labels.instance }} of {{ $labels.job }} has reported telemetry loss or invalid collector responses for ten minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#telemetryrecordslost
      - alert: TelemetrySpanQueueOverflow
        expr: |
          max by(job,instance) (telemetry_sdk_diagnostics_total{job=~"service|jobs-worker|temporal-worker",event="queue_dropping_started"}) > 0
          and on(job,instance) (service_startup_trace_exporter_active{job=~"service|jobs-worker|temporal-worker"} == 1)
          and on(job,instance) (
            increase(telemetry_sdk_diagnostics_total{job=~"service|jobs-worker|temporal-worker",event="queue_dropping_started"}[5m]) > 0
            or on(job,instance) (time() - process_start_time_seconds{job=~"service|jobs-worker|temporal-worker"} < 300)
          )
        labels: {severity: ticket}
        annotations:
          summary: The trace batch queue dropped at least one span before export
          description: '{{ $labels.instance }} of {{ $labels.job }} reported a local trace batch queue overflow.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#telemetryspanqueueoverflow
      - alert: RuntimeThreadsElevated
        expr: |
          process_threads{job=~"service|jobs-worker|temporal-worker"}
          - on(job,instance)
          tokio_workers_count{job=~"service|jobs-worker|temporal-worker"}
          > 64
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: A process holds over 64 threads beyond its runtime workers
          description: '{{ $labels.instance }} of {{ $labels.job }} runs {{ $value }} threads beyond its runtime workers.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#runtimethreadselevated
      - alert: OpenFilesNearLimit
        expr: |
          process_open_fds{job=~"service|jobs-worker|temporal-worker"}
          / on(job,instance)
          process_max_fds{job=~"service|jobs-worker|temporal-worker"}
          > 0.8
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: A process uses over 80% of its open-file limit
          description: '{{ $labels.instance }} of {{ $labels.job }} holds {{ $value | humanizePercentage }} of its open-file limit.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#openfilesnearlimit
      - alert: MemoryNearLimit
        expr: |
          process_resident_memory_bytes{job=~"service|jobs-worker|temporal-worker"}
          / on(job,instance)
          process_memory_limit_bytes{job=~"service|jobs-worker|temporal-worker"}
          > 0.85
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: A process uses over 85% of its memory limit
          description: '{{ $labels.instance }} of {{ $labels.job }} holds {{ $value | humanizePercentage }} of its memory limit.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#memorynearlimit
  # template:begin grpc:monitoring-grpc-slo
  - name: service-grpc-slo
    rules:
      - record: instance:slo_grpc_process:count_values
        expr: |
          count_values by(job,instance) ("process_start", process_start_time_seconds{job=~"service|jobs-worker|temporal-worker"})
      - record: instance:slo_grpc_requests:sum
        expr: |
          sum by(job,instance) (grpc_server_handled_total{job=~"service|jobs-worker|temporal-worker",grpc_service!~"grpc[.]health[.]v1[.]Health|grpc[.]reflection[.].+"})
          * on(job,instance) group_left(process_start) instance:slo_grpc_process:count_values
      - record: instance:slo_grpc_errors:sum
        expr: |
          sum by(job,instance) (grpc_server_handled_total{job=~"service|jobs-worker|temporal-worker",grpc_service!~"grpc[.]health[.]v1[.]Health|grpc[.]reflection[.].+",grpc_code=~"Unknown|DeadlineExceeded|ResourceExhausted|Internal|Unavailable|DataLoss"})
          * on(job,instance) group_left(process_start) instance:slo_grpc_process:count_values
          or on(job,instance,process_start) (0 * instance:slo_grpc_requests:sum)
      - record: job:slo_grpc_errors:ratio_rate5m
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[5m]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[5m]))
      - record: job:slo_grpc_errors:ratio_rate30m
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[30m]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[30m]))
      - record: job:slo_grpc_errors:ratio_rate1h
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[1h]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[1h]))
      - record: job:slo_grpc_errors:ratio_rate2h
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[2h]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[2h]))
      - record: job:slo_grpc_errors:ratio_rate6h
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[6h]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[6h]))
      - record: job:slo_grpc_errors:ratio_rate1d
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[1d]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[1d]))
      - record: job:slo_grpc_errors:ratio_rate3d
        expr: |
          sum by(job) (rate(instance:slo_grpc_errors:sum[3d]))
          /
          sum by(job) (rate(instance:slo_grpc_requests:sum[3d]))
      - record: instance:slo_grpc_unary_calls:sum
        expr: |
          sum by(job,instance) (grpc_server_handling_seconds_count{job=~"service|jobs-worker|temporal-worker",grpc_service!~"grpc[.]health[.]v1[.]Health|grpc[.]reflection[.].+",grpc_type="unary"})
          * on(job,instance) group_left(process_start) instance:slo_grpc_process:count_values
      - record: instance:slo_grpc_fast_unary_calls:sum
        expr: |
          sum by(job,instance) (grpc_server_handling_seconds_bucket{job=~"service|jobs-worker|temporal-worker",grpc_service!~"grpc[.]health[.]v1[.]Health|grpc[.]reflection[.].+",grpc_type="unary",le="0.5"})
          * on(job,instance) group_left(process_start) instance:slo_grpc_process:count_values
      - record: job:slo_grpc_slow:ratio_rate5m
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[5m]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[5m]))
          )
      - record: job:slo_grpc_slow:ratio_rate30m
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[30m]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[30m]))
          )
      - record: job:slo_grpc_slow:ratio_rate1h
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[1h]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[1h]))
          )
      - record: job:slo_grpc_slow:ratio_rate2h
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[2h]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[2h]))
          )
      - record: job:slo_grpc_slow:ratio_rate6h
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[6h]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[6h]))
          )
      - record: job:slo_grpc_slow:ratio_rate1d
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[1d]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[1d]))
          )
      - record: job:slo_grpc_slow:ratio_rate3d
        expr: |
          1 - (
            sum by(job) (rate(instance:slo_grpc_fast_unary_calls:sum[3d]))
            /
            sum by(job) (rate(instance:slo_grpc_unary_calls:sum[3d]))
          )
      - alert: GRPCErrorBudgetBurn
        expr: |
          job:slo_grpc_errors:ratio_rate1h > (14.4 * 0.001)
          and
          job:slo_grpc_errors:ratio_rate5m > (14.4 * 0.001)
        for: 2m
        labels: {severity: page, long_window: 1h}
        annotations:
          summary: gRPC server-fault statuses burns the 99.9% availability error budget 14.4x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc server-fault statuses over 1h, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpcerrorbudgetburn
      - alert: GRPCErrorBudgetBurn
        expr: |
          job:slo_grpc_errors:ratio_rate6h > (6 * 0.001)
          and
          job:slo_grpc_errors:ratio_rate30m > (6 * 0.001)
        for: 15m
        labels: {severity: page, long_window: 6h}
        annotations:
          summary: gRPC server-fault statuses burns the 99.9% availability error budget 6x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc server-fault statuses over 6h, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpcerrorbudgetburn
      - alert: GRPCErrorBudgetBurn
        expr: |
          job:slo_grpc_errors:ratio_rate1d > (3 * 0.001)
          and
          job:slo_grpc_errors:ratio_rate2h > (3 * 0.001)
        for: 1h
        labels: {severity: ticket, long_window: 1d}
        annotations:
          summary: gRPC server-fault statuses burns the 99.9% availability error budget 3x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc server-fault statuses over 1d, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpcerrorbudgetburn
      - alert: GRPCErrorBudgetBurn
        expr: |
          job:slo_grpc_errors:ratio_rate3d > (1 * 0.001)
          and
          job:slo_grpc_errors:ratio_rate6h > (1 * 0.001)
        for: 3h
        labels: {severity: ticket, long_window: 3d}
        annotations:
          summary: gRPC server-fault statuses burns the 99.9% availability error budget 1x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of grpc server-fault statuses over 3d, against a budget of 0.001.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpcerrorbudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate1h > (14.4 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate5m > (14.4 * 0.01)
        for: 2m
        labels: {severity: page, long_window: 1h}
        annotations:
          summary: unary gRPC calls slower than 500 ms burn the 99% under 500 ms latency error budget 14.4x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of unary grpc calls slower than 500 ms over 1h, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate6h > (6 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate30m > (6 * 0.01)
        for: 15m
        labels: {severity: page, long_window: 6h}
        annotations:
          summary: unary gRPC calls slower than 500 ms burn the 99% under 500 ms latency error budget 6x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of unary grpc calls slower than 500 ms over 6h, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate1d > (3 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate2h > (3 * 0.01)
        for: 1h
        labels: {severity: ticket, long_window: 1d}
        annotations:
          summary: unary gRPC calls slower than 500 ms burn the 99% under 500 ms latency error budget 3x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of unary grpc calls slower than 500 ms over 1d, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
      - alert: GRPCLatencyBudgetBurn
        expr: |
          job:slo_grpc_slow:ratio_rate3d > (1 * 0.01)
          and
          job:slo_grpc_slow:ratio_rate6h > (1 * 0.01)
        for: 3h
        labels: {severity: ticket, long_window: 3d}
        annotations:
          summary: unary gRPC calls slower than 500 ms burn the 99% under 500 ms latency error budget 1x faster than sustainable
          description: '{{ $labels.job }}: {{ $value | humanizePercentage }} of unary grpc calls slower than 500 ms over 3d, against a budget of 0.01.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#grpclatencybudgetburn
  # template:end grpc:monitoring-grpc-slo
  # template:begin postgres:monitoring-postgres-pool
  - name: service-postgres
    rules:
      - record: instance:db_client_connection_wait_slow:ratio_rate10m
        expr: |
          1 - (
            sum by(job,instance) (rate(db_client_connection_wait_time_seconds_bucket{job=~"service|jobs-worker|temporal-worker",le="0.1"}[10m]))
            /
            sum by(job,instance) (rate(db_client_connection_wait_time_seconds_count{job=~"service|jobs-worker|temporal-worker"}[10m]))
          )
      - alert: PostgresPoolSaturated
        expr: instance:db_client_connection_wait_slow:ratio_rate10m > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: More than 5% of transactions wait over 100 ms for a pooled connection
          description: '{{ $labels.instance }} of {{ $labels.job }}: {{ $value | humanizePercentage }} of connection acquisitions waited over 100 ms.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#postgrespoolsaturated
  # template:end postgres:monitoring-postgres-pool
  # template:begin jobs:monitoring-jobs
  - name: service-jobs
    rules:
      - alert: JobsQueueBacklog
        expr: max by(kind) (jobs_oldest_available_age_seconds{job=~"service|jobs-worker|temporal-worker"}) > 300
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Available jobs have waited over five minutes for a worker
          description: 'The oldest available {{ $labels.kind }} job has waited {{ $value | humanizeDuration }}.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#jobsqueuebacklog
      - alert: JobsObservationStale
        expr: max by(job,instance) (time() - jobs_observation_timestamp_seconds{job=~"service|jobs-worker|temporal-worker"}) > 120
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: The job queue sample is missing or stale, so queue gauges are frozen
          description: '{{ $labels.instance }} of {{ $labels.job }} has no queue sample newer than {{ $value | humanizeDuration }}; JobsQueueBacklog cannot see a growing backlog there.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#jobsobservationstale
      - alert: JobsDeadLettered
        expr: |
          max by(kind) (
            max_over_time(jobs_last_terminal_attempt_timestamp_seconds{job=~"service|jobs-worker|temporal-worker"}[15m])
          ) > time() - 15 * 60
        labels: {severity: ticket}
        annotations:
          summary: Jobs failed for good and wait for operator recovery
          description: 'A {{ $labels.kind }} job failed permanently or exhausted its attempts in the last 15 minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#jobsdeadlettered
  # template:end jobs:monitoring-jobs
  # template:begin messaging:monitoring-messaging
  - name: service-messaging
    rules:
      - alert: MessagingDeadLettered
        expr: |
          max by(event_type,reason,outcome) (
            max_over_time(messaging_last_dead_letter_timestamp_seconds{job=~"service|jobs-worker|temporal-worker"}[15m])
          ) > time() - 15 * 60
        labels: {severity: ticket}
        annotations:
          summary: A dead-letter publication was attempted
          description: 'A dead-letter publication for {{ $labels.event_type }} with reason {{ $labels.reason }} in the last 15 minutes had outcome {{ $labels.outcome }}.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#messagingdeadlettered
  # template:end messaging:monitoring-messaging
  - name: service-temporal
    rules:
      - alert: TemporalWorkerUnavailable
        expr: |
          sum by(job) (up{job="temporal-worker"}) == 0
          or
          absent(up{job="temporal-worker"})
          or
          (
            count by(job) (
              (readiness_ready{job="temporal-worker"} == 0)
              and on(job,instance) (up{job="temporal-worker"} == 1)
            ) == on(job) sum by(job) (up{job="temporal-worker"})
          )
        for: 5m
        labels: {severity: page}
        annotations:
          summary: No ready Temporal worker replica is available to poll task queues
          description: '{{ $labels.job }} has no reachable and ready scrape target for five minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#temporalworkerunavailable
      - alert: TemporalTaskQueueScheduleToStartHigh
        expr: |
          (
            1 - (
              sum by(job,namespace,task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_bucket{job="temporal-worker",le="1"}[5m]))
              /
              sum by(job,namespace,task_queue) (rate(temporal_workflow_task_schedule_to_start_latency_count{job="temporal-worker"}[5m]))
            )
          ) > 0.05
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: More than 5% of Temporal workflow tasks waited over 1 s before a worker started them
          description: '{{ $labels.job }} ({{ $labels.namespace }}/{{ $labels.task_queue }}): {{ $value | humanizePercentage }} of workflow tasks waited over 1 s to start.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#temporaltaskqueuescheduletostarthigh
      - alert: TemporalWorkflowTaskFailures
        expr: |
          sum by(job,namespace,task_queue) (rate(temporal_workflow_task_execution_failed{job="temporal-worker"}[5m])) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Temporal workflow tasks are failing execution or replay
          description: '{{ $labels.job }} ({{ $labels.namespace }}/{{ $labels.task_queue }}) reported sustained workflow task failures for five minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#temporalworkflowtaskfailures
      - alert: TemporalDrainForced
        expr: |
          sum by(job,instance) (increase(temporal_drain_forced_total{job="temporal-worker"}[15m])) > 0
          or
          (
            max by(job,instance) (temporal_drain_forced_total{job="temporal-worker"}) > 0
            and on(job,instance) (time() - process_start_time_seconds{job="temporal-worker"} < 900)
          )
        labels: {severity: ticket}
        annotations:
          summary: A Temporal worker forced shutdown drain and preempted active activities
          description: '{{ $labels.instance }} of {{ $labels.job }} forced shutdown drain within the last 15 minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#temporaldrainforced
      - alert: TemporalClientRpcErrors
        expr: |
          sum by(job,namespace,operation,status_code) (
            rate(temporal_request_failure{job=~"service|temporal-worker",status_code=~"UNKNOWN|DEADLINE_EXCEEDED|RESOURCE_EXHAUSTED|INTERNAL|UNAVAILABLE|DATA_LOSS|UNAUTHENTICATED|PERMISSION_DENIED|TRANSPORT_ERROR"}[5m])
          ) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Temporal gRPC client requests are persistently failing
          description: '{{ $labels.job }} ({{ $labels.namespace }} {{ $labels.operation }}) encountered sustained {{ $labels.status_code }} RPC failures for five minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#temporalclientrpcerrors
      - alert: TemporalCredentialReloadFailed
        expr: |
          sum by(job,instance,kind) (rate(temporal_credential_reloads_total{job=~"service|temporal-worker",outcome="failed"}[5m])) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Temporal live credential reload is failing while retaining the previous credential
          description: '{{ $labels.instance }} of {{ $labels.job }} failed to reload its Temporal {{ $labels.kind }} credential for five minutes.'
          runbook_url: https://github.com/Dankosik/rust-service-template-rest/blob/main/docs/alerting.md#temporalcredentialreloadfailed
