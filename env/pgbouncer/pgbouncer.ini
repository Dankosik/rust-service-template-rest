; PgBouncer in front of the compose PostgreSQL, for the pooled-deployment
; proof in `make test-integration-db`. Local and test credentials only.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; The service publishes these in each connection's startup packet. PgBouncer
; 1.26 applies a tracked parameter PostgreSQL does not report whenever the
; client becomes active; earlier releases accept it and drop it, which the
; service refuses when it opens its pool.
track_extra_parameters = statement_timeout, idle_in_transaction_session_timeout, default_transaction_isolation
