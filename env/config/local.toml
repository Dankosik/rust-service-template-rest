# Baseline for running the service on a developer machine:
#   make run   (= cargo run -p service -- --config env/config/local.toml)
#
# Non-secret defaults only. Secret-like keys (password, secret, credentials,
# token, dsn, authorization, api_key, private_key, otlp_headers) may appear
# here only as empty placeholders; a non-empty value fails startup. Set
# secrets through APP__SECTION__KEY variables: in the environment, or as
# files of that name in the directory `--secrets-dir` names. Every key not
# known to the service fails startup too, so a typo cannot be silently
# ignored.

[app]
env = "local"

[http]
addr = ":8080"
# Production keeps serving for 15s after readiness flips off so load
# balancers notice; on a laptop that only delays Ctrl-C.
readiness_propagation_delay = "0s"

[log]
level = "debug"
format = "text"

# Unset uses cgroup-aware available parallelism, falling back to one.
# [runtime]
# worker_threads = 4

[observability.otel.exporter]
# Empty: spans get trace ids for log correlation but nothing is exported.
# Point at a local collector to see traces, e.g. "http://127.0.0.1:4318".
otlp_endpoint = ""
otlp_headers = ""

# template:begin authn:local-config-section
[authn]
# Authentication remains inert until a derived service selects an authn profile.
mode = "none"
# template:end authn:local-config-section
# template:begin oidc-introspection:local-config-introspection-inputs
# The client secret is environment-only and intentionally omitted here.
# Set these only with mode = "oidc-introspection" and its issuer/audience.
# introspection_endpoint = "https://issuer.example/introspect"
# introspection_client_id = "service-client"
# cache_enabled = false
# cache_capacity = 256
# cache_ttl = "30s"
# template:end oidc-introspection:local-config-introspection-inputs

# template:begin postgres:local-config
[postgres]
# The profile is inert until enabled. With `make compose-up`:
#   APP__POSTGRES__ENABLED=true \
#   APP__POSTGRES__DSN='postgres://app:app@127.0.0.1:5432/app?sslmode=disable' make run
enabled = false
dsn = ""
max_connections = 4
# "server" when a pooler in front refuses startup parameters and the database
# role carries statement_timeout and idle_in_transaction_session_timeout.
session_budgets = "startup"
# A file holding the password alone, for a platform that rotates it; the DSN
# then carries no password.
# password_file = "/run/secrets/postgres-password"
# template:end postgres:local-config

# template:begin http-idempotency:local-config-http-idempotency
# The pack is inert until an idempotent operation is served, and retention
# has no usable default: set it once the pack is active, for example:
#   APP__HTTP_IDEMPOTENCY__RETENTION=24h make run
# [http_idempotency]
# retention = "24h"
# template:end http-idempotency:local-config-http-idempotency

# template:begin jobs:local-config-jobs
# The jobs worker reads this section; a worker beside `make run` needs its own APP__HTTP__ADDR and APP__OBSERVABILITY__METRICS__ADDR.
# [jobs]
# max_workers = 1
# template:end jobs:local-config-jobs

# template:begin messaging:local-config
# Messaging is inert until URLs are selected. Credentials are environment-only.
# A local unauthenticated plaintext broker may be selected explicitly:
# [messaging]
# urls = ["nats://127.0.0.1:4222"]
# allow_plaintext = true
# allow_unauthenticated = true
# source_stream = "events"
# max_payload_bytes = "256 KiB"
# consumer_durable = "service-events"
# consumer_filter_subject = "events.>"
# dlq_subject = "dead.events"
# consumer_concurrency = 1
# template:end messaging:local-config

# template:begin cache:local-config
# Cache is inert until a DSN is selected. The DSN is environment-only.
#   APP__CACHE__DSN=redis://127.0.0.1:6379
# [cache]
# allow_plaintext = true
# allow_unauthenticated = true
# command_timeout = "2s"
# A rotated password comes from a file instead of the DSN:
# password_file = "/run/secrets/cache-password"
# A TLS server that requires a client certificate takes both paths:
# client_cert_path = "/run/tls/cache-client.crt"
# client_key_path = "/run/tls/cache-client.key"
# template:end cache:local-config

# template:begin object-storage:local-config
# Object storage is inert until a provider is selected. The secret is
# environment-only. With the emulator, which creates `template-bucket`:
#   docker compose -f env/docker-compose.yml up -d --wait versitygw
#   APP__OBJECT_STORAGE__SECRET_ACCESS_KEY=template-secret make run
# [object_storage]
# provider = "local"
# endpoint = "http://127.0.0.1:7070"
# bucket = "template-bucket"
# access_key_id = "template"
# max_object_bytes = "8 MiB"
# max_concurrency = 8
# operation_timeout = "5s"
# template:end object-storage:local-config
