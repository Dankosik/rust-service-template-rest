# template:begin postgres:compose-postgres-header
# The same file serves `just test-integration-db` and the image rehearsal,
# which set POSTGRES_PORT=127.0.0.1:0 for an ephemeral loopback port and read it back.
# `just test-integration-db` also starts `pgbouncer` in front of it.
# template:end postgres:compose-postgres-header
services:
  # template:begin postgres:compose-postgres-service
  postgres:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      # initdb fsyncs a cluster this container recreates on every `down -v`,
      # and that sync is most of the startup a caller waits on. It bounds
      # nothing after initialization: the running server keeps its default
      # durability.
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 3s
      retries: 20
  pgbouncer:
    image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:6c91fd7383b8b098bc0c3b71dba4e98bd568c0d301b9fc66027fbc23259c6a7d
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 2s
      timeout: 3s
      retries: 20
  # template:end postgres:compose-postgres-service
  # template:begin messaging:compose-nats-service
  nats:
    image: nats:2.15.2-alpine3.22@sha256:afae2fdbe2e326c65e1246cb83b9d05d319188734f3bd577ac8072daae78a10f
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "${NATS_PORT:-4222}:4222"
    volumes:
      - ${NATS_CONFIG_FILE:-./nats/nats-server.conf}:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20
  # template:end messaging:compose-nats-service
  # template:begin cache:compose-valkey-service
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  # template:end cache:compose-valkey-service
  # template:begin object-storage:compose-versitygw-service
  # S3 emulator for `just test-integration-object-storage` and a local run:
  #   docker compose -f env/docker-compose.yml up -d --wait versitygw
  # The posix backend keeps objects and their metadata (extended attributes)
  # under /data, an anonymous volume that `down -v` removes. A directory there
  # is a bucket of the root account, so `template-bucket` exists before the
  # gateway listens: the client never creates a bucket.
  versitygw:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/template-bucket && exec versitygw --port :7070 --health /health posix /data
    environment:
      ROOT_ACCESS_KEY: template
      ROOT_SECRET_KEY: template-secret
    ports:
      - "${VERSITYGW_PORT:-7070}:7070"
    volumes:
      - /data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7070/health"]
      interval: 2s
      timeout: 3s
      retries: 20
  # template:end object-storage:compose-versitygw-service
  # template:begin outbound-auth:compose-keycloak-service
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    profiles: ["oauth"]
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "${KEYCLOAK_PORT:-127.0.0.1:8080}:8080"
  # template:end outbound-auth:compose-keycloak-service
