[package]
name = "integration-tests"
description = "Cross-crate integration test suites and fixtures."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# template:begin integration:test-integration-feature-head
[features]
# template:end integration:test-integration-feature-head
# template:begin postgres:test-default-postgres-feature
default = ["dep:tokio"]
# template:end postgres:test-default-postgres-feature
# template:begin integration:test-integration-feature-body
# Non-Docker targets run with `just test`. `integration` targets require live
# Compose services matching the retained profiles.
integration = [
# template:end integration:test-integration-feature-body
# template:begin temporal:test-integration-temporal-features
    "dep:tokio",
    "dep:infra-temporal",
    "dep:temporal-worker",
    "dep:temporalio-sdk",
    "dep:temporalio-common",
    "dep:temporalio-workflow",
    "dep:temporalio-macros",
    "dep:futures",
# template:end temporal:test-integration-temporal-features
# template:begin integration:test-integration-feature-tail
]
# template:end integration:test-integration-feature-tail

# template:begin postgres:test-postgres-dependencies
[dependencies]
bytes = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }
infra-postgres = { workspace = true, features = ["test-support"] }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "macros"] }
# template:end postgres:test-postgres-dependencies
# template:begin jobs:test-jobs-dependencies
infra-jobs = { workspace = true }
jobs-worker = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
# template:end jobs:test-jobs-dependencies

# template:begin test-temporal-or-postgres:test-tokio-dependency
[dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net", "signal", "fs"]
optional = true
# template:end test-temporal-or-postgres:test-tokio-dependency

# template:begin jobs-reference:test-reading-counter-dependencies
[dependencies.clap]
workspace = true
features = ["derive", "std"]
[dependencies.derive_more]
workspace = true
features = ["from"]
[dependencies.domain-events]
workspace = true
[dependencies.infra-messaging]
workspace = true
[dependencies.infra-webhooks]
workspace = true
[dependencies.serde_json]
workspace = true
features = ["std"]
[dependencies.time]
workspace = true
features = ["std", "serde", "serde-well-known", "formatting", "parsing"]
[dependencies.uuid]
workspace = true
features = ["std"]
# template:end jobs-reference:test-reading-counter-dependencies

# template:begin temporal:test-temporal-dependencies
[dependencies.infra-temporal]
workspace = true
features = ["worker"]
optional = true
[dependencies.temporal-worker]
workspace = true
optional = true
[dependencies.temporalio-sdk]
workspace = true
optional = true
[dependencies.temporalio-common]
workspace = true
optional = true
[dependencies.temporalio-workflow]
workspace = true
optional = true
[dependencies.temporalio-macros]
workspace = true
optional = true
[dependencies.futures]
workspace = true
features = ["alloc", "std"]
optional = true
# template:end temporal:test-temporal-dependencies

# template:begin webhooks-common:test-webhooks-dependencies
[dev-dependencies.infra-webhooks]
workspace = true
features = ["test-support"]
# template:end webhooks-common:test-webhooks-dependencies

[dev-dependencies]
# template:begin outbox:test-messaging-outbox-dependencies
async-nats = { workspace = true, features = ["jetstream"] }
domain-events = { workspace = true }
infra-messaging = { workspace = true }
nats-test-support = { workspace = true }
# template:end outbox:test-messaging-outbox-dependencies
# template:begin test-operation-context:test-operation-context-dependencies
operation-context = { workspace = true }
# template:end test-operation-context:test-operation-context-dependencies
# template:begin test-digest:test-digest-dependency
sha2 = { workspace = true }
# template:end test-digest:test-digest-dependency
# template:begin outbound-http:test-outbound-http-dependencies
infra-outbound-http = { workspace = true, features = ["test-support"] }
wiremock = { workspace = true }
# template:end outbound-http:test-outbound-http-dependencies
# template:begin inbound-webhooks:test-inbound-webhooks-dependencies
http = { workspace = true }
tower = { workspace = true, features = ["util"] }
# template:end inbound-webhooks:test-inbound-webhooks-dependencies
# template:begin test-runtime:test-runtime-dependencies
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net", "process", "test-util"] }
# template:end test-runtime:test-runtime-dependencies
# template:begin postgres:test-postgres-health-dependency
axum = { workspace = true, features = ["json", "query"] }
backon = { workspace = true, features = ["tokio-sleep"] }
derive_more = { workspace = true, features = ["display", "as_ref", "from", "error"] }
futures-util = { workspace = true, features = ["std", "async-await"] }
infra-http = { workspace = true }
infra-http-transport = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
tempfile = { workspace = true, features = ["getrandom"] }
utoipa = { workspace = true, features = ["macros"] }
health = { workspace = true }
tracing = { workspace = true }
observe-test-support = { workspace = true }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
tls-test-support = { workspace = true }
# template:end postgres:test-postgres-health-dependency
# template:begin postgres:test-migrate-dependency
migrate = { workspace = true }
# template:end postgres:test-migrate-dependency
# template:begin test-metrics:test-metrics-dependency
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
# template:end test-metrics:test-metrics-dependency
# template:begin http-idempotency:test-http-idempotency-dependencies
infra-idempotency-store = { workspace = true }
metrics-util = { workspace = true, features = ["debugging"] }
# template:end http-idempotency:test-http-idempotency-dependencies
# template:begin postgres-grpc-consumers:test-postgres-grpc-consumer-dependencies
infra-grpc = { workspace = true }
infra-outbound-grpc = { workspace = true }
grpc-contracts = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
# template:end postgres-grpc-consumers:test-postgres-grpc-consumer-dependencies
# template:begin test-introspection-fixtures:test-introspection-fixture-dependencies
infra-bearerauthn = { workspace = true, features = ["test-support"] }
secrecy = { workspace = true }
# template:end test-introspection-fixtures:test-introspection-fixture-dependencies
# template:begin http-idempotency-mounted:test-http-idempotency-mounted-dependencies
axum-test = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
# template:end http-idempotency-mounted:test-http-idempotency-mounted-dependencies
# template:begin jobs:test-jobs-dev-dependencies
base64 = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std", "serde", "serde-well-known", "formatting", "parsing", "macros"] }
uuid = { workspace = true, features = ["std", "serde", "v4"] }
# template:end jobs:test-jobs-dev-dependencies
# template:begin test-signal:test-signal-dev-dependency
nix = { workspace = true, features = ["signal"] }
# template:end test-signal:test-signal-dev-dependency
# template:begin temporal-only:test-temporal-only-dev-dependencies
tokio-util = { workspace = true, features = ["rt"] }
url = { workspace = true }
# template:end temporal-only:test-temporal-only-dev-dependencies

# template:begin jobs:test-jobs-worker-fixture
[[bin]]
name = "jobs-worker-fixture"
path = "src/bin/jobs_worker_fixture.rs"
required-features = ["integration"]
test = false
# template:end jobs:test-jobs-worker-fixture

# template:begin jobs-reference:test-reading-counter-fixture
[[bin]]
name = "reading-counter-fixture"
path = "src/bin/reading_counter_fixture.rs"
required-features = ["integration"]
test = false
# template:end jobs-reference:test-reading-counter-fixture

# template:begin temporal:test-temporal-worker-fixture
[[bin]]
name = "temporal-worker-fixture"
path = "src/bin/temporal_worker_fixture.rs"
required-features = ["integration"]
test = false
# template:end temporal:test-temporal-worker-fixture

# template:begin postgres:test-postgres-integration-target
[[test]]
name = "postgres"
path = "tests/postgres.rs"
required-features = ["integration"]
# template:end postgres:test-postgres-integration-target

# template:begin http-idempotency:test-http-idempotency-integration-target
[[test]]
name = "http_idempotency"
path = "tests/http_idempotency/main.rs"
required-features = ["integration"]
# template:end http-idempotency:test-http-idempotency-integration-target

# template:begin jobs:test-jobs-integration-target
[[test]]
name = "jobs"
path = "tests/jobs/main.rs"
required-features = ["integration"]
# template:end jobs:test-jobs-integration-target

# template:begin webhooks-common:test-webhooks-integration-target
[[test]]
name = "webhooks"
path = "tests/webhooks/main.rs"
required-features = ["integration"]
# template:end webhooks-common:test-webhooks-integration-target

# template:begin outbox:test-outbox-integration-targets
[[test]]
name = "messaging_outbox"
path = "tests/messaging_outbox.rs"
required-features = ["integration"]

[[test]]
name = "messaging_recovery"
path = "tests/messaging_recovery.rs"
required-features = ["integration"]
# template:end outbox:test-outbox-integration-targets

# template:begin temporal:test-temporal-integration-target
[[test]]
name = "temporal"
path = "tests/temporal.rs"
required-features = ["integration"]
# template:end temporal:test-temporal-integration-target
