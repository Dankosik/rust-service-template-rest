[package]
name = "integration-tests"
description = "Database-backed proof for the PostgreSQL profile; runs only with the `integration` feature and a live DATABASE_URL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `make test` builds this crate with the feature off, so no test here needs
# Docker; `scripts/ci/test-integration-db.sh` turns it on with a live server.
integration = []

[dependencies]
infra-postgres = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "macros"] }
url = { workspace = true }

[dev-dependencies]
health = { workspace = true }
migrate = { workspace = true }
