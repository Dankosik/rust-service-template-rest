[package]
name = "integration-tests"
description = "Executable utility recipes and selected integration proof."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

# template:begin postgres:test-integration-feature
[features]
# Utility recipes run with `make test` and need no Docker or external service.
# PostgreSQL tests alone require `integration` and a live DATABASE_URL.
integration = []
# template:end postgres:test-integration-feature

# template:begin postgres:test-postgres-dependencies
[dependencies]
url = { workspace = true }
infra-postgres = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "macros"] }
# template:end postgres:test-postgres-dependencies
# template:begin jobs:test-jobs-dependencies
infra-jobs = { workspace = true }
jobs-worker = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
tokio = { workspace = true, features = ["time"] }
# template:end jobs:test-jobs-dependencies

[dev-dependencies]
url = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
wiremock = { workspace = true }
moka = { workspace = true, features = ["future"] }
backon = { workspace = true, features = ["tokio-sleep"] }
proptest = { workspace = true, features = ["std"] }
insta = { workspace = true, features = ["json"] }
validator = { workspace = true, features = ["derive"] }
bon = { workspace = true }
time = { workspace = true, features = ["std", "serde", "serde-well-known", "formatting", "parsing", "macros"] }
rust_decimal = { workspace = true, features = ["std", "serde-with-str"] }
uuid = { workspace = true, features = ["std", "serde", "v4"] }
json-patch = { workspace = true }
semver = { workspace = true, features = ["std"] }
ipnet = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["std"] }
csv = { workspace = true }
camino = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
fs-err = { workspace = true }
strsim = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-normalization = { workspace = true, features = ["std"] }
regex = { workspace = true, features = ["std", "unicode", "perf"] }
bstr = { workspace = true, features = ["std"] }
heck = { workspace = true }
bytes = { workspace = true, features = ["std"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "net", "test-util"] }
futures-util = { workspace = true, features = ["std", "async-await"] }
infra-http = { workspace = true }
axum-test = { workspace = true }
axum-extra = { workspace = true, features = ["query", "typed-header"] }
axum = { workspace = true, features = ["json", "query"] }
derive_more = { workspace = true, features = ["display", "as_ref", "from"] }
serde_with = { workspace = true, features = ["std", "macros"] }
serde_json = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
indexmap = { workspace = true, features = ["std"] }
itertools = { workspace = true, features = ["use_std"] }
# template:begin postgres:test-postgres-health-dependency
health = { workspace = true }
# template:end postgres:test-postgres-health-dependency
# template:begin postgres:test-migrate-dependency
migrate = { workspace = true }
# template:end postgres:test-migrate-dependency
# template:begin http-idempotency:test-http-idempotency-dependencies
infra-idempotency-store = { workspace = true }
# template:end http-idempotency:test-http-idempotency-dependencies
# template:begin http-idempotency-mounted:test-http-idempotency-mounted-dependencies
infra-bearerauthn = { workspace = true, features = ["test-support"] }
tokio-rustls = { workspace = true, features = ["aws_lc_rs", "tls12"] }
secrecy = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum = { workspace = true }
async-trait = { workspace = true }
# template:end http-idempotency-mounted:test-http-idempotency-mounted-dependencies
# template:begin jobs:test-jobs-dev-dependencies
nix = { workspace = true, features = ["signal"] }
ureq = { workspace = true }
# template:end jobs:test-jobs-dev-dependencies

# template:begin jobs:test-jobs-worker-fixture
[[bin]]
name = "jobs-worker-fixture"
path = "src/bin/jobs_worker_fixture.rs"
required-features = ["integration"]
test = false
# template:end jobs:test-jobs-worker-fixture
