# Bug-finding Python lint for the validation scripts; `make python-lint`.
# Defects only: no formatter gate and no style rules.
line-length = 100
# Vendored upstream sources are archival, not this service's code.
extend-exclude = ["vendor"]

[lint]
# Bug-finding rulesets only (no formatting or style-rewrite rules):
# E4/E7/E9 import/statement/syntax, F pyflakes, B bugbear, PLE pylint errors,
# RUF ruff defects (unused noqa, mutable defaults, ambiguous unicode),
# PIE misc defects, C4 comprehensions, ISC implicit string concatenation,
# T10 debugger leftovers, LOG/G logging defects, PGH blanket noqa/type-ignore.
select = ["E4", "E7", "E9", "F", "B", "PLE", "RUF", "PIE", "C4", "ISC", "T10", "LOG", "G", "PGH"]
ignore = ["B904", "B905"]

[lint.per-file-ignores]
# Tests insert the script directory into sys.path before importing it, and
# build closures inside `subTest` or retry loops that run before the next
# iteration rebinds the variable.
"scripts/tests/*.py" = ["E402", "B023"]
